<style>
/* Layout: projector stage — header controls, grouped tabs, two-column slide (text + steps | animation), fixed footer for slide + step control */
:root{
  --bg:#eceff1; --panel:#ffffff; --ink:#132029; --muted:#55636e; --line:#c6cfd6;
  --accent:#0a6880; --accent-ink:#ffffff; --hlbg:#fff1cc; --metal:#dce3e8;
  --phase:#c3161c; --neutral:#1a1f24; --earth:#1b8538; --fault:#d47500; --core:#7d8891;
  --good:#1b8538; --bad:#c3161c; --ry:#a87800; --rb:#1556c0;
  --plastic:#fbfbf6; --plastic-edge:#8f999f; --plastic-ink:#1c2328; --slot:#c7cdd2; --lever:#27406a; --tbtn:#d9a400;
  --f-disp:"Barlow Condensed","Noto Sans Devanagari","Noto Sans Malayalam","Arial Narrow",sans-serif;
  --f-body:"Noto Sans","Noto Sans Devanagari","Noto Sans Malayalam",system-ui,sans-serif;
  --scale:1; --swm:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="contrast"]){
    --bg:#0e151b; --panel:#162029; --ink:#e6ecf0; --muted:#9aa9b4; --line:#2d3b46;
    --accent:#4ec4dd; --accent-ink:#04262f; --hlbg:#2e2711; --metal:#24313b;
    --phase:#ff5b60; --neutral:#d3d9df; --earth:#4fd072; --fault:#ffb02e; --core:#8d99a3;
    --good:#4fd072; --bad:#ff5b60; --ry:#ffd23f; --rb:#62a2ff;
    --plastic:#e2e5e7; --plastic-edge:#7e888e; --slot:#b4bbc0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151b; --panel:#162029; --ink:#e6ecf0; --muted:#9aa9b4; --line:#2d3b46;
  --accent:#4ec4dd; --accent-ink:#04262f; --hlbg:#2e2711; --metal:#24313b;
  --phase:#ff5b60; --neutral:#d3d9df; --earth:#4fd072; --fault:#ffb02e; --core:#8d99a3;
  --good:#4fd072; --bad:#ff5b60; --ry:#ffd23f; --rb:#62a2ff;
  --plastic:#e2e5e7; --plastic-edge:#7e888e; --slot:#b4bbc0; color-scheme:dark;
}
:root[data-theme="contrast"]{
  --bg:#000000; --panel:#000000; --ink:#ffffff; --muted:#ffffff; --line:#ffffff;
  --accent:#ffff00; --accent-ink:#000000; --hlbg:#3a3a00; --metal:#000000;
  --phase:#ff4545; --neutral:#ffffff; --earth:#00ff6a; --fault:#ff9d00; --core:#c8c8c8;
  --good:#00ff6a; --bad:#ff4545; --ry:#ffff3d; --rb:#4dabff;
  --plastic:#000000; --plastic-edge:#ffffff; --plastic-ink:#ffffff; --slot:#333333; --lever:#ffffff; --tbtn:#ffff00;
  --swm:1.35; color-scheme:dark;
}
html,body{height:100%}
html{font-size:calc(clamp(15px, 9.6px + 0.75vw, 26px) * var(--scale))}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.45}
#app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;padding-inline:clamp(16px,2vw,40px)}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem 1.2rem;padding-block:.6rem .3rem;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.7rem;min-width:0}
.plate{font-family:var(--f-disp);font-weight:700;font-size:1rem;letter-spacing:.04em;border:2px solid var(--ink);border-radius:4px;padding:.05em .45em;line-height:1.2;font-variant-numeric:tabular-nums}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:1.35rem;margin:0;line-height:1.15;text-wrap:balance}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.ctrls{display:flex;flex-wrap:wrap;gap:.5rem .9rem;align-items:center}
.grp{display:flex;gap:.25rem;align-items:center}
.grp .lab{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:.2rem}
.btn{font:600 .85rem/1.1 var(--f-body);color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:6px;padding:.45em .75em;min-height:2.3em;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.tab:focus-visible,.steps li:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:.35rem;overflow-x:auto;padding-block:.5rem;scrollbar-width:thin}
.tab{flex:0 0 auto;display:flex;align-items:baseline;gap:.4em;font:600 .85rem/1.1 var(--f-body);color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:5px;padding:.45em .7em;cursor:pointer}
.tab b{font-family:var(--f-disp);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 -4px 0 var(--accent)}
.tabsep{flex:0 0 auto;align-self:center;font-family:var(--f-disp);font-weight:700;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-inline:.5rem .2rem;border-left:2px solid var(--line);margin-left:.3rem}
.tabsep:first-child{border-left:0;margin-left:0;padding-left:0}

main{min-height:0;overflow:auto;padding-block:.4rem .6rem}
.slide{height:100%;min-height:0}
.kind-svg{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.5fr);gap:clamp(1rem,2.2vw,2.4rem)}
.txt{min-width:0;overflow:auto;padding-right:.3rem}
.txt h2{font-family:var(--f-disp);font-weight:700;font-size:2.05rem;line-height:1.1;margin:.1rem 0 .55rem;text-wrap:balance}
.pts{margin:0 0 .8rem;padding-left:1.15em;font-size:1.02rem;display:grid;gap:.3rem}
.pts li::marker{color:var(--accent)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:.3rem;border-top:1px solid var(--line);padding-top:.6rem}
.steps li{display:grid;grid-template-columns:2em minmax(0,1fr);gap:.6em;align-items:start;padding:.35em .5em;border-radius:6px;font-size:.98rem;cursor:pointer;color:var(--muted)}
.steps li .n{display:grid;place-items:center;width:1.75em;height:1.75em;border-radius:50%;border:2px solid var(--line);font-family:var(--f-disp);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.steps li.done{color:var(--ink)}
.steps li.done .n{border-color:var(--ink);color:var(--ink)}
.steps li.cur{background:var(--hlbg);color:var(--ink);font-weight:600}
.steps li.cur .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fig{min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.5rem;display:flex;align-items:center;justify-content:center}
.fig svg{width:100%;height:100%;max-height:100%;display:block}

svg text{font-family:var(--f-body)}
svg .b{font-weight:700}
.t-sm{font-size:calc(17px * (.6 + .4 * var(--scale)))}
.t-md{font-size:calc(21px * (.6 + .4 * var(--scale)))}
.t-lg{font-size:calc(30px * (.6 + .4 * var(--scale)))}
.t-xl{font-size:calc(46px * (.6 + .4 * var(--scale)));font-family:var(--f-disp)}
.tx{fill:var(--ink)} .tx-m{fill:var(--muted)} .tx-L{fill:var(--phase)} .tx-N{fill:var(--neutral)} .tx-Y{fill:var(--ry)} .tx-B{fill:var(--rb)}
.tx-f{fill:var(--fault)} .tx-a{fill:var(--accent)} .tx-bad{fill:var(--bad)} .tx-good{fill:var(--good)} .tx-ai{fill:var(--accent-ink)}
.wL,.wN,.wE,.wY,.wB{fill:none;stroke-width:calc(4px * var(--swm));stroke-linecap:round;stroke-linejoin:round}
.wL{stroke:var(--phase)} .wN{stroke:var(--neutral)} .wE{stroke:var(--earth)} .wY{stroke:var(--ry)} .wB{stroke:var(--rb)}
.dash{stroke-dasharray:8 8}
.ink-s{fill:none;stroke:var(--ink);stroke-width:calc(2.5px * var(--swm));stroke-linecap:round;stroke-linejoin:round}
.ink-s.thick{stroke-width:calc(5px * var(--swm))}
.dot{fill:var(--ink);stroke:none}
.box{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.metal{fill:var(--metal);stroke:var(--ink);stroke-width:calc(3px * var(--swm))}
.motor,.coil,.relay{fill:var(--panel);stroke:var(--ink);stroke-width:calc(2.5px * var(--swm))}
.plunger{fill:var(--core);stroke:var(--ink);stroke-width:2}
.core{fill:none;stroke:var(--core);stroke-width:18;opacity:.9}
.core.sat{stroke:var(--bad);opacity:.75}
.dcs{fill:none;stroke:var(--accent);stroke-width:8}
.mech{fill:none;stroke:var(--muted);stroke-width:calc(2.5px * var(--swm));stroke-dasharray:7 6}
.bolt{fill:var(--fault);stroke:none}
.pipe{fill:none;stroke:var(--core);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.person{fill:none;stroke:var(--ink);stroke-width:calc(4px * var(--swm));stroke-linecap:round}
.head{fill:var(--panel);stroke:var(--ink);stroke-width:calc(3px * var(--swm))}
.xmark{fill:none;stroke:var(--bad);stroke-width:5;stroke-linecap:round}
.bimetal{fill:none;stroke:var(--core);stroke-width:11;stroke-linecap:round}
.heat{fill:none;stroke:var(--fault);stroke-width:3;stroke-linecap:round}
.latch{fill:var(--metal);stroke:var(--ink);stroke-width:2}
.track{fill:var(--line)} .fill-good{fill:var(--good)} .fill-warn{fill:var(--fault)} .fill-acc{fill:var(--accent)} .fill-bad{fill:var(--bad)}
.ptr{fill:var(--ink)}
.rcdline{stroke:var(--accent);stroke-width:4;stroke-dasharray:10 6;fill:none}
.ovl{fill:var(--accent)}
.scope{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.axis{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4}
.wave{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.car{fill:var(--metal);stroke:var(--ink);stroke-width:2.5}
.phone{fill:var(--ink)} .screen{fill:var(--bg)}
.wifi{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.fbox{fill:var(--panel);stroke:var(--ink);stroke-width:2}
.fbox.dashb{stroke-dasharray:8 6}
/* device front views */
.plas{fill:var(--plastic);stroke:var(--plastic-edge);stroke-width:2}
.pt{fill:var(--plastic-ink)}
.screw{fill:var(--core);stroke:var(--plastic-ink);stroke-width:1.5}
.ink-p{fill:none;stroke:var(--plastic-ink);stroke-width:1.5}
.slot{fill:var(--slot)}
.lever{fill:var(--lever)}
.tbtn{fill:var(--tbtn)} .tbt{fill:#1c2328}
.led{fill:var(--good)} .led.red{fill:var(--bad)} .ledoff{fill:var(--slot)}
.knob{fill:var(--core);stroke:var(--plastic-ink);stroke-width:1.5}
.lcd{fill:var(--bg);stroke:var(--plastic-ink);stroke-width:1.5}

.flow{fill:none;stroke:var(--fault);stroke-width:calc(6px * var(--swm));stroke-dasharray:10 12;stroke-linecap:round;stroke-linejoin:round;animation:dash .8s linear infinite}
.flow.acc{stroke:var(--accent);stroke-width:calc(4px * var(--swm))}
.flow.rev{animation-direction:reverse}
.flow.fast{animation-duration:.3s;stroke-width:calc(8px * var(--swm))}
.flow.thin{stroke-width:calc(3px * var(--swm))}
@keyframes dash{to{stroke-dashoffset:-22}}
[data-show],[data-hl],[data-dim]{transition:opacity .35s ease, visibility .35s ease}
.off{opacity:0;visibility:hidden}
.dim{opacity:.18}
svg .hl{filter:drop-shadow(0 0 4px var(--accent)) drop-shadow(0 0 2px var(--accent))}

.terms{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:.25rem .7rem;margin:0 0 .8rem;padding:.55rem .75rem;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:.88rem}
.terms dt{font-weight:700;color:var(--accent)}
.terms dd{margin:0}
.badge{fill:var(--panel);stroke:var(--accent);stroke-width:2.5}
.badge-big{fill:var(--accent)}
.kind-table,.kind-list{display:flex;flex-direction:column;gap:.8rem;height:auto}
.kind-table .txt,.kind-list .txt{overflow:visible}
.tblwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:1.05rem}
th,td{padding:.6em .8em;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-family:var(--f-disp);font-size:1.4rem;background:var(--bg)}
tbody th{font-weight:600;color:var(--muted);width:28%}
td.yes{color:var(--good);font-weight:700}
td.no{color:var(--bad);font-weight:700}
tr:last-child th,tr:last-child td{border-bottom:0}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:.5rem;counter-reset:r}
.rules li{counter-increment:r;display:grid;grid-template-columns:2.2em minmax(0,1fr);gap:.6em;align-items:start;background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:.6em .8em;font-size:1.1rem;transition:background .3s,border-color .3s;cursor:pointer}
.rules li::before{content:counter(r);display:grid;place-items:center;width:1.9em;height:1.9em;border-radius:50%;background:var(--ink);color:var(--bg);font-family:var(--f-disp);font-weight:700}
.rules li.hl{background:var(--hlbg);border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

.bot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.5rem 1rem;padding-block:.5rem .7rem;border-top:1px solid var(--line)}
.stepctl{display:flex;align-items:center;gap:.35rem}
.stepctl .cnt{font-family:var(--f-disp);font-weight:700;font-size:1.15rem;min-width:5.5em;text-align:center;font-variant-numeric:tabular-nums}
.credit{font-size:.72rem;color:var(--muted)}
.nav{display:flex;gap:.35rem;align-items:center}
.nav .cnt{font-family:var(--f-disp);font-weight:700;font-size:1.05rem;min-width:3.4em;text-align:center;font-variant-numeric:tabular-nums}

@media (max-width: 900px){
  #app{height:auto;min-height:100%}
  .slide{height:auto}
  .kind-svg{grid-template-columns:minmax(0,1fr)}
  .txt{overflow:visible}
  .fig svg{height:auto}
  main{overflow:visible}
}
@media (prefers-reduced-motion: reduce){
  .flow{animation:none}
  [data-show],[data-hl],[data-dim],.rules li{transition:none}
}
</style>

<div id="app">
  <header class="top">
<meta name="section" content="Protection Devices">

<script>
const L=(en,hi,ml)=>({en,hi,ml});
let lang='en', cur=0, step=1, timer=null, scale=1;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const T=o=>o==null?'':(typeof o==='string'?o:(o[lang]||o.en));

const UI={
  brand:L('Earth Leakage Protection','अर्थ लीकेज सुरक्षा','എർത്ത് ലീക്കേജ് സംരക്ഷണം'),

  prev:L('◀ Previous','◀ पिछला','◀ മുൻപത്തേത്'), next:L('Next ▶','अगला ▶','അടുത്തത് ▶'),
  step:L('Step','चरण','ഘട്ടം'), play:L('Play','चलाएँ','പ്ലേ'), pause:L('Pause','रोकें','നിർത്തുക'), reset:L('Restart','फिर से','വീണ്ടും')
};

const LBL={
  coil:L('Trip coil','ट्रिप कॉइल','ട്രിപ്പ് കോയിൽ'),
  elec:L('Separate earth electrode','अलग अर्थ इलेक्ट्रोड','പ്രത്യേക എർത്ത് ഇലക്ട്രോഡ്'),
  body:L('Metal body','धातु बॉडी','ലോഹ ബോഡി'),

/* ---------- drawing helpers ---------- */
const earthSym=(x,y)=>`<path class="ink-s" d="M${x-24} ${y} H${x+24} M${x-16} ${y+9} H${x+16} M${x-8} ${y+18} H${x+8}"/>`;
const lab=(x,y,k,cls,o={})=>`<text class="${cls}" x="${x}" y="${y}" text-anchor="${o.a||'middle'}"${o.s?` data-show="${o.s}"`:''}${o.h?` data-hl="${o.h}"`:''} data-t="${k}"></text>`;
const txt=(x,y,s,cls,o={})=>`<text class="${cls}" x="${x}" y="${y}" text-anchor="${o.a||'middle'}"${o.s?` data-show="${o.s}"`:''}>${s}</text>`;
function contacts(x1,x2,ys,closed,open){
  return `<path class="ink-s thick" data-show="${closed}" d="${ys.map(y=>`M${x1} ${y} H${x2}`).join(' ')}"/>`+
    `<path class="ink-s thick" data-show="${open}" d="${ys.map(y=>`M${x1} ${y} L${x2-6} ${y-24}`).join(' ')}"/>`+
    ys.map(y=>`<circle class="dot" cx="${x1}" cy="${y}" r="5"/><circle class="dot" cx="${x2}" cy="${y}" r="5"/>`).join('');
}
function wp(t,x0,y0,w,a){
  let d='';
  for(let i=0;i<=w;i+=2){
    const u=i/w, th=u*4*Math.PI; let v=0;
    if(t==='sine') v=Math.sin(th);
    else if(t==='pulse') v=Math.max(Math.sin(th),0);
    else if(t==='mixed') v=.6*Math.sin(th)+.35*Math.sin(th*6);
    else if(t==='dc') v=.75+.04*Math.sin(th*6);
    else if(t==='arc'){const s=Math.sin(th); v=Math.abs(s)<.22?0:s+.22*Math.sin(th*23)*Math.sin(th*7);}
    else if(t==='ripple') v=.12*Math.sin(th);
    else if(t==='spike') v=.12*Math.sin(th)+.95*Math.exp(-Math.pow((u-.5)/.018,2));
    d+=(i?'L':'M')+(x0+i)+' '+(y0-v*a).toFixed(1)+' ';
  }
  return d;
}
function scope(x,y,w,h,key,waves){
  const ay=y+h/2+8;
  return `<rect class="scope" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>`+lab(x+10,y-8,key,'t-sm tx-m b',{a:'start'})+
    `<line class="axis" x1="${x+12}" y1="${ay}" x2="${x+w-12}" y2="${ay}"/>`+
    waves.map(([t,s])=>`<path class="wave" data-show="${s}" d="${wp(t,x+12,ay,w-24,h*.36)}"/>`).join('');
}
function mod(o){
  const {x,y,w,h}=o,p=o.poles||2,cx=x+w/2;
  let s=`<rect class="plas" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>`;
  for(let i=0;i<p;i++){const tx=x+w*(i+.5)/p;[y+20,y+h-20].forEach(ty=>{s+=`<circle class="screw" cx="${tx}" cy="${ty}" r="7"/><path class="ink-p" d="M${tx-5} ${ty} H${tx+5}"/>`;});}
  s+=txt(cx,y+h*.2,o.name,'pt b t-sm');
  const sw=p>2?w*.6:22, sy=y+h*.29, sh=h*.27;
  s+=`<rect class="slot" x="${cx-sw/2}" y="${sy}" width="${sw}" height="${sh}" rx="4"/>`;
  s+=`<rect class="lever"${o.on?` data-show="${o.on}"`:''} x="${cx-sw/2+3}" y="${sy+3}" width="${sw-6}" height="${sh*.42}" rx="3"/>`;
  if(o.off) s+=`<rect class="lever" data-show="${o.off}" x="${cx-sw/2+3}" y="${(sy+sh-3-sh*.42).toFixed(1)}" width="${sw-6}" height="${(sh*.42).toFixed(1)}" rx="3"/>`;
  s+=txt(cx+sw/2+7,sy+14,'I','pt t-sm',{a:'start'})+txt(cx+sw/2+7,sy+sh-2,'O','pt t-sm',{a:'start'});
  s+=txt(cx,y+h*.67,o.rate||'','pt b t-sm');
  if(o.sub) s+=txt(cx,y+h*.76,o.sub,'pt t-sm');
  s+=`<rect class="tbtn" x="${x+w-32}" y="${y+h*.8}" width="22" height="17" rx="3"/><text class="tbt b" style="font-size:11px" x="${x+w-21}" y="${y+h*.8+13}" text-anchor="middle">T</text>`;
  if(o.led) s+=`<circle class="led" cx="${x+18}" cy="${y+h*.8+8}" r="6"/>`;
  s+=lab(cx,y+h+26,'front','t-sm tx-m');
  return s;
}

        L('Normal: body at 0 V, no coil current.','सामान्य: बॉडी 0 V, कॉइल में करंट नहीं।','സാധാരണ: ബോഡി 0 V, കോയിലിൽ കറന്റ് ഇല്ല.'),
        L('Insulation fails: live touches body.','इन्सुलेशन खराब: फेज़ बॉडी से छूता है।','ഇൻസുലേഷൻ തകരാർ: ഫേസ് ബോഡിയിൽ തൊടുന്നു.'),
        L('Fault current flows through coil to earth.','फॉल्ट करंट कॉइल से होकर अर्थ में जाता है।','ഫോൾട്ട് കറന്റ് കോയിലിലൂടെ എർത്തിലേക്ക് ഒഴുകുന്നു.'),
        L('Coil releases latch: supply OFF.','कॉइल लैच छोड़ती है: सप्लाई बंद।','കോയിൽ ലാച്ച് വിടുന്നു: സപ്ലൈ ഓഫ്.')]},

{tab:L('ELCB ✗','ELCB ✗','ELCB ✗'), svg:'why',
 title:L('Why ELCB is not used now','अब ELCB क्यों नहीं','ELCB ഇപ്പോൾ ഉപയോഗിക്കാത്തത് എന്തുകൊണ്ട്'),
 pts:[L('Voltage ELCB is obsolete.','वोल्टेज ELCB अब अप्रचलित है।','വോൾട്ടേജ് ELCB ഇപ്പോൾ കാലഹരണപ്പെട്ടു.'),
      L('In shops, “ELCB” today usually means RCCB.','दुकानों में आज “ELCB” कहने पर प्रायः RCCB मिलता है।','കടകളിൽ ഇന്ന് “ELCB” എന്ന് പറഞ്ഞാൽ സാധാരണ RCCB ആണ് കിട്ടുക.'),
      L('Replaced by RCCB and RCBO.','इसकी जगह RCCB और RCBO।','പകരം RCCB-യും RCBO-യും.')],
 steps:[L('Parallel path (water pipe, steel frame) bypasses the coil.','समानांतर रास्ता (पानी का पाइप, स्टील फ्रेम) कॉइल को बायपास करता है।','സമാന്തര പാത (വാട്ടർ പൈപ്പ്, സ്റ്റീൽ ഫ്രെയിം) കോയിലിനെ ഒഴിവാക്കുന്നു.'),
        L('Person touches live directly: current goes through body to ground, not the coil.','व्यक्ति सीधे फेज़ छूता है: करंट शरीर से ज़मीन में जाता है, कॉइल से नहीं।','വ്യക്തി നേരിട്ട് ഫേസിൽ തൊടുന്നു: കറന്റ് ശരീരത്തിലൂടെ ഭൂമിയിലേക്ക്, കോയിലിലൂടെ അല്ല.'),
        L('Broken earth wire: no protection and no warning.','अर्थ तार टूटा: सुरक्षा नहीं, चेतावनी भी नहीं।','എർത്ത് വയർ പൊട്ടിയാൽ: സംരക്ഷണമില്ല, മുന്നറിയിപ്പുമില്ല.'),
        L('Stray voltages cause false tripping.','बाहरी वोल्टेज से गलत ट्रिपिंग।','പുറമേയുള്ള വോൾട്ടേജ് തെറ്റായ ട്രിപ്പിങ്ങിന് കാരണമാകുന്നു.'),
        L('Replaced by RCCB: it measures current, not voltage.','RCCB ने जगह ली: यह वोल्टेज नहीं, करंट मापता है।','പകരം RCCB: ഇത് വോൾട്ടേജ് അല്ല, കറന്റ് അളക്കുന്നു.')]},

{tab:L('RCCB','RCCB','RCCB'), svg:'rccb',
 title:L('RCCB (current operated)','RCCB (करंट संचालित)','RCCB (കറന്റ് പ്രവർത്തിതം)'),
 pts:[L('Ratings: 30 mA (people), 100 / 300 mA (fire).','रेटिंग: 30 mA (व्यक्ति), 100 / 300 mA (आग)।','റേറ്റിംഗ്: 30 mA (മനുഷ്യർ), 100 / 300 mA (തീ).'),
      L('Trip time: ≤ 300 ms at IΔn, ≤ 40 ms at 5 IΔn.','ट्रिप समय: IΔn पर ≤ 300 ms, 5 IΔn पर ≤ 40 ms।','ട്രിപ്പ് സമയം: IΔn-ൽ ≤ 300 ms, 5 IΔn-ൽ ≤ 40 ms.'),
      L('No overload or short-circuit protection. Use MCB with it.','ओवरलोड या शॉर्ट सर्किट सुरक्षा नहीं। साथ में MCB लगाएँ।','ഓവർലോഡ് / ഷോർട്ട് സർക്യൂട്ട് സംരക്ഷണമില്ല. കൂടെ MCB വേണം.')],
 steps:[L('Phase and neutral both pass through a toroidal core.','फेज़ और न्यूट्रल दोनों टोरॉइडल कोर से गुजरते हैं।','ഫേസും ന്യൂട്രലും ടൊറോയ്ഡൽ കോറിലൂടെ കടന്നുപോകുന്നു.'),
        L('Normal: I(L) = I(N). Fluxes cancel. Net flux = 0.','सामान्य: I(L) = I(N)। फ्लक्स रद्द। कुल फ्लक्स = 0।','സാധാരണ: I(L) = I(N). ഫ്ലക്സുകൾ റദ്ദാകുന്നു. ആകെ ഫ്ലക്സ് = 0.'),
        L('Leakage to earth: I(L) > I(N).','अर्थ में लीकेज: I(L) > I(N)।','എർത്തിലേക്ക് ലീക്കേജ്: I(L) > I(N).'),
        L('Net flux induces voltage in the secondary coil.','शेष फ्लक्स सेकेंडरी कॉइल में वोल्टेज बनाता है।','ബാക്കി ഫ്ലക്സ് സെക്കൻഡറി കോയിലിൽ വോൾട്ടേജ് ഉണ്ടാക്കുന്നു.'),
        L('Trip relay opens both L and N: OFF.','ट्रिप रिले L और N दोनों खोलता है: बंद।','ട്രിപ്പ് റിലേ L-ഉം N-ഉം തുറക്കുന്നു: ഓഫ്.'),
        L('Fault removed, RCCB switched ON. Press TEST: current flows through R and bypasses the core.','फॉल्ट हटाया, RCCB चालू किया। TEST दबाएँ: करंट R से होकर कोर को बायपास करता है।','ഫോൾട്ട് മാറ്റി RCCB ഓൺ ചെയ്തു. TEST അമർത്തുക: കറന്റ് R-ലൂടെ കോറിനെ ഒഴിവാക്കി ഒഴുകുന്നു.'),
        L('Core sees imbalance → relay trips: OFF. RCCB is healthy.','कोर असंतुलन देखता है → रिले ट्रिप: बंद। RCCB ठीक है।','കോർ അസന്തുലനം കാണുന്നു → റിലേ ട്രിപ്പ്: ഓഫ്. RCCB ശരിയാണ്.')]},

{tab:L('RCBO','RCBO','RCBO'), svg:'rcbo',
 title:L('RCBO = RCCB + MCB','RCBO = RCCB + MCB','RCBO = RCCB + MCB'),
 pts:[L('One device: overload + short circuit + earth leakage.','एक डिवाइस: ओवरलोड + शॉर्ट सर्किट + अर्थ लीकेज।','ഒരു ഉപകരണം: ഓവർലോഡ് + ഷോർട്ട് സർക്യൂട്ട് + എർത്ത് ലീക്കേജ്.'),
      L('Each fault trips the same latch.','हर फॉल्ट उसी लैच को ट्रिप करता है।','ഓരോ ഫോൾട്ടും ഒരേ ലാച്ച് ട്രിപ്പ് ചെയ്യുന്നു.'),
      L('RCBO per circuit: a fault trips only that circuit.','हर सर्किट पर RCBO: फॉल्ट से केवल वही सर्किट ट्रिप।','ഓരോ സർക്യൂട്ടിനും RCBO: ഫോൾട്ട് ആ സർക്യൂട്ട് മാത്രം ട്രിപ്പ് ചെയ്യും.')],
 steps:[L('Normal: current within rating.','सामान्य: करंट रेटिंग के भीतर।','സാധാരണ: കറന്റ് റേറ്റിംഗിനുള്ളിൽ.'),
        L('Overload: bimetal heats and bends.','ओवरलोड: बाइमेटल गर्म होकर मुड़ता है।','ഓവർലോഡ്: ബൈമെറ്റൽ ചൂടായി വളയുന്നു.'),
        L('Bimetal pushes latch: OFF.','बाइमेटल लैच को धकेलता है: बंद।','ബൈമെറ്റൽ ലാച്ച് തള്ളുന്നു: ഓഫ്.'),
        L('Reset. Short circuit: coil pulls plunger instantly.','फिर चालू। शॉर्ट सर्किट: कॉइल तुरंत प्लंजर खींचती है।','വീണ്ടും ഓൺ. ഷോർട്ട് സർക്യൂട്ട്: കോയിൽ ഉടൻ പ്ലഞ്ചർ വലിക്കുന്നു.'),
        L('Plunger hits latch: OFF.','प्लंजर लैच पर लगता है: बंद।','പ്ലഞ്ചർ ലാച്ചിൽ തട്ടുന്നു: ഓഫ്.'),
        L('Reset. Earth leakage: toroid senses imbalance.','फिर चालू। अर्थ लीकेज: टोरॉइड असंतुलन पहचानता है।','വീണ്ടും ഓൺ. എർത്ത് ലീക്കേജ്: ടൊറോയ്ഡ് അസന്തുലനം തിരിച്ചറിയുന്നു.'),
        L('Relay releases latch: OFF.','रिले लैच छोड़ता है: बंद।','റിലേ ലാച്ച് വിടുന്നു: ഓഫ്.')]},

{tab:L('What is RCD','RCD क्या है','RCD എന്ത്'), svg:'family',
 title:L('What is an RCD?','RCD क्या है?','RCD എന്നാൽ എന്ത്?'),
 pts:[L('RCD = Residual Current Device. It is the family name.','RCD = रेज़िडुअल करंट डिवाइस। यह परिवार का नाम है।','RCD = റെസിഡ്യുവൽ കറന്റ് ഡിവൈസ്. ഇത് കുടുംബപ്പേരാണ്.'),
      L('Residual current = sum of all live conductor currents. Normally zero.','रेज़िडुअल करंट = सभी लाइव कंडक्टरों के करंट का योग। सामान्यतः शून्य।','റെസിഡ്യുവൽ കറന്റ് = എല്ലാ ലൈവ് കണ്ടക്ടറുകളിലെയും കറന്റിന്റെ തുക. സാധാരണ പൂജ്യം.'),
      L('Every RCCB is an RCD. Not every RCD is an RCCB.','हर RCCB एक RCD है। हर RCD, RCCB नहीं है।','എല്ലാ RCCB-യും RCD ആണ്. എല്ലാ RCD-യും RCCB അല്ല.')],
 steps:[L('RCCB: leakage only, no overload or short-circuit protection.','RCCB: केवल लीकेज, ओवरलोड या शॉर्ट सर्किट सुरक्षा नहीं।','RCCB: ലീക്കേജ് മാത്രം, ഓവർലോഡ് / ഷോർട്ട് സർക്യൂട്ട് സംരക്ഷണമില്ല.'),
        L('RCBO: RCD and MCB in one device.','RCBO: RCD और MCB एक ही डिवाइस में।','RCBO: RCD-യും MCB-യും ഒരു ഉപകരണത്തിൽ.'),
        L('SRCD: a socket outlet with an RCD inside. It protects only that socket and what is plugged in.','SRCD: अंदर RCD वाला सॉकेट। यह केवल उसी सॉकेट और उसमें लगे उपकरण की सुरक्षा करता है।','SRCD: ഉള്ളിൽ RCD ഉള്ള സോക്കറ്റ്. ആ സോക്കറ്റിനും അതിൽ ഘടിപ്പിച്ചതിനും മാത്രം സംരക്ഷണം.'),
        L('PRCD: a portable RCD that plugs in between the socket and a power tool. It protects the worker even if the site wiring has no RCD.','PRCD: सॉकेट और पावर टूल के बीच लगने वाला पोर्टेबल RCD। साइट वायरिंग में RCD न हो तब भी कारीगर सुरक्षित।','PRCD: സോക്കറ്റിനും പവർ ടൂളിനും ഇടയിൽ ഘടിപ്പിക്കുന്ന പോർട്ടബിൾ RCD. സൈറ്റ് വയറിംഗിൽ RCD ഇല്ലെങ്കിലും തൊഴിലാളി സുരക്ഷിതൻ.'),
        L('ELR + CBCT: a ring CT (CBCT) around all live cables sends the leakage signal to a relay (ELR), which trips a big breaker. CBR: an MCCB with a built-in RCD. Both are used where current is too large for an RCCB (above 100 A).','ELR + CBCT: सभी लाइव केबल के चारों ओर छल्ला CT (CBCT) लीकेज सिग्नल रिले (ELR) को भेजता है, जो बड़े ब्रेकर को ट्रिप करता है। CBR: अंदर RCD वाला MCCB। दोनों वहाँ लगते हैं जहाँ करंट RCCB के लिए बहुत अधिक हो (100 A से ऊपर)।','ELR + CBCT: എല്ലാ ലൈവ് കേബിളുകൾക്കും ചുറ്റുമുള്ള വളയ CT (CBCT) ലീക്കേജ് സിഗ്നൽ റിലേയിലേക്ക് (ELR) അയക്കുന്നു; അത് വലിയ ബ്രേക്കർ ട്രിപ്പ് ചെയ്യുന്നു. CBR: ഉള്ളിൽ RCD ഉള്ള MCCB. കറന്റ് RCCB-ക്ക് കൂടുതലായ ഇടങ്ങളിൽ (100 A-ക്ക് മുകളിൽ) ഇവ ഉപയോഗിക്കുന്നു.'),
        L('Voltage ELCB senses voltage, so it is not an RCD.','वोल्टेज ELCB वोल्टेज पहचानता है, इसलिए यह RCD नहीं है।','വോൾട്ടേജ് ELCB വോൾട്ടേജ് ആണ് അളക്കുന്നത്, അതിനാൽ ഇത് RCD അല്ല.')]},

{tab:L('RCD types','RCD प्रकार','RCD തരങ്ങൾ'), svg:'types',
 title:L('RCD types: AC, A, F, B','RCD के प्रकार: AC, A, F, B','RCD തരങ്ങൾ: AC, A, F, B'),
 pts:[L('Type = which leakage waveform the RCD can detect.','प्रकार = RCD कौन-सी लीकेज तरंग पहचान सकता है।','തരം = RCD-ക്ക് തിരിച്ചറിയാൻ കഴിയുന്ന ലീക്കേജ് തരംഗം.'),
      L('Electronic loads with rectifiers leak DC.','रेक्टिफायर वाले इलेक्ट्रॉनिक लोड DC लीक करते हैं।','റെക്റ്റിഫയർ ഉള്ള ഇലക്ട്രോണിക് ലോഡുകൾ DC ചോർത്തുന്നു.'),
      L('The type symbol is printed on the device.','प्रकार का चिह्न डिवाइस पर छपा होता है।','തരം ചിഹ്നം ഉപകരണത്തിൽ അച്ചടിച്ചിരിക്കും.')],
 steps:[L('Type AC: heater or lamp leaks pure AC.','टाइप AC: हीटर या लैंप शुद्ध AC लीक करता है।','ടൈപ്പ് AC: ഹീറ്റർ / ലാമ്പ് ശുദ്ധ AC ചോർത്തുന്നു.'),
        L('Type A: diode load (washing machine) leaks pulsating DC.','टाइप A: डायोड लोड (वॉशिंग मशीन) स्पंदित DC लीक करता है।','ടൈപ്പ് A: ഡയോഡ് ലോഡ് (വാഷിങ് മെഷീൻ) സ്പന്ദിക്കുന്ന DC ചോർത്തുന്നു.'),
        L('Type F: single-phase VFD leaks mixed frequencies.','टाइप F: सिंगल-फेज़ VFD मिश्रित आवृत्ति लीक करता है।','ടൈപ്പ് F: സിംഗിൾ-ഫേസ് VFD മിശ്ര ആവൃത്തി ചോർത്തുന്നു.'),
        L('Type B: EV charger or 3-phase VFD leaks smooth DC. Extra DC sensor.','टाइप B: EV चार्जर या 3-फेज़ VFD स्मूथ DC लीक करता है। अतिरिक्त DC सेंसर।','ടൈപ്പ് B: EV ചാർജർ / 3-ഫേസ് VFD സ്മൂത്ത് DC ചോർത്തുന്നു. അധിക DC സെൻസർ.'),
        L('Smooth DC saturates a Type AC or A core: it becomes blind.','स्मूथ DC टाइप AC या A कोर को सैचुरेट करता है: वह अंधा हो जाता है।','സ്മൂത്ത് DC ടൈപ്പ് AC / A കോറിനെ സാച്ചുറേറ്റ് ചെയ്യുന്നു: അത് അന്ധമാകുന്നു.')]},

{sep:L('New devices','नए उपकरण','പുതിയ ഉപകരണങ്ങൾ'), tab:L('AFDD','AFDD','AFDD'), svg:'afdd',
 title:L('AFDD: arc fault detection device','AFDD: आर्क फॉल्ट डिटेक्शन डिवाइस','AFDD: ആർക്ക് ഫോൾട്ട് ഡിറ്റക്ഷൻ ഡിവൈസ്'),
 pts:[L('Detects arcs from loose terminals, crushed or rat-bitten cables.','ढीले टर्मिनल, दबी या चूहे से कटी केबल की आर्क पहचानता है।','അയഞ്ഞ ടെർമിനൽ, ചതഞ്ഞതോ എലി കടിച്ചതോ ആയ കേബിളിലെ ആർക്ക് കണ്ടെത്തുന്നു.'),
      L('MCB and RCD cannot detect a series arc.','MCB और RCD सीरीज़ आर्क नहीं पहचान सकते।','MCB-ക്കും RCD-ക്കും സീരീസ് ആർക്ക് കണ്ടെത്താനാവില്ല.'),
      L('Standard IEC 62606. Often combined with an RCBO.','मानक IEC 62606। प्रायः RCBO के साथ संयुक्त।','മാനദണ്ഡം IEC 62606. പലപ്പോഴും RCBO-യോടൊപ്പം.')],
 steps:[L('Normal: smooth sine current.','सामान्य: साफ़ साइन करंट।','സാധാരണ: സുഗമമായ സൈൻ കറന്റ്.'),
        L('Loose terminal makes a series arc. Current stays below MCB rating.','ढीला टर्मिनल सीरीज़ आर्क बनाता है। करंट MCB रेटिंग से कम रहता है।','അയഞ്ഞ ടെർമിനൽ സീരീസ് ആർക്ക് ഉണ്ടാക്കുന്നു. കറന്റ് MCB റേറ്റിംഗിൽ താഴെ.'),
        L('HF sensor sees noise and flat zero zones. μP recognises an arc.','HF सेंसर शोर और समतल शून्य भाग देखता है। μP आर्क पहचानता है।','HF സെൻസർ ശബ്ദവും പരന്ന പൂജ്യഭാഗങ്ങളും കാണുന്നു. μP ആർക്ക് തിരിച്ചറിയുന്നു.'),
        L('AFDD trips: fire prevented.','AFDD ट्रिप: आग रुकी।','AFDD ട്രിപ്പ്: തീ തടഞ്ഞു.')]},

{tab:L('EV / Type B','EV / टाइप B','EV / ടൈപ്പ് B'), svg:'ev',
 title:L('EV charging: Type B and RDC-DD','EV चार्जिंग: टाइप B और RDC-DD','EV ചാർജിങ്: ടൈപ്പ് B, RDC-DD'),
 pts:[L('EV and solar inverters can leak smooth DC.','EV और सोलर इन्वर्टर स्मूथ DC लीक कर सकते हैं।','EV-യും സോളാർ ഇൻവെർട്ടറും സ്മൂത്ത് DC ചോർത്താം.'),
      L('RDC-DD: 6 mA DC detecting device (IEC 62955).','RDC-DD: 6 mA DC पहचानने वाला डिवाइस (IEC 62955)।','RDC-DD: 6 mA DC കണ്ടെത്തുന്ന ഉപകരണം (IEC 62955).'),
      L('Type B RCCB: AC + pulsating DC + smooth DC.','टाइप B RCCB: AC + स्पंदित DC + स्मूथ DC।','ടൈപ്പ് B RCCB: AC + സ്പന്ദിക്കുന്ന DC + സ്മൂത്ത് DC.')],
 steps:[L('Charging: AC to car, on-board charger makes DC.','चार्जिंग: कार को AC, ऑन-बोर्ड चार्जर DC बनाता है।','ചാർജിങ്: കാറിലേക്ക് AC, ഓൺ-ബോർഡ് ചാർജർ DC ആക്കുന്നു.'),
        L('Insulation fault in car: smooth DC 6 mA leaks to earth.','कार में इन्सुलेशन फॉल्ट: 6 mA स्मूथ DC अर्थ में लीक।','കാറിൽ ഇൻസുലേഷൻ ഫോൾട്ട്: 6 mA സ്മൂത്ത് DC എർത്തിലേക്ക്.'),
        L('DC magnetises the Type A core. It may not trip.','DC टाइप A कोर को चुंबकित करता है। ट्रिप न हो।','DC ടൈപ്പ് A കോറിനെ കാന്തീകരിക്കുന്നു. ട്രിപ്പ് ആകാതിരിക്കാം.'),
        L('RDC-DD in the charger detects 6 mA DC and opens the contactor.','चार्जर में RDC-DD 6 mA DC पहचानकर कॉन्टैक्टर खोलता है।','ചാർജറിലെ RDC-DD 6 mA DC കണ്ടെത്തി കോൺടാക്ടർ തുറക്കുന്നു.'),
        L('Or use a Type B RCCB: it detects AC and DC.','या टाइप B RCCB लगाएँ: यह AC और DC दोनों पहचानता है।','അല്ലെങ്കിൽ ടൈപ്പ് B RCCB: ഇത് AC-യും DC-യും കണ്ടെത്തുന്നു.')]},

{tab:L('ARD','ARD','ARD'), svg:'ard',
 title:L('ARD: auto-reclosing RCCB','ARD: ऑटो-रीक्लोज़िंग RCCB','ARD: ഓട്ടോ-റീക്ലോസിംഗ് RCCB'),
 pts:[L('For unmanned sites: pumps, towers, ATMs.','मानवरहित स्थानों के लिए: पंप, टावर, ATM।','ആളില്ലാത്ത സ്ഥലങ്ങൾക്ക്: പമ്പ്, ടവർ, ATM.'),
      L('Locks out on a permanent fault: needs a visit.','स्थायी फॉल्ट पर लॉकआउट: जाँच ज़रूरी।','സ്ഥിരം ഫോൾട്ടിൽ ലോക്കൗട്ട്: പരിശോധന വേണം.'),
      L('Standard IEC 63024.','मानक IEC 63024।','മാനദണ്ഡം IEC 63024.')],
 steps:[L('Unmanned pump runs. RCCB is ON.','मानवरहित पंप चल रहा है। RCCB चालू।','ആളില്ലാത്ത പമ്പ് പ്രവർത്തിക്കുന്നു. RCCB ഓൺ.'),
        L('Lightning surge: false trip. Supply OFF.','बिजली का सर्ज: गलत ट्रिप। सप्लाई बंद।','ഇടിമിന്നൽ സർജ്: തെറ്റായ ട്രിപ്പ്. സപ്ലൈ ഓഫ്.'),
        L('ARD waits, checks, then switches the RCCB ON. No site visit needed.','ARD रुकता है, जाँचता है, फिर RCCB चालू करता है। साइट जाना ज़रूरी नहीं।','ARD കാത്തിരുന്ന് പരിശോധിച്ച് RCCB ഓണാക്കുന്നു. സൈറ്റിൽ പോകേണ്ടതില്ല.'),
        L('Real fault: trips again. After set tries, ARD locks out.','असली फॉल्ट: फिर ट्रिप। तय प्रयासों के बाद ARD लॉकआउट।','യഥാർത്ഥ ഫോൾട്ട്: വീണ്ടും ട്രിപ്പ്. നിശ്ചിത ശ്രമങ്ങൾക്ക് ശേഷം ARD ലോക്കൗട്ട്.')]},

{tab:L('Smart RCBO','स्मार्ट RCBO','സ്മാർട്ട് RCBO'), svg:'smart',
 title:L('Smart RCBO','स्मार्ट RCBO','സ്മാർട്ട് RCBO'),
 pts:[L('Protection works even without Wi-Fi.','Wi-Fi न होने पर भी सुरक्षा काम करती है।','Wi-Fi ഇല്ലെങ്കിലും സംരക്ഷണം പ്രവർത്തിക്കും.'),
      L('Remote ON only after the fault is found and cleared.','फॉल्ट मिलने और ठीक होने के बाद ही दूर से ON।','ഫോൾട്ട് കണ്ടെത്തി മാറ്റിയ ശേഷം മാത്രം ദൂരെ നിന്ന് ON.')],
 steps:[L('Measures voltage, current, energy and leakage. Sends to the phone.','वोल्टेज, करंट, ऊर्जा और लीकेज मापता है। फोन पर भेजता है।','വോൾട്ടേജ്, കറന്റ്, ഊർജ്ജം, ലീക്കേജ് അളക്കുന്നു. ഫോണിലേക്ക് അയക്കുന്നു.'),
        L('Leakage rising to 18 mA: alert before trip.','लीकेज 18 mA तक बढ़ा: ट्रिप से पहले चेतावनी।','ലീക്കേജ് 18 mA ആയി: ട്രിപ്പിന് മുമ്പ് മുന്നറിയിപ്പ്.'),
        L('Leakage crosses 30 mA: trips. Value and time saved.','लीकेज 30 mA पार: ट्रिप। मान और समय सेव।','ലീക്കേജ് 30 mA കടന്നു: ട്രിപ്പ്. മൂല്യവും സമയവും സേവ് ചെയ്യുന്നു.'),
        L('After repair, switch ON from the app.','मरम्मत के बाद ऐप से चालू करें।','അറ്റകുറ്റപ്പണിക്ക് ശേഷം ആപ്പിൽ നിന്ന് ഓൺ ചെയ്യുക.')]},

{tab:L('SI / Hpi','SI / Hpi','SI / Hpi'), svg:'si',
 title:L('SI / Hpi high-immunity RCCB','SI / Hpi हाई-इम्युनिटी RCCB','SI / Hpi ഹൈ-ഇമ്മ്യൂണിറ്റി RCCB'),
 pts:[L('For computers, UPS, LED drivers, hospitals, offices.','कंप्यूटर, UPS, LED ड्राइवर, अस्पताल, कार्यालय के लिए।','കമ്പ്യൂട്ടർ, UPS, LED ഡ്രൈവർ, ആശുപത്രി, ഓഫീസ് എന്നിവയ്ക്ക്.'),
      L('Still a 30 mA RCD: personal protection is not reduced.','फिर भी 30 mA RCD: व्यक्तिगत सुरक्षा कम नहीं।','ഇപ്പോഴും 30 mA RCD: വ്യക്തിസുരക്ഷ കുറയുന്നില്ല.')],
 steps:[L('Each PC or UPS leaks about 1 mA through filter capacitors.','हर PC या UPS फ़िल्टर कैपेसिटर से लगभग 1 mA लीक करता है।','ഓരോ PC-യും UPS-ഉം ഫിൽട്ടർ കപ്പാസിറ്ററിലൂടെ ഏകദേശം 1 mA ചോർത്തുന്നു.'),
        L('Lightning or switching surge: short leakage pulse.','बिजली या स्विचिंग सर्ज: छोटा लीकेज पल्स।','ഇടിമിന്നൽ / സ്വിച്ചിങ് സർജ്: ചെറിയ ലീക്കേജ് പൾസ്.'),
        L('Ordinary RCCB trips falsely. Computers lose data.','साधारण RCCB गलत ट्रिप करता है। कंप्यूटर का डेटा खो जाता है।','സാധാരണ RCCB തെറ്റായി ട്രിപ്പ് ചെയ്യുന്നു. കമ്പ്യൂട്ടർ ഡാറ്റ നഷ്ടപ്പെടുന്നു.'),
        L('SI RCCB filter ignores the short pulse: stays ON.','SI RCCB का फ़िल्टर छोटे पल्स को नज़रअंदाज़ करता है: चालू रहता है।','SI RCCB-യുടെ ഫിൽട്ടർ ചെറിയ പൾസ് അവഗണിക്കുന്നു: ഓണായി തുടരുന്നു.'),
        L('Real 30 mA leakage that lasts: SI RCCB still trips.','लगातार 30 mA असली लीकेज: SI RCCB फिर भी ट्रिप करता है।','തുടരുന്ന യഥാർത്ഥ 30 mA ലീക്കേജ്: SI RCCB ട്രിപ്പ് ചെയ്യും.')]},

{sep:L('Three phase','थ्री फेज़','ത്രീ ഫേസ്'), tab:L('4P RCCB','4P RCCB','4P RCCB'), svg:'rccb3',
 title:L('3-phase RCCB (4-pole)','3-फेज़ RCCB (4-पोल)','3-ഫേസ് RCCB (4-പോൾ)'),
 pts:[L('R, Y, B and N all pass through one core.','R, Y, B और N चारों एक ही कोर से गुजरते हैं।','R, Y, B, N നാലും ഒരേ കോറിലൂടെ കടന്നുപോകുന്നു.'),
      L('Trips when IR + IY + IB + IN ≠ 0 (phasor sum).','IR + IY + IB + IN ≠ 0 (फेज़र योग) होने पर ट्रिप।','IR + IY + IB + IN ≠ 0 (ഫേസർ തുക) ആയാൽ ട്രിപ്പ്.'),
      L('Unbalanced load does not trip it.','असंतुलित लोड से ट्रिप नहीं होता।','അസന്തുലിത ലോഡ് കാരണം ട്രിപ്പ് ആകില്ല.')],
 steps:[L('R, Y, B and N pass through one toroidal core.','R, Y, B और N एक टोरॉइडल कोर से गुजरते हैं।','R, Y, B, N ഒരു ടൊറോയ്ഡൽ കോറിലൂടെ കടന്നുപോകുന്നു.'),
        L('Balanced load: 10 A in each phase, IN = 0. Sum = 0.','संतुलित लोड: हर फेज़ में 10 A, IN = 0। योग = 0।','സന്തുലിത ലോഡ്: ഓരോ ഫേസിലും 10 A, IN = 0. തുക = 0.'),
        L('Unbalanced load: neutral carries 3.46 A. Sum still 0. No trip.','असंतुलित लोड: न्यूट्रल में 3.46 A। योग फिर भी 0। ट्रिप नहीं।','അസന്തുലിത ലോഡ്: ന്യൂട്രലിൽ 3.46 A. തുക ഇപ്പോഴും 0. ട്രിപ്പ് ഇല്ല.'),
        L('Y phase leaks 30 mA to earth. Sum ≠ 0.','Y फेज़ से 30 mA अर्थ में लीक। योग ≠ 0।','Y ഫേസിൽ നിന്ന് 30 mA എർത്തിലേക്ക് ചോരുന്നു. തുക ≠ 0.'),
        L('Secondary coil drives the relay. All 4 poles open.','सेकेंडरी कॉइल रिले चलाती है। चारों पोल खुलते हैं।','സെക്കൻഡറി കോയിൽ റിലേ പ്രവർത്തിപ്പിക്കുന്നു. നാല് പോളുകളും തുറക്കുന്നു.')]},

{tab:L('4P RCBO','4P RCBO','4P RCBO'), svg:'rcbo4',
 title:L('4P RCBO','4P RCBO','4P RCBO'),
 pts:[L('Full protection for one 3-phase circuit.','एक 3-फेज़ सर्किट की पूरी सुरक्षा।','ഒരു 3-ഫേസ് സർക്യൂട്ടിന് പൂർണ്ണ സംരക്ഷണം.'),
      L('All poles trip together: no single phasing.','सभी पोल एक साथ ट्रिप: सिंगल फेज़िंग नहीं।','എല്ലാ പോളുകളും ഒരുമിച്ച് ട്രിപ്പ്: സിംഗിൾ ഫേസിംഗ് ഇല്ല.'),
      L('Standard IS 12640-2.','मानक IS 12640-2।','മാനദണ്ഡം IS 12640-2.')],
 steps:[L('Each phase has its own thermal + magnetic element. One toroid for all.','हर फेज़ का अपना थर्मल + मैग्नेटिक तत्व। सबके लिए एक टोरॉइड।','ഓരോ ഫേസിനും സ്വന്തം തെർമൽ + മാഗ്നറ്റിക് ഘടകം. എല്ലാറ്റിനും ഒരു ടൊറോയ്ഡ്.'),
        L('Y phase overloads: its bimetal heats.','Y फेज़ ओवरलोड: उसका बाइमेटल गर्म होता है।','Y ഫേസ് ഓവർലോഡ്: അതിന്റെ ബൈമെറ്റൽ ചൂടാകുന്നു.'),
        L('Common latch opens all 4 poles. Motor never runs on 2 phases.','साझा लैच चारों पोल खोलता है। मोटर 2 फेज़ पर नहीं चलती।','പൊതു ലാച്ച് നാല് പോളുകളും തുറക്കുന്നു. മോട്ടോർ 2 ഫേസിൽ ഓടില്ല.'),
        L('Reset. Motor winding leaks 30 mA: toroid senses.','फिर चालू। मोटर वाइंडिंग से 30 mA लीक: टोरॉइड पहचानता है।','വീണ്ടും ഓൺ. മോട്ടോർ വൈൻഡിംഗിൽ നിന്ന് 30 mA ചോർച്ച: ടൊറോയ്ഡ് തിരിച്ചറിയുന്നു.'),
        L('All 4 poles open.','चारों पोल खुलते हैं।','നാല് പോളുകളും തുറക്കുന്നു.')]},

{tab:L('3-wire motor','3-तार मोटर','3-വയർ മോട്ടോർ'), svg:'rccb3w',
 title:L('4P RCCB on a 3-wire motor','3-तार मोटर पर 4P RCCB','3-വയർ മോട്ടോറിൽ 4P RCCB'),
 pts:[L('Many 4P RCCB test circuits use phase and N.','कई 4P RCCB का टेस्ट सर्किट फेज़ और N पर होता है।','പല 4P RCCB-കളുടെയും ടെസ്റ്റ് സർക്യൂട്ട് ഫേസും N-ഉം ഉപയോഗിക്കുന്നു.'),
      L('Check the data sheet, or choose a 3P RCCB with phase-to-phase test.','डेटा शीट देखें, या फेज़-टू-फेज़ टेस्ट वाला 3P RCCB चुनें।','ഡാറ്റാ ഷീറ്റ് നോക്കുക, അല്ലെങ്കിൽ ഫേസ്-ടു-ഫേസ് ടെസ്റ്റ് ഉള്ള 3P RCCB തിരഞ്ഞെടുക്കുക.')],
 steps:[L('Motor uses only R, Y, B. N pole is not used.','मोटर केवल R, Y, B उपयोग करती है। N पोल खाली।','മോട്ടോർ R, Y, B മാത്രം ഉപയോഗിക്കുന്നു. N പോൾ ഉപയോഗിക്കുന്നില്ല.'),
        L('Balanced motor currents: sum = 0.','संतुलित मोटर करंट: योग = 0।','സന്തുലിത മോട്ടോർ കറന്റ്: തുക = 0.'),
        L('Winding fault to body: leakage to earth. All poles trip.','वाइंडिंग से बॉडी फॉल्ट: अर्थ में लीकेज। सभी पोल ट्रिप।','വൈൻഡിംഗ്-ബോഡി ഫോൾട്ട്: എർത്തിലേക്ക് ലീക്കേജ്. എല്ലാ പോളുകളും ട്രിപ്പ്.'),
        L('Reset and press TEST. Test resistor needs N. No N: TEST fails.','फिर चालू कर TEST दबाएँ। टेस्ट रेज़िस्टर को N चाहिए। N नहीं: TEST फेल।','വീണ്ടും ഓൺ ചെയ്ത് TEST അമർത്തുക. ടെസ്റ്റ് റെസിസ്റ്ററിന് N വേണം. N ഇല്ലെങ്കിൽ TEST പരാജയം.'),
        L('Connect supply N to the RCCB N input (as the maker allows). TEST trips.','सप्लाई N को RCCB के N इनपुट से जोड़ें (निर्माता अनुसार)। TEST ट्रिप करता है।','സപ്ലൈ N, RCCB-യുടെ N ഇൻപുട്ടിൽ ചേർക്കുക (നിർമ്മാതാവ് അനുവദിക്കുന്നതുപോലെ). TEST ട്രിപ്പ് ചെയ്യുന്നു.')]},

{tab:L('ELR + CBCT','ELR + CBCT','ELR + CBCT'), svg:'elr',
 title:L('ELR + CBCT','ELR + CBCT','ELR + CBCT'),
 pts:[L('Used for big motors, panels and feeders.','बड़ी मोटर, पैनल और फीडर के लिए।','വലിയ മോട്ടോറുകൾ, പാനലുകൾ, ഫീഡറുകൾ എന്നിവയ്ക്ക്.'),
      L('Adjustable sensitivity (30 mA–30 A) and time delay.','समायोज्य संवेदनशीलता (30 mA–30 A) और समय देरी।','ക്രമീകരിക്കാവുന്ന സംവേദനക്ഷമത (30 mA–30 A), സമയതാമസം.'),
      L('Needs an MCCB with shunt trip, or a contactor.','शंट ट्रिप वाला MCCB या कॉन्टैक्टर चाहिए।','ഷണ്ട് ട്രിപ്പ് ഉള്ള MCCB അല്ലെങ്കിൽ കോൺടാക്ടർ വേണം.')],
 steps:[L('All live conductors (R, Y, B, N) pass through the CBCT. Never the earth wire.','सभी लाइव कंडक्टर (R, Y, B, N) CBCT से गुजरें। अर्थ तार कभी नहीं।','എല്ലാ ലൈവ് കണ്ടക്ടറുകളും (R, Y, B, N) CBCT-യിലൂടെ. എർത്ത് വയർ ഒരിക്കലും അല്ല.'),
        L('Normal: currents sum to zero. No CBCT output.','सामान्य: करंट का योग शून्य। CBCT आउटपुट नहीं।','സാധാരണ: കറന്റുകളുടെ തുക പൂജ്യം. CBCT ഔട്ട്പുട്ട് ഇല്ല.'),
        L('Motor insulation fault: 500 mA to earth. Setting is 300 mA.','मोटर इन्सुलेशन फॉल्ट: 500 mA अर्थ में। सेटिंग 300 mA।','മോട്ടോർ ഇൻസുലേഷൻ ഫോൾട്ട്: 500 mA എർത്തിലേക്ക്. സെറ്റിംഗ് 300 mA.'),
        L('ELR waits the set delay (0.1 s), then closes its output contact.','ELR तय देरी (0.1 s) तक रुकता है, फिर आउटपुट कॉन्टैक्ट बंद करता है।','ELR നിശ്ചിത താമസം (0.1 s) കാത്തിരുന്ന് ഔട്ട്പുട്ട് കോൺടാക്ട് അടയ്ക്കുന്നു.'),
        L('Shunt trip coil opens the MCCB: feeder OFF.','शंट ट्रिप कॉइल MCCB खोलती है: फीडर बंद।','ഷണ്ട് ട്രിപ്പ് കോയിൽ MCCB തുറക്കുന്നു: ഫീഡർ ഓഫ്.')]},

{tab:L('MCCB (G)','MCCB (G)','MCCB (G)'), svg:'mccbg',
 title:L('MCCB / ACB with earth fault (G)','अर्थ फॉल्ट (G) सहित MCCB / ACB','എർത്ത് ഫോൾട്ട് (G) ഉള്ള MCCB / ACB'),
 pts:[L('Main incomer of buildings and factories.','भवनों और कारखानों का मुख्य इनकमर।','കെട്ടിടങ്ങളുടെയും ഫാക്ടറികളുടെയും മെയിൻ ഇൻകമർ.'),
      L('L, S, I = overload, short delay, instant. G = ground fault.','L, S, I = ओवरलोड, शॉर्ट डिले, इंस्टेंट। G = ग्राउंड फॉल्ट।','L, S, I = ഓവർലോഡ്, ഷോർട്ട് ഡിലേ, ഇൻസ്റ്റന്റ്. G = ഗ്രൗണ്ട് ഫോൾട്ട്.'),
      L('Setting is in amperes: protects equipment and prevents fire, not people.','सेटिंग एम्पियर में: उपकरण व आग से सुरक्षा, व्यक्ति की नहीं।','സെറ്റിംഗ് ആമ്പിയറിൽ: ഉപകരണവും തീയും, മനുഷ്യരെയല്ല.')],
 steps:[L('A CT on every pole feeds the electronic trip unit.','हर पोल पर CT इलेक्ट्रॉनिक ट्रिप यूनिट को सिग्नल देता है।','ഓരോ പോളിലെയും CT ഇലക്ട്രോണിക് ട്രിപ്പ് യൂണിറ്റിലേക്ക് സിഗ്നൽ നൽകുന്നു.'),
        L('Normal: vector sum IR + IY + IB + IN = 0.','सामान्य: सदिश योग IR + IY + IB + IN = 0।','സാധാരണ: വെക്ടർ തുക IR + IY + IB + IN = 0.'),
        L('Earth fault in panel: 150 A. Setting Ig = 100 A.','पैनल में अर्थ फॉल्ट: 150 A। सेटिंग Ig = 100 A।','പാനലിൽ എർത്ത് ഫോൾട്ട്: 150 A. സെറ്റിംഗ് Ig = 100 A.'),
        L('After delay tg, the trip unit opens the breaker.','देरी tg के बाद ट्रिप यूनिट ब्रेकर खोलती है।','tg താമസത്തിന് ശേഷം ട്രിപ്പ് യൂണിറ്റ് ബ്രേക്കർ തുറക്കുന്നു.')]},

        L('Insulation fault on DC bus: smooth DC leaks to earth.','DC बस पर इन्सुलेशन फॉल्ट: स्मूथ DC अर्थ में लीक।','DC ബസിൽ ഇൻസുലേഷൻ ഫോൾട്ട്: സ്മൂത്ത് DC എർത്തിലേക്ക്.'),
        L('Type AC / A core is magnetised by DC: it cannot see it.','टाइप AC / A कोर DC से चुंबकित: यह इसे नहीं देख सकता।','ടൈപ്പ് AC / A കോർ DC കൊണ്ട് കാന്തീകരിക്കപ്പെടുന്നു: അതിന് കാണാനാവില്ല.'),
        L('Type B DC sensor detects it: all 4 poles open.','टाइप B का DC सेंसर पहचानता है: चारों पोल खुलते हैं।','ടൈപ്പ് B DC സെൻസർ കണ്ടെത്തുന്നു: നാല് പോളുകളും തുറക്കുന്നു.')]},

{tab:L('Rules','नियम','നിയമങ്ങൾ'), kind:'list',
 title:L('Field rules and standards','फील्ड नियम और मानक','ഫീൽഡ് നിയമങ്ങളും മാനദണ്ഡങ്ങളും'),
 rules:[
  L('Press the TEST button once a month.','महीने में एक बार TEST बटन दबाएँ।','മാസത്തിലൊരിക്കൽ TEST ബട്ടൺ അമർത്തുക.'),
  L('Each circuit’s neutral must pass through its own RCD. Never mix neutrals.','हर सर्किट का न्यूट्रल उसी RCD से जाए। न्यूट्रल आपस में न मिलाएँ।','ഓരോ സർക്യൂട്ടിന്റെയും ന്യൂട്രൽ അതിന്റെ RCD-യിലൂടെ തന്നെ പോകണം. ന്യൂട്രലുകൾ കൂട്ടിക്കലർത്തരുത്.'),
  L('Never join neutral to earth after the RCD. It will trip.','RCD के बाद न्यूट्रल को अर्थ से न जोड़ें। ट्रिप होगा।','RCD-ക്ക് ശേഷം ന്യൂട്രൽ എർത്തുമായി ചേർക്കരുത്. ട്രിപ്പ് ആകും.'),
  L('RCD cannot protect a person touching L and N together.','व्यक्ति L और N दोनों छुए तो RCD नहीं बचा सकता।','ഒരാൾ L-ഉം N-ഉം ഒരുമിച്ച് തൊട്ടാൽ RCD രക്ഷിക്കില്ല.'),
  L('RCD does not replace earthing. Keep good earthing (IS 3043).','RCD अर्थिंग का विकल्प नहीं। अच्छी अर्थिंग रखें (IS 3043)।','RCD എർത്തിംഗിന് പകരമല്ല. നല്ല എർത്തിംഗ് ഉറപ്പാക്കുക (IS 3043).'),
  L('3-phase 4-wire supply needs a 4-pole RCD. Never a 2-pole on one phase.','3-फेज़ 4-तार सप्लाई के लिए 4-पोल RCD। एक फेज़ पर 2-पोल कभी नहीं।','3-ഫേസ് 4-വയർ സപ്ലൈക്ക് 4-പോൾ RCD. ഒരു ഫേസിൽ 2-പോൾ ഒരിക്കലും അരുത്.'),
  L('IS 732: 30 mA RCD for socket outlets and wet areas.','IS 732: सॉकेट और गीले स्थानों के लिए 30 mA RCD।','IS 732: സോക്കറ്റുകൾക്കും നനവുള്ള സ്ഥലങ്ങൾക്കും 30 mA RCD.'),
  L('CEA Safety Regulations: earth leakage protection for installations above 5 kW.','CEA सुरक्षा विनियम: 5 kW से अधिक के संस्थापन में अर्थ लीकेज सुरक्षा।','CEA സുരക്ഷാ ചട്ടങ്ങൾ: 5 kW-ന് മുകളിലുള്ള ഇൻസ്റ്റലേഷനുകളിൽ എർത്ത് ലീക്കേജ് സംരക്ഷണം.')]}
];

  elr:L('Earth leakage relay: separate relay box with adjustable settings.','अर्थ लीकेज रिले: समायोज्य सेटिंग वाला अलग रिले बॉक्स।','എർത്ത് ലീക്കേജ് റിലേ: ക്രമീകരിക്കാവുന്ന സെറ്റിംഗുള്ള പ്രത്യേക റിലേ.'),
  cbct:L('Core balance current transformer: ring CT around all live cables.','कोर बैलेंस करंट ट्रांसफॉर्मर: सभी लाइव केबल के चारों ओर छल्ला CT।','കോർ ബാലൻസ് കറന്റ് ട്രാൻസ്ഫോർമർ: എല്ലാ ലൈവ് കേബിളുകൾക്കും ചുറ്റുമുള്ള വളയ CT.'),

  rdc:L('Residual direct current detecting device: senses 6 mA DC.','रेज़िडुअल DC डिटेक्टिंग डिवाइस: 6 mA DC पहचानता है।','റെസിഡ്യുവൽ DC ഡിറ്റക്റ്റിംഗ് ഡിവൈസ്: 6 mA DC അറിയുന്നു.'),
  obc:L('On-board charger: inside the car, turns AC into DC for the battery.','ऑन-बोर्ड चार्जर: कार के अंदर, बैटरी के लिए AC को DC बनाता है।','ഓൺ-ബോർഡ് ചാർജർ: കാറിനുള്ളിൽ, ബാറ്ററിക്കായി AC-യെ DC ആക്കുന്നു.'),
  cont:L('Power switch closed by a coil.','कॉइल से बंद होने वाला पावर स्विच।','കോയിൽ അടയ്ക്കുന്ന പവർ സ്വിച്ച്.'),
  ard:L('Automatic reclosing device: motor unit fixed beside the RCCB that switches it ON again.','ऑटोमैटिक रीक्लोज़िंग डिवाइस: RCCB के बगल की मोटर यूनिट जो उसे फिर चालू करती है।','ഓട്ടോമാറ്റിക് റീക്ലോസിംഗ് ഡിവൈസ്: RCCB-യുടെ അരികിലെ മോട്ടോർ യൂണിറ്റ്, അതിനെ വീണ്ടും ഓണാക്കുന്നു.'),

  ycap:L('Capacitor from line to earth inside PCs and UPS to reduce noise.','शोर घटाने के लिए PC और UPS में लाइन से अर्थ तक कैपेसिटर।','ശബ്ദം കുറയ്ക്കാൻ PC-യിലും UPS-ലും ലൈനിൽ നിന്ന് എർത്തിലേക്കുള്ള കപ്പാസിറ്റർ.'),

  tm:L('Thermal (bimetal) + magnetic (coil) trip element.','थर्मल (बाइमेटल) + मैग्नेटिक (कॉइल) ट्रिप तत्व।','തെർമൽ (ബൈമെറ്റൽ) + മാഗ്നറ്റിക് (കോയിൽ) ട്രിപ്പ് ഘടകം.'),
  sph:L('3-phase motor running on 2 phases. It overheats and burns.','3-फेज़ मोटर का 2 फेज़ पर चलना। गर्म होकर जलती है।','3-ഫേസ് മോട്ടോർ 2 ഫേസിൽ ഓടുന്നു. ചൂടായി കത്തും.'),

  st:L('Shunt trip: coil that trips the MCCB when it gets supply.','शंट ट्रिप: सप्लाई मिलने पर MCCB ट्रिप करने वाली कॉइल।','ഷണ്ട് ട്രിപ്പ്: സപ്ലൈ കിട്ടുമ്പോൾ MCCB ട്രിപ്പ് ചെയ്യുന്ന കോയിൽ.'),
  mccb:L('Moulded case circuit breaker: for larger currents than an MCB.','मोल्डेड केस सर्किट ब्रेकर: MCB से बड़े करंट के लिए।','മോൾഡഡ് കേസ് സർക്യൂട്ട് ബ്രേക്കർ: MCB-യേക്കാൾ വലിയ കറന്റിന്.'),
  acb:L('Air circuit breaker: for very large currents at the main incomer.','एयर सर्किट ब्रेकर: मुख्य इनकमर पर बहुत बड़े करंट के लिए।','എയർ സർക്യൂട്ട് ബ്രേക്കർ: മെയിൻ ഇൻകമറിൽ വളരെ വലിയ കറന്റിന്.'),

const SP={
  In:L('In: rated current. The most current it carries all day. Choose In equal to or above the MCB or fuse before it.','In: रेटेड करंट। दिन भर वहन करने वाला अधिकतम करंट। In को पहले लगे MCB या फ्यूज के बराबर या अधिक चुनें।','In: റേറ്റഡ് കറന്റ്. ദിവസം മുഴുവൻ വഹിക്കാവുന്ന പരമാവധി കറന്റ്. മുന്നിലുള്ള MCB / ഫ്യൂസിന് തുല്യമോ കൂടുതലോ ആയ In തിരഞ്ഞെടുക്കുക.'),
  IDn:L('IΔn: rated residual current. It trips at this leakage or less. 30 mA protects people; 100 / 300 mA protects against fire.','IΔn: रेटेड रेज़िडुअल करंट। इतने या कम लीकेज पर ट्रिप। 30 mA व्यक्ति की, 100 / 300 mA आग से सुरक्षा।','IΔn: റേറ്റഡ് റെസിഡ്യുവൽ കറന്റ്. ഈ ലീക്കേജിലോ അതിൽ കുറവിലോ ട്രിപ്പ്. 30 mA മനുഷ്യരെ, 100 / 300 mA തീയിൽ നിന്ന് സംരക്ഷിക്കുന്നു.'),
  IDn100:L('IΔn 100 mA or 300 mA: for fire protection and main incomers. Use 30 mA on final circuits.','IΔn 100 mA या 300 mA: आग सुरक्षा और मुख्य इनकमर के लिए। अंतिम सर्किट पर 30 mA।','IΔn 100 mA / 300 mA: തീ സംരക്ഷണത്തിനും മെയിൻ ഇൻകമറിനും. അവസാന സർക്യൂട്ടുകളിൽ 30 mA.'),
  Un1:L('230 V~ 50 Hz: rated voltage and frequency. Must match the supply.','230 V~ 50 Hz: रेटेड वोल्टेज और आवृत्ति। सप्लाई से मेल खाना चाहिए।','230 V~ 50 Hz: റേറ്റഡ് വോൾട്ടേജും ആവൃത്തിയും. സപ്ലൈയുമായി യോജിക്കണം.'),
  Un3:L('415 V~ 50 Hz: rated voltage for a 3-phase supply.','415 V~ 50 Hz: 3-फेज़ सप्लाई के लिए रेटेड वोल्टेज।','415 V~ 50 Hz: 3-ഫേസ് സപ്ലൈക്കുള്ള റേറ്റഡ് വോൾട്ടേജ്.'),
  Inc:L('Inc in a box: the short-circuit current it can survive when backed up by the correct MCB or fuse. Choose it above the fault level.','बॉक्स में Inc: सही MCB या फ्यूज के साथ सहन करने योग्य शॉर्ट सर्किट करंट। फॉल्ट लेवल से अधिक चुनें।','ബോക്സിൽ Inc: ശരിയായ MCB / ഫ്യൂസ് പിന്തുണയോടെ താങ്ങാവുന്ന ഷോർട്ട് സർക്യൂട്ട് കറന്റ്. ഫോൾട്ട് ലെവലിന് മുകളിൽ തിരഞ്ഞെടുക്കുക.'),
  TypeA:L('Type A symbol: detects AC and pulsating DC leakage. Pick the type by the load (see RCD types).','टाइप A चिह्न: AC और स्पंदित DC लीकेज पहचानता है। लोड अनुसार प्रकार चुनें (RCD प्रकार देखें)।','ടൈപ്പ് A ചിഹ്നം: AC-യും സ്പന്ദിക്കുന്ന DC-യും കണ്ടെത്തുന്നു. ലോഡ് അനുസരിച്ച് തരം തിരഞ്ഞെടുക്കുക (RCD തരങ്ങൾ കാണുക).'),
  P2:L('2P (1P + N): two poles, for a single-phase supply.','2P (1P + N): दो पोल, सिंगल-फेज़ सप्लाई के लिए।','2P (1P + N): രണ്ട് പോൾ, സിംഗിൾ-ഫേസ് സപ്ലൈക്ക്.'),
  P4:L('4P (3P + N): four poles, for a 3-phase 4-wire supply.','4P (3P + N): चार पोल, 3-फेज़ 4-तार सप्लाई के लिए।','4P (3P + N): നാല് പോൾ, 3-ഫേസ് 4-വയർ സപ്ലൈക്ക്.'),
  IS1:L('IS 12640-1: Indian standard for RCCB. Buy only devices with this mark.','IS 12640-1: RCCB का भारतीय मानक। केवल इस चिह्न वाले डिवाइस खरीदें।','IS 12640-1: RCCB-യുടെ ഇന്ത്യൻ മാനദണ്ഡം. ഈ അടയാളമുള്ളവ മാത്രം വാങ്ങുക.'),
  IS2:L('IS 12640-2: Indian standard for RCBO.','IS 12640-2: RCBO का भारतीय मानक।','IS 12640-2: RCBO-യുടെ ഇന്ത്യൻ മാനദണ്ഡം.'),
  Test:L('T button: press once a month. It must trip. If it does not, replace the device.','T बटन: महीने में एक बार दबाएँ। ट्रिप होना चाहिए। न हो तो डिवाइस बदलें।','T ബട്ടൺ: മാസത്തിലൊരിക്കൽ അമർത്തുക. ട്രിപ്പ് ആകണം. ഇല്ലെങ്കിൽ ഉപകരണം മാറ്റുക.'),
  Lever:L('I = ON, O = OFF. After a trip the lever falls to OFF. Find the fault before switching ON.','I = चालू, O = बंद। ट्रिप पर लीवर बंद पर गिरता है। चालू करने से पहले फॉल्ट खोजें।','I = ഓൺ, O = ഓഫ്. ട്രിപ്പിൽ ലിവർ ഓഫിലേക്ക് വീഴും. ഓൺ ചെയ്യുന്നതിന് മുമ്പ് ഫോൾട്ട് കണ്ടെത്തുക.'),
  Curve:L('C32: trip curve + rated current. B for lights and sockets, C for general loads and motors, D for high inrush.','C32: ट्रिप कर्व + रेटेड करंट। लाइट-सॉकेट के लिए B, सामान्य लोड व मोटर के लिए C, अधिक इनरश के लिए D।','C32: ട്രിപ്പ് കർവ് + റേറ്റഡ് കറന്റ്. ലൈറ്റ്, സോക്കറ്റിന് B; പൊതു ലോഡിനും മോട്ടോറിനും C; ഉയർന്ന ഇൻറഷിന് D.'),
  B16:L('B16: trip curve B, rated current 16 A (the MCB part).','B16: ट्रिप कर्व B, रेटेड करंट 16 A (MCB भाग)।','B16: ട്രിപ്പ് കർവ് B, റേറ്റഡ് കറന്റ് 16 A (MCB ഭാഗം).'),
  Icn:L('6000 in a box: breaking capacity Icn = 6 kA. It must be above the fault level at that point.','बॉक्स में 6000: ब्रेकिंग क्षमता Icn = 6 kA। उस स्थान के फॉल्ट लेवल से अधिक हो।','ബോക്സിൽ 6000: ബ്രേക്കിംഗ് ശേഷി Icn = 6 kA. ആ സ്ഥലത്തെ ഫോൾട്ട് ലെവലിന് മുകളിൽ ആകണം.'),
  Class3:L('3 in a square: energy limiting class 3. Lets less energy through in a short circuit, so cables stay safe.','वर्ग में 3: ऊर्जा सीमित वर्ग 3। शॉर्ट सर्किट में कम ऊर्जा जाने देता है, केबल सुरक्षित।','ചതുരത്തിൽ 3: എനർജി ലിമിറ്റിംഗ് ക്ലാസ് 3. ഷോർട്ട് സർക്യൂട്ടിൽ കുറഞ്ഞ ഊർജ്ജം മാത്രം കടത്തുന്നു, കേബിൾ സുരക്ഷിതം.'),
  S:L('S in a box: time-delayed (selective) type. Fit it upstream so the 30 mA RCD below trips first.','बॉक्स में S: समय-विलंबित (सेलेक्टिव) प्रकार। ऊपर लगाएँ ताकि नीचे का 30 mA RCD पहले ट्रिप हो।','ബോക്സിൽ S: സമയതാമസമുള്ള (സെലക്ടീവ്) തരം. താഴെയുള്ള 30 mA RCD ആദ്യം ട്രിപ്പ് ആകാൻ മുകളിൽ ഘടിപ്പിക്കുക.'),
  Npos:L('N marked terminal: connect neutral only here. Check whether N is on the left or the right.','N चिह्नित टर्मिनल: न्यूट्रल केवल यहीं जोड़ें। देखें N बाएँ है या दाएँ।','N അടയാളമുള്ള ടെർമിനൽ: ന്യൂട്രൽ ഇവിടെ മാത്രം. N ഇടത്തോ വലത്തോ എന്ന് നോക്കുക.'),
  AFDsym:L('Arc symbol + IEC 62606: shows the arc fault detection function.','आर्क चिह्न + IEC 62606: आर्क फॉल्ट पहचान कार्य दर्शाता है।','ആർക്ക് ചിഹ്നം + IEC 62606: ആർക്ക് ഫോൾട്ട് കണ്ടെത്തൽ പ്രവർത്തനം കാണിക്കുന്നു.'),
  AFDled:L('LED: shows status and the trip reason. Read the maker’s code chart.','LED: स्थिति और ट्रिप कारण दिखाता है। निर्माता का कोड चार्ट देखें।','LED: നിലയും ട്രിപ്പ് കാരണവും കാണിക്കുന്നു. നിർമ്മാതാവിന്റെ കോഡ് ചാർട്ട് നോക്കുക.'),
  TypeB:L('Type B symbol: also detects smooth DC leakage. Needed for EV chargers, drives and solar inverters.','टाइप B चिह्न: स्मूथ DC लीकेज भी पहचानता है। EV चार्जर, ड्राइव और सोलर इन्वर्टर के लिए ज़रूरी।','ടൈപ്പ് B ചിഹ്നം: സ്മൂത്ത് DC ലീക്കേജും കണ്ടെത്തുന്നു. EV ചാർജർ, ഡ്രൈവ്, സോളാർ ഇൻവെർട്ടർ എന്നിവയ്ക്ക് വേണം.'),
  kHz:L('Up to 1 kHz: detects leakage at higher frequencies from drives.','1 kHz तक: ड्राइव से उच्च आवृत्ति लीकेज पहचानता है।','1 kHz വരെ: ഡ്രൈവുകളിൽ നിന്നുള്ള ഉയർന്ന ആവൃത്തി ലീക്കേജ് കണ്ടെത്തുന്നു.'),
  IEC62423:L('IEC 62423: standard for Type F and Type B RCDs.','IEC 62423: टाइप F और टाइप B RCD का मानक।','IEC 62423: ടൈപ്പ് F, ടൈപ്പ് B RCD-കളുടെ മാനദണ്ഡം.'),
  DD6:L('6 mA DC (IEC 62955): DC fault detection, often built inside the EV charger.','6 mA DC (IEC 62955): DC फॉल्ट पहचान, प्रायः EV चार्जर के अंदर।','6 mA DC (IEC 62955): DC ഫോൾട്ട് കണ്ടെത്തൽ, പലപ്പോഴും EV ചാർജറിനുള്ളിൽ.'),
  ARDcomp:L('Compatible device: the ARD fits only the RCCB / RCBO models listed by the maker.','संगत डिवाइस: ARD केवल निर्माता द्वारा बताए RCCB / RCBO पर लगता है।','യോജിക്കുന്ന ഉപകരണം: നിർമ്മാതാവ് പറയുന്ന RCCB / RCBO-യിൽ മാത്രം ARD ഘടിപ്പിക്കാം.'),
  ARDn:L('Reclose attempts: number of tries before lockout (often 3).','रीक्लोज़ प्रयास: लॉकआउट से पहले प्रयासों की संख्या (प्रायः 3)।','റീക്ലോസ് ശ്രമങ്ങൾ: ലോക്കൗട്ടിന് മുമ്പുള്ള ശ്രമങ്ങളുടെ എണ്ണം (പലപ്പോഴും 3).'),
  ARDt:L('Reclose delay: wait time before each try. Set on the unit.','रीक्लोज़ देरी: हर प्रयास से पहले प्रतीक्षा समय। यूनिट पर सेट करें।','റീക്ലോസ് താമസം: ഓരോ ശ്രമത്തിനും മുമ്പുള്ള കാത്തിരിപ്പ്. യൂണിറ്റിൽ സെറ്റ് ചെയ്യാം.'),
  ARDlock:L('Lockout: after the last try it stays OFF. Reset by hand after repair.','लॉकआउट: अंतिम प्रयास के बाद बंद रहता है। मरम्मत के बाद हाथ से रीसेट।','ലോക്കൗട്ട്: അവസാന ശ്രമത്തിന് ശേഷം ഓഫ്. അറ്റകുറ്റപ്പണിക്ക് ശേഷം കൈകൊണ്ട് റീസെറ്റ്.'),
  IEC63024:L('IEC 63024: standard for automatic reclosing devices.','IEC 63024: ऑटोमैटिक रीक्लोज़िंग डिवाइस का मानक।','IEC 63024: ഓട്ടോമാറ്റിക് റീക്ലോസിംഗ് ഉപകരണങ്ങളുടെ മാനദണ്ഡം.'),
  wifi:L('Wi-Fi (usually 2.4 GHz): needed for the app. Check the signal at the distribution board.','Wi-Fi (प्रायः 2.4 GHz): ऐप के लिए ज़रूरी। डिस्ट्रीब्यूशन बोर्ड पर सिग्नल जाँचें।','Wi-Fi (സാധാരണ 2.4 GHz): ആപ്പിന് വേണം. ഡിസ്ട്രിബ്യൂഷൻ ബോർഡിൽ സിഗ്നൽ പരിശോധിക്കുക.'),
  meas:L('Measures V, A, kWh and leakage in mA.','V, A, kWh और लीकेज (mA) मापता है।','V, A, kWh, ലീക്കേജ് (mA) എന്നിവ അളക്കുന്നു.'),
  alarm:L('Alarm level: leakage warning before trip, e.g. 15 mA. Set it in the app.','अलार्म स्तर: ट्रिप से पहले लीकेज चेतावनी, जैसे 15 mA। ऐप में सेट करें।','അലാറം നില: ട്രിപ്പിന് മുമ്പ് ലീക്കേജ് മുന്നറിയിപ്പ്, ഉദാ. 15 mA. ആപ്പിൽ സെറ്റ് ചെയ്യുക.'),
  manual:L('Manual lever: I = ON, O = OFF. It always works, even without Wi-Fi.','मैनुअल लीवर: I = चालू, O = बंद। Wi-Fi के बिना भी हमेशा काम करता है।','മാനുവൽ ലിവർ: I = ഓൺ, O = ഓഫ്. Wi-Fi ഇല്ലെങ്കിലും എപ്പോഴും പ്രവർത്തിക്കും.'),
  SImark:L('A-SI / Hpi / HI mark: high-immunity type. Fewer false trips.','A-SI / Hpi / HI चिह्न: हाई-इम्युनिटी प्रकार। कम गलत ट्रिप।','A-SI / Hpi / HI അടയാളം: ഹൈ-ഇമ്മ്യൂണിറ്റി തരം. തെറ്റായ ട്രിപ്പ് കുറവ്.'),
  surge:L('Surge withstand (kA, 8/20 µs): higher than an ordinary RCCB. See the data sheet.','सर्ज सहनशीलता (kA, 8/20 µs): साधारण RCCB से अधिक। डेटा शीट देखें।','സർജ് താങ്ങൽ (kA, 8/20 µs): സാധാരണ RCCB-യേക്കാൾ കൂടുതൽ. ഡാറ്റാ ഷീറ്റ് നോക്കുക.'),
  ELRrange:L('IΔn setting range, e.g. 30 mA to 30 A, set with a knob.','IΔn सेटिंग रेंज, जैसे 30 mA से 30 A, नॉब से सेट।','IΔn സെറ്റിംഗ് പരിധി, ഉദാ. 30 mA മുതൽ 30 A വരെ, നോബ് വഴി.'),
  ELRt:L('Time delay range, e.g. instant to a few seconds. Instant for people; delay so smaller breakers below trip first.','समय देरी रेंज, जैसे तुरंत से कुछ सेकंड। व्यक्ति के लिए तुरंत; देरी ताकि नीचे के छोटे ब्रेकर पहले ट्रिप हों।','സമയതാമസ പരിധി, ഉദാ. ഉടൻ മുതൽ ഏതാനും സെക്കൻഡ്. മനുഷ്യർക്ക് ഉടൻ; താഴെയുള്ള ചെറിയ ബ്രേക്കറുകൾ ആദ്യം ട്രിപ്പ് ആകാൻ താമസം.'),
  aux:L('Aux supply, e.g. 230 V AC: the relay needs its own supply to work.','ऑक्स सप्लाई, जैसे 230 V AC: रिले को काम करने के लिए अलग सप्लाई चाहिए।','ഓക്സ് സപ്ലൈ, ഉദാ. 230 V AC: റിലേക്ക് പ്രവർത്തിക്കാൻ സ്വന്തം സപ്ലൈ വേണം.'),
  contacts:L('Output contacts NO / NC with rating, e.g. 5 A 230 V: they drive the shunt trip or contactor coil.','आउटपुट कॉन्टैक्ट NO / NC रेटिंग सहित, जैसे 5 A 230 V: ये शंट ट्रिप या कॉन्टैक्टर कॉइल चलाते हैं।','ഔട്ട്പുട്ട് കോൺടാക്ട് NO / NC റേറ്റിംഗ് സഹിതം, ഉദാ. 5 A 230 V: ഷണ്ട് ട്രിപ്പ് / കോൺടാക്ടർ കോയിൽ പ്രവർത്തിപ്പിക്കുന്നു.'),
  window:L('CBCT window size (mm): all live cables must pass through it.','CBCT विंडो आकार (mm): सभी लाइव केबल इसमें से गुजरें।','CBCT വിൻഡോ വലുപ്പം (mm): എല്ലാ ലൈവ് കേബിളുകളും ഇതിലൂടെ കടക്കണം.'),
  match:L('CBCT type: use the CBCT made for that ELR (same make and ratio).','CBCT प्रकार: उसी ELR के लिए बना CBCT लगाएँ (एक ही निर्माता और अनुपात)।','CBCT തരം: ആ ELR-നായി നിർമ്മിച്ച CBCT ഉപയോഗിക്കുക (ഒരേ നിർമ്മാതാവ്, അനുപാതം).'),
  elrtest:L('Test / Reset buttons: test the relay monthly; reset after a trip.','टेस्ट / रीसेट बटन: रिले की मासिक जाँच; ट्रिप के बाद रीसेट।','ടെസ്റ്റ് / റീസെറ്റ് ബട്ടൺ: റിലേ മാസംതോറും പരിശോധിക്കുക; ട്രിപ്പിന് ശേഷം റീസെറ്റ്.'),
  frame:L('Frame 250 A: the largest current the breaker body can handle.','फ्रेम 250 A: ब्रेकर बॉडी द्वारा संभाला जाने वाला अधिकतम करंट।','ഫ്രെയിം 250 A: ബ്രേക്കർ ബോഡിക്ക് താങ്ങാവുന്ന പരമാവധി കറന്റ്.'),
  Ir:L('Ir: overload setting, e.g. 0.4 to 1 × In. Set it to the load current.','Ir: ओवरलोड सेटिंग, जैसे 0.4 से 1 × In। लोड करंट पर सेट करें।','Ir: ഓവർലോഡ് സെറ്റിംഗ്, ഉദാ. 0.4 മുതൽ 1 × In. ലോഡ് കറന്റിന് സെറ്റ് ചെയ്യുക.'),
  Icu:L('Icu / Ics (kA): breaking capacity. Icu = maximum it can break; Ics = it can break this and still be used. Choose above the fault level.','Icu / Ics (kA): ब्रेकिंग क्षमता। Icu = अधिकतम जो तोड़ सके; Ics = इसे तोड़कर भी उपयोग योग्य। फॉल्ट लेवल से अधिक चुनें।','Icu / Ics (kA): ബ്രേക്കിംഗ് ശേഷി. Icu = പരമാവധി; Ics = ഇത് മുറിച്ചശേഷവും ഉപയോഗിക്കാം. ഫോൾട്ട് ലെവലിന് മുകളിൽ തിരഞ്ഞെടുക്കുക.'),
  Ig:L('Ig: earth fault setting in amperes, e.g. 0.2 to 1 × In.','Ig: एम्पियर में अर्थ फॉल्ट सेटिंग, जैसे 0.2 से 1 × In।','Ig: ആമ്പിയറിൽ എർത്ത് ഫോൾട്ട് സെറ്റിംഗ്, ഉദാ. 0.2 മുതൽ 1 × In.'),
  tg:L('tg: earth fault time delay. Keep it longer than the breakers below.','tg: अर्थ फॉल्ट समय देरी। नीचे वाले ब्रेकरों से अधिक रखें।','tg: എർത്ത് ഫോൾട്ട് സമയതാമസം. താഴെയുള്ള ബ്രേക്കറുകളേക്കാൾ കൂടുതൽ വയ്ക്കുക.'),
  Ue:L('Ue 415 V: rated operating voltage.','Ue 415 V: रेटेड ऑपरेटिंग वोल्टेज।','Ue 415 V: റേറ്റഡ് ഓപ്പറേറ്റിംഗ് വോൾട്ടേജ്.'),
  IEC60947:L('IS/IEC 60947-2: standard for MCCB and ACB.','IS/IEC 60947-2: MCCB और ACB का मानक।','IS/IEC 60947-2: MCCB-യുടെയും ACB-യുടെയും മാനദണ്ഡം.'),
  push:L('Push to trip: tests the trip mechanism. Press during maintenance.','पुश टू ट्रिप: ट्रिप तंत्र की जाँच। रखरखाव के समय दबाएँ।','പുഷ് ടു ട്രിപ്പ്: ട്രിപ്പ് മെക്കാനിസം പരിശോധന. മെയിന്റനൻസ് സമയത്ത് അമർത്തുക.')
};
LBL.lookfor=L('Find this on the label','लेबल पर यह खोजें','ലേബലിൽ ഇത് കണ്ടെത്തുക');
function specPlate(name,items,poles){
  const cx=190; let s=`<svg viewBox="0 0 800 450" role="img" aria-label="${name} label"><rect class="plas" x="40" y="22" width="300" height="414" rx="10"/>`;
  for(let i=0;i<poles;i++){const tx=40+300*(i+.5)/poles;[44,414].forEach(ty=>{s+=`<circle class="screw" cx="${tx}" cy="${ty}" r="8"/><path class="ink-p" d="M${tx-5} ${ty} H${tx+5}"/>`;});}
  s+=txt(cx,82,name,'pt b t-md');
  let line=0;
  items.forEach((it,i)=>{
    const n=i+1; let g='';
    if(it.pos==='lever'){
      const sw=poles>2?120:30;
      g=`<rect class="slot" x="${cx-sw/2}" y="98" width="${sw}" height="74" rx="5"/><rect class="lever" x="${cx-sw/2+4}" y="102" width="${sw-8}" height="30" rx="3"/>${txt(cx+sw/2+10,114,'I','pt t-md b',{a:'start'})}${txt(cx+sw/2+10,168,'O','pt t-md b',{a:'start'})}`;
      g+=`<circle class="badge" cx="366" cy="118" r="14"/>${txt(366,124,n,'t-sm tx-a b')}`;
    } else if(it.pos==='test'){
      g=`<rect class="tbtn" x="288" y="144" width="34" height="26" rx="4"/><text class="tbt b" style="font-size:15px" x="305" y="163" text-anchor="middle">T</text>`;
      g+=`<circle class="badge" cx="366" cy="158" r="14"/>${txt(366,164,n,'t-sm tx-a b')}`;
    } else if(it.pos==='led'){
      g=`<circle class="led" cx="78" cy="135" r="10"/>${txt(78,162,'LED','pt t-sm b')}`;
      g+=`<circle class="badge" cx="20" cy="135" r="14"/>${txt(20,141,n,'t-sm tx-a b')}`;
    } else {
      const nl=items.filter(t=>!t.pos).length, y=(nl>7?206:212)+line*(nl>7?24:27); line++;
      const w=it.mark.length*11+14;
      g=(it.box?`<rect fill="none" class="ink-p" x="58" y="${y-20}" width="${w}" height="27" rx="2"/>`:'')+txt(64,y,it.mark,'pt b t-md',{a:'start'});
      if(it.sym){const x0=64+it.mark.length*11+18; g+=`<path class="ink-p" style="stroke-width:2.5" d="${wp(it.sym,x0,y-6,42,9)}"/>`;}
      g+=`<circle class="badge" cx="366" cy="${y-7}" r="14"/>${txt(366,y-1,n,'t-sm tx-a b')}`;
    }
    s+=`<g data-hl="${n}">${g}</g>`;
  });
  s+=`<rect class="box" x="400" y="40" width="380" height="370" rx="14"/>`;
  items.forEach((it,i)=>{
    const m=it.pos==='lever'?'I / O':it.pos==='test'?'T':it.pos==='led'?'LED':it.mark;
    s+=`<g data-show="${i+1}"><circle class="badge-big" cx="590" cy="120" r="34"/>${txt(590,132,i+1,'t-lg tx-ai b')}${txt(590,240,m,(m.length>14?'t-md':'t-lg')+' tx b')}</g>`;
  });
  s+=lab(590,330,'lookfor','t-sm tx-m');
  return s+'</svg>';
}
const SPECS=[
  {id:'rccb',name:'RCCB',poles:2,items:[{pos:'lever',k:'Lever'},{pos:'test',k:'Test'},{mark:'In 40 A',k:'In'},{mark:'IΔn 30 mA',k:'IDn'},{mark:'230 V~ 50 Hz',k:'Un1'},{mark:'Inc 10000 A',k:'Inc',box:1},{mark:'Type A',k:'TypeA',sym:'pulse'},{mark:'2P (1P+N)',k:'P2'},{mark:'IS 12640-1',k:'IS1'}]},
  {id:'rcbo',name:'RCBO',poles:2,items:[{pos:'lever',k:'Lever'},{pos:'test',k:'Test'},{mark:'C32',k:'Curve'},{mark:'IΔn 30 mA',k:'IDn'},{mark:'6000',k:'Icn',box:1},{mark:'3',k:'Class3',box:1},{mark:'Type A',k:'TypeA',sym:'pulse'},{mark:'230 V~ 50 Hz',k:'Un1'},{mark:'1P+N',k:'P2'},{mark:'IS 12640-2',k:'IS2'}]},
  {id:'afdd',name:'AFDD + RCBO',poles:2,items:[{pos:'lever',k:'Lever'},{pos:'test',k:'Test'},{pos:'led',k:'AFDled'},{mark:'B16',k:'B16'},{mark:'IΔn 30 mA',k:'IDn'},{mark:'6000',k:'Icn',box:1},{mark:'AFDD IEC 62606',k:'AFDsym'},{mark:'230 V~ 50 Hz',k:'Un1'}]},
  {id:'typeb',name:'Type B RCCB',poles:4,items:[{pos:'lever',k:'Lever'},{pos:'test',k:'Test'},{mark:'In 40 A',k:'In'},{mark:'IΔn 30 mA',k:'IDn'},{mark:'Type B',k:'TypeB',sym:'dc'},{mark:'≤ 1 kHz',k:'kHz'},{mark:'IEC 62423',k:'IEC62423'},{mark:'6 mA DC',k:'DD6'},{mark:'4P 415 V~',k:'P4'}]},
  {id:'ard',name:'ARD',poles:2,items:[{mark:'For RCCB 40 A 2P',k:'ARDcomp'},{mark:'Tries: 3',k:'ARDn'},{mark:'Delay: set',k:'ARDt'},{mark:'Lockout / Reset',k:'ARDlock'},{mark:'230 V~ 50 Hz',k:'Un1'},{mark:'IEC 63024',k:'IEC63024'}]},
  {id:'smart',name:'Smart RCBO',poles:2,items:[{pos:'lever',k:'manual'},{pos:'test',k:'Test'},{mark:'C32',k:'Curve'},{mark:'IΔn 30 mA',k:'IDn'},{mark:'Wi-Fi 2.4 GHz',k:'wifi'},{mark:'V A kWh mA',k:'meas'},{mark:'Alarm 15 mA',k:'alarm'},{mark:'6000',k:'Icn',box:1}]},
  {id:'si',name:'RCCB A-SI',poles:2,items:[{pos:'lever',k:'Lever'},{pos:'test',k:'Test'},{mark:'A-SI',k:'SImark',box:1},{mark:'IΔn 30 mA',k:'IDn'},{mark:'In 40 A',k:'In'},{mark:'3 kA 8/20 µs',k:'surge'},{mark:'Type A',k:'TypeA',sym:'pulse'},{mark:'IS 12640-1',k:'IS1'}]},
  {id:'rccb4',name:'4P RCCB',poles:4,items:[{pos:'lever',k:'Lever'},{pos:'test',k:'Test'},{mark:'In 63 A',k:'In'},{mark:'IΔn 300 mA',k:'IDn100'},{mark:'S',k:'S',box:1},{mark:'415 V~ 50 Hz',k:'Un3'},{mark:'4P (3P+N)',k:'P4'},{mark:'N ← left',k:'Npos'},{mark:'Inc 10000 A',k:'Inc',box:1},{mark:'IS 12640-1',k:'IS1'}]},
  {id:'elr',name:'ELR + CBCT',poles:2,items:[{pos:'test',k:'elrtest'},{mark:'IΔn 0.03–30 A',k:'ELRrange'},{mark:'t 0–5 s',k:'ELRt'},{mark:'Aux 230 V~',k:'aux'},{mark:'NO / NC 5 A',k:'contacts'},{mark:'CBCT Ø 60 mm',k:'window'},{mark:'CBCT for ELR',k:'match'}]},
  {id:'mccb',name:'MCCB (LSIG)',poles:4,items:[{pos:'lever',k:'Lever'},{pos:'test',k:'push'},{mark:'Frame 250 A',k:'frame'},{mark:'Ir 0.4–1 × In',k:'Ir'},{mark:'Icu 36 kA',k:'Icu'},{mark:'Ig 0.2–1 × In',k:'Ig'},{mark:'tg 0.1–0.4 s',k:'tg'},{mark:'Ue 415 V',k:'Ue'},{mark:'IS/IEC 60947-2',k:'IEC60947'}]}
];
const specSlides=SPECS.map((sp,i)=>{
  SVG['spec_'+sp.id]=specPlate(sp.name,sp.items,sp.poles);
  return {sep:i?null:L('Specifications','विनिर्देश','സ്പെസിഫിക്കേഷനുകൾ'), tab:L(sp.name,sp.name,sp.name), svg:'spec_'+sp.id,
    title:L(sp.name+': reading the label',sp.name+': लेबल पढ़ना',sp.name+': ലേബൽ വായന'),
    pts:[L('Check these marks before you buy or install. Values shown are typical examples.','खरीदने या लगाने से पहले ये चिह्न जाँचें। दिखाए मान सामान्य उदाहरण हैं।','വാങ്ങുന്നതിനോ ഘടിപ്പിക്കുന്നതിനോ മുമ്പ് ഈ അടയാളങ്ങൾ പരിശോധിക്കുക. കാണിച്ച മൂല്യങ്ങൾ സാധാരണ ഉദാഹരണങ്ങൾ.')],
    steps:sp.items.map(it=>SP[it.k])};
});
SLIDES.splice(SLIDES.findIndex(s=>s.kind==='table'),0,...specSlides);

const nSteps=s=>s.steps?s.steps.length:s.rules?s.rules.length:0;
const $=id=>document.getElementById(id);
function inRange(spec,s){
  return String(spec).split(',').some(p=>{
    if(p.includes('-')){const [a,b]=p.split('-');return s>=+a&&(b===''||s<=+b);}
    return +p===s;
  });
}
function slideHTML(s){
  const head=`<h2>${T(s.title)}</h2>${s.pts?`<ul class="pts">${s.pts.map(p=>`<li>${T(p)}</li>`).join('')}</ul>`:''}${s.terms?`<dl class="terms">${s.terms.map(([t,d])=>`<dt>${t}</dt><dd>${T(d)}</dd>`).join('')}</dl>`:''}`;
  if(s.svg){
    const st=`<ol class="steps">${s.steps.map((x,i)=>`<li tabindex="0" data-go="${i+1}"><span class="n">${i+1}</span><span>${T(x)}</span></li>`).join('')}</ol>`;
    return `<section class="slide kind-svg"><div class="txt">${head}${st}</div><div class="fig">${SVG[s.svg]}</div></section>`;
  }
  if(s.kind==='table'){
    return `<section class="slide kind-table"><div class="txt">${head}</div><div class="tblwrap"><table><thead><tr><th></th><th>ELCB</th><th>RCCB</th><th>RCBO</th></tr></thead><tbody>${s.table.rows.map(r=>`<tr><th scope="row">${T(r.h)}</th>${r.c.map(c=>`<td class="${c[1]||''}">${T(c[0])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
  }
  return `<section class="slide kind-list"><div class="txt">${head}</div><ol class="rules">${s.rules.map((r,i)=>`<li data-hl="${i+1}" data-go="${i+1}">${T(r)}</li>`).join('')}</ol></section>`;
}
function render(){
  document.documentElement.lang=lang;
  const s=SLIDES[cur];
  $('stage').innerHTML=slideHTML(s);
  $('stage').querySelectorAll('[data-t]').forEach(el=>{el.textContent=T(LBL[el.dataset.t]);});
  $('stage').querySelectorAll('[data-go]').forEach(el=>{
    const go=()=>{stop();step=+el.dataset.go;apply();};
    el.addEventListener('click',go);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go();}});
  });
  $('tabs').innerHTML=SLIDES.map((x,i)=>`${x.sep?`<span class="tabsep">${T(x.sep)}</span>`:''}<button class="tab" data-i="${i}" aria-current="${i===cur}"><b>${i+1}</b>${T(x.tab)}</button>`).join('');
  $('tabs').querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>goSlide(+b.dataset.i)));
  const at=$('tabs').querySelector('[aria-current="true"]'); if(at) try{at.scrollIntoView({block:'nearest',inline:'nearest'})}catch(e){}
  ui(); apply();
}
function apply(){
  const s=SLIDES[cur], n=nSteps(s), root=$('stage');
  root.querySelectorAll('[data-show]').forEach(el=>el.classList.toggle('off',!inRange(el.dataset.show,step)));
  root.querySelectorAll('[data-hl]').forEach(el=>el.classList.toggle('hl',inRange(el.dataset.hl,step)));
  root.querySelectorAll('[data-dim]').forEach(el=>el.classList.toggle('dim',inRange(el.dataset.dim,step)));
  root.querySelectorAll('.steps li').forEach((li,i)=>{li.classList.toggle('cur',i+1===step);li.classList.toggle('done',i+1<step);});
  $('stepctl').hidden=!n;
  $('st-cnt').textContent=`${T(UI.step)} ${step} / ${n}`;
  $('st-prev').disabled=step<=1; $('st-next').disabled=step>=n;
  $('sl-cnt').textContent=`${cur+1} / ${SLIDES.length}`;
  $('sl-prev').disabled=cur===0; $('sl-next').disabled=cur===SLIDES.length-1;
  $('st-play').textContent=timer?T(UI.pause):T(UI.play);
  $('st-play').setAttribute('aria-pressed',!!timer);
}
function ui(){
  $('brand').textContent=T(UI.brand);
  $('lab-text').textContent=T(UI.text);
  $('th-light').textContent=T(UI.light); $('th-dark').textContent=T(UI.dark); $('th-contrast').textContent=T(UI.contrast);
  $('full').textContent=T(UI.full);
  $('sl-prev').textContent=T(UI.prev); $('sl-next').textContent=T(UI.next);
  $('st-reset').textContent=T(UI.reset);
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  const th=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.querySelectorAll('[data-theme-btn]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.themeBtn===th));
}
function stop(){if(timer){clearInterval(timer);timer=null;}}
function goSlide(i,last){stop();cur=Math.max(0,Math.min(SLIDES.length-1,i));step=last?Math.max(1,nSteps(SLIDES[cur])):1;render();try{$('stage').scrollTop=0}catch(e){}}
function next(){const n=nSteps(SLIDES[cur]);if(step<n){step++;apply();}else if(cur<SLIDES.length-1)goSlide(cur+1);}
function prev(){if(step>1){step--;apply();}else if(cur>0)goSlide(cur-1,true);}

$('st-next').onclick=()=>{stop();if(step<nSteps(SLIDES[cur])){step++;apply();}};
$('st-prev').onclick=()=>{stop();if(step>1){step--;apply();}};
$('st-reset').onclick=()=>{stop();step=1;apply();};
$('st-play').onclick=()=>{
  if(timer){stop();apply();return;}
  if(step>=nSteps(SLIDES[cur])) step=1;
  timer=setInterval(()=>{if(step<nSteps(SLIDES[cur])){step++;apply();}else{stop();apply();}},3200);
  apply();
};
$('sl-next').onclick=()=>goSlide(cur+1);
$('sl-prev').onclick=()=>goSlide(cur-1);
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set('elb-lang',lang);render();});
function setScale(v){scale=Math.round(Math.max(.7,Math.min(1.8,v))*10)/10;document.documentElement.style.setProperty('--scale',scale);store.set('elb-scale',scale);}
$('fs-up').onclick=()=>setScale(scale+.1);
$('fs-dn').onclick=()=>setScale(scale-.1);
$('fs-rs').onclick=()=>setScale(1);
document.querySelectorAll('[data-theme-btn]').forEach(b=>b.onclick=()=>{document.documentElement.dataset.theme=b.dataset.themeBtn;store.set('elb-theme',b.dataset.themeBtn);ui();});
$('full').onclick=()=>{
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); if(p&&p.catch)p.catch(()=>{});}
  }catch(e){}
};
document.addEventListener('keydown',e=>{
  const onBtn=e.target.closest&&e.target.closest('button,li[tabindex]');
  if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&!onBtn)){e.preventDefault();stop();next();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();stop();prev();}
  else if(e.key==='ArrowDown'){e.preventDefault();goSlide(cur+1);}
  else if(e.key==='ArrowUp'){e.preventDefault();goSlide(cur-1);}
  else if(e.key==='+'||e.key==='='){setScale(scale+.1);}
  else if(e.key==='-'){setScale(scale-.1);}
});
(function init(){
  const l=store.get('elb-lang'); if(l&&['en','hi','ml'].includes(l)) lang=l;
  const sc=parseFloat(store.get('elb-scale')); if(sc) setScale(sc);
  const th=store.get('elb-theme'); if(th&&['light','dark','contrast'].includes(th)) document.documentElement.dataset.theme=th;
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',ui);}catch(e){}
  render();
})();
</script>
