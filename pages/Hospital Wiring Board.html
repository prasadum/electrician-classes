html{font-size:var(--fs)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;padding-block:.6rem;border-bottom:2px solid var(--line)}
.brand{min-width:0}
.brand h1{font-family:var(--f-disp);font-weight:800;font-size:1.5rem;line-height:1.1;margin:0;text-wrap:balance}
.brand p{margin:.1rem 0 0;color:var(--muted);font-size:.8rem}
.ctrls{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.seg{display:flex;border:2px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:.3rem .65rem;cursor:pointer;font-size:.8rem;font-weight:700}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ctrls select{background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:.28rem .5rem;font-size:.8rem;font-weight:700}
.ctrls label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.steps{display:flex;gap:.4rem;overflow-x:auto;padding-block:.6rem;scrollbar-width:thin}
.steps button{flex:0 0 auto;display:flex;gap:.4rem;align-items:baseline;background:var(--chip);border:2px solid var(--line);border-radius:999px;padding:.25rem .75rem;cursor:pointer;font-size:.75rem;font-weight:700;white-space:nowrap}
.steps button .n{font-family:var(--f-mono);color:var(--muted)}
.steps button[aria-current="step"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps button[aria-current="step"] .n{color:inherit}

.step{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:1.5rem;align-items:start;padding-block:.6rem 1rem}
.step.wide{grid-template-columns:minmax(0,1fr)}
@media (max-width:980px){.step{grid-template-columns:minmax(0,1fr)}}
.txt{min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 .2rem;font-weight:700}
h2{font-family:var(--f-disp);font-weight:800;font-size:2rem;line-height:1.1;margin:0 0 .8rem;text-wrap:balance}
h3{font-family:var(--f-disp);font-weight:700;font-size:1.2rem;margin:1rem 0 .4rem}
ol.do{margin:0;padding:0;list-style:none;counter-reset:d;display:grid;gap:.55rem}
ol.do li{counter-increment:d;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.6rem;align-items:start}
ol.do li::before{content:counter(d);font-family:var(--f-mono);font-weight:700;font-size:.85rem;width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);margin-top:.1rem}
.box{border-left:6px solid;padding:.7rem 1rem;border-radius:0 10px 10px 0;margin-top:1rem}
.box .lbl{display:flex;gap:.45rem;align-items:center;font-family:var(--f-mono);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.25rem}
.box p{margin:0}
.ex{background:var(--ex-bg);border-color:var(--ex-line)}
.ex .lbl{color:var(--ex-line)}
.safe{background:var(--safe-bg);border-color:var(--safe-line)}
.safe .lbl{color:var(--safe-line)}
:root[data-skin="hc"] .box{border:3px solid;border-left-width:8px}

.vis{min-width:0;display:grid;gap:.8rem}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.8rem;min-width:0}
.panel svg{display:block;width:100%;height:auto}
.panel .cap{font-size:.75rem;color:var(--muted);margin:.4rem 0 0}
.vbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.vbar b{font-family:var(--f-disp);font-size:1rem}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:.35rem .9rem;font-weight:700;font-size:.8rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}

.photo{position:relative;border-radius:10px;overflow:hidden}
.photo img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.7rem;padding:.12rem .5rem;border-radius:999px;border:2px solid #fff;white-space:nowrap;animation:pop .5s both}
.pin.sw{background:#16201B;color:#fff}

table{border-collapse:collapse;width:100%;font-size:.85rem}
.tw{overflow-x:auto}
th,td{border:2px solid var(--line);padding:.35rem .55rem;text-align:left;vertical-align:top}
th{font-family:var(--f-disp);background:var(--chip);font-weight:700}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:center;font-weight:700}
.dot{display:inline-block;width:.9em;height:.9em;border-radius:50%;vertical-align:-.1em;margin-right:.2em;box-shadow:0 0 0 2px var(--halo)}
.code{font-family:var(--f-mono);font-weight:700}

.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.8rem}
.tool{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:.7rem;align-items:start}
.tool svg{width:5.5rem;height:5.5rem}
.tool h4{margin:0 0 .15rem;font-family:var(--f-disp);font-size:1.05rem}
.tool p{margin:0;font-size:.85rem}

.legend{display:flex;flex-wrap:wrap;gap:.35rem .9rem;font-size:.8rem}
.tt td,.tt th{text-align:center}
.tt tr.on td{background:var(--ex-bg)}
.obs{cursor:pointer;min-width:4rem;font-weight:700}
.chk{list-style:none;padding:0;margin:0;display:grid;gap:.35rem}
.chk label{display:flex;gap:.55rem;align-items:flex-start;cursor:pointer}
.chk input{width:1.2rem;height:1.2rem;margin-top:.2rem;accent-color:var(--accent)}
.msg{font-weight:700;min-height:1.5em;font-size:.9rem}

.pager{display:flex;gap:.8rem;align-items:center;justify-content:space-between;border-top:2px solid var(--line);padding-block:.7rem}
.pager .pos{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums}
.pager .btn{font-size:.95rem;padding:.5rem 1.2rem}
.pager .btn:disabled{opacity:.35;cursor:default}

/* SVG text + anims */
svg text{font-family:var(--f-body)}
.lbl-svg{fill:var(--ink);font-weight:700}
.seq{animation:drop .55s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1.4s) ease-in-out both;animation-delay:var(--d,0s)}
.fade{animation:fade .5s both;animation-delay:var(--d,0s)}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.flow{stroke-dasharray:10 8;animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.saw-x{animation:sawx .45s ease-in-out infinite alternate}
.saw-y{animation:sawy 7s linear infinite}
.kerf{animation:kerf 7s linear infinite;transform-box:fill-box;transform-origin:top}
@keyframes sawx{from{transform:translateX(-55px)}to{transform:translateX(55px)}}
@keyframes sawy{0%{transform:translateY(-70px)}85%{transform:translateY(58px)}100%{transform:translateY(58px)}}
@keyframes kerf{0%{transform:scaleY(0)}85%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.sink{animation:sink 3.6s ease-in-out infinite;transform-box:fill-box}
@keyframes sink{0%{transform:translateY(-10px)}70%,100%{transform:translateY(0)}}
.lampglow{transition:opacity .25s}
.sw-hit{cursor:pointer}
.tp{cursor:pointer}
.tp:hover circle.ring{stroke-width:4}
@media (prefers-reduced-motion:reduce){
  .seq,.draw,.fade,.pin{animation:none!important;stroke-dashoffset:0}
  .flow,.saw-x,.saw-y,.kerf,.spin,.sink{animation:none!important}
}
</style>

      hi:["दो लैंप L1 और L2 को इस तरह वायर करें कि चार स्थितियाँ मिलें: दोनों तेज़, केवल एक तेज़, दोनों मंद, और सब बंद।","नियंत्रण: S1 टू-वे स्विच है, S2 वन-वे स्विच है।","कार्य: सागौन लकड़ी के बोर्ड पर पीवीसी कंड्यूट, केवल 15 cm टुकड़े।","आप करेंगे: मार्किंग → कटिंग → असेंबली → फिक्सिंग → तार खींचना → कनेक्शन → परीक्षण।"],
      ml:["L1, L2 എന്നീ രണ്ട് ലാമ്പുകൾ നാല് അവസ്ഥകൾ ലഭിക്കുന്ന വിധത്തിൽ വയർ ചെയ്യുക: രണ്ടും പൂർണ്ണ വെളിച്ചം, ഒന്ന് മാത്രം, രണ്ടും മങ്ങിയ വെളിച്ചം, എല്ലാം ഓഫ്.","നിയന്ത്രണം: S1 ടു-വേ സ്വിച്ച്, S2 വൺ-വേ സ്വിച്ച്.","ജോലി: തേക്ക് തടി ബോർഡിൽ PVC കോൺഡ്യൂട്ട്, 15 cm കഷണങ്ങൾ മാത്രം.","നിങ്ങൾ ചെയ്യുന്നത്: മാർക്കിംഗ് → മുറിക്കൽ → അസംബ്ലി → ഉറപ്പിക്കൽ → വയർ വലിക്കൽ → കണക്ഷൻ → ടെസ്റ്റ്."]},
  ex:{en:"In a hospital ward at night, both lamps on dim give the patient soft light to sleep. One lamp is enough for the nurse's round. Both bright are used during treatment or cleaning.",hi:"रात में अस्पताल वार्ड में दोनों लैंप मंद रहते हैं ताकि मरीज़ सो सके। नर्स के राउंड के लिए एक लैंप काफ़ी है। इलाज या सफ़ाई के समय दोनों तेज़ जलाए जाते हैं।",ml:"രാത്രി ആശുപത്രി വാർഡിൽ രോഗിക്ക് ഉറങ്ങാൻ രണ്ട് ലാമ്പുകളും മങ്ങിയ വെളിച്ചത്തിൽ. നഴ്സിന്റെ റൗണ്ടിന് ഒരു ലാമ്പ് മതി. ചികിത്സയുടെയോ ശുചീകരണത്തിന്റെയോ സമയത്ത് രണ്ടും പൂർണ്ണ വെളിച്ചത്തിൽ."}},
 {v:"tools",wide:1,t:{en:"Tools and their correct use",hi:"औज़ार और उनका सही उपयोग",ml:"ഉപകരണങ്ങളും ശരിയായ ഉപയോഗവും"},li:null,
  ex:{en:"A pilot hole is like the small guide hole you make before driving a nail into hard wood: the screw goes in straight and the teak does not crack.",hi:"पायलट छेद कठोर लकड़ी में कील ठोकने से पहले बनाए गए छोटे गाइड छेद जैसा है: स्क्रू सीधा जाता है और सागौन नहीं फटता।",ml:"കട്ടിയുള്ള തടിയിൽ ആണി അടിക്കുന്നതിന് മുൻപ് ഉണ്ടാക്കുന്ന ചെറിയ ഗൈഡ് ദ്വാരം പോലെയാണ് പൈലറ്റ് ദ്വാരം: സ്ക്രൂ നേരെ കയറും, തേക്ക് പൊട്ടില്ല."},
  sf:{en:"Keep the bench clear. No supply connected while working.",hi:"कार्य बेंच साफ रखें। काम करते समय सप्लाई न जोड़ें।",ml:"വർക്ക് ബെഞ്ച് വൃത്തിയായി സൂക്ഷിക്കുക. ജോലി ചെയ്യുമ്പോൾ സപ്ലൈ കണക്ട് ചെയ്യരുത്."}},
 {v:"mats",t:{en:"Materials",hi:"सामग्री",ml:"സാമഗ്രികൾ"},
  li:{en:["Collect every item in the table before you start.","S1 must be two-way (3 terminals: C, 1, 2). S2 is one-way (2 terminals).","Both lamps must be the same wattage and type, for example 2 × 40 W incandescent. LED lamps do not share voltage evenly in series and will not dim correctly."],
      hi:["शुरू करने से पहले तालिका की हर सामग्री इकट्ठा करें।","S1 टू-वे होना चाहिए (3 टर्मिनल: C, 1, 2)। S2 वन-वे है (2 टर्मिनल)।","दोनों लैंप एक ही वॉटेज और प्रकार के हों, जैसे 2 × 40 W इनकैंडेसेंट। LED लैंप सीरीज़ में वोल्टेज बराबर नहीं बाँटते और सही मंद नहीं होते।"],
      ml:["തുടങ്ങുന്നതിന് മുൻപ് പട്ടികയിലെ എല്ലാ സാധനങ്ങളും ശേഖരിക്കുക.","S1 ടു-വേ ആയിരിക്കണം (3 ടെർമിനലുകൾ: C, 1, 2). S2 വൺ-വേ (2 ടെർമിനലുകൾ).","രണ്ട് ലാമ്പുകളും ഒരേ വാട്ടേജും തരവും ആയിരിക്കണം, ഉദാ: 2 × 40 W ഇൻകാൻഡസെന്റ്. LED ലാമ്പുകൾ സീരീസിൽ വോൾട്ടേജ് തുല്യമായി പങ്കിടില്ല, ശരിയായി മങ്ങുകയുമില്ല."]},
  ex:{en:"A cook keeps all ingredients ready before lighting the stove. Ready materials mean no running around in the middle of the job.",hi:"रसोइया चूल्हा जलाने से पहले सारी सामग्री तैयार रखता है। सामग्री तैयार हो तो काम के बीच में भागदौड़ नहीं होती।",ml:"പാചകക്കാരൻ അടുപ്പ് കത്തിക്കുന്നതിന് മുൻപ് എല്ലാ ചേരുവകളും തയ്യാറാക്കി വയ്ക്കുന്നു. സാധനങ്ങൾ തയ്യാറാണെങ്കിൽ ജോലിക്കിടയിൽ ഓടേണ്ടി വരില്ല."}},
 {v:"circuit",t:{en:"Circuit diagram: how four conditions are made",hi:"परिपथ आरेख: चार स्थितियाँ कैसे बनती हैं",ml:"സർക്യൂട്ട് ഡയഗ്രം: നാല് അവസ്ഥകൾ എങ്ങനെ ഉണ്ടാകുന്നു"},
  li:{en:["The diagram is drawn on the board layout: L1 above S1, L2 above S2, supply entering from the left.","S2 (one-way) takes phase P to the lamp wire X. X goes to L2 and loops on to L1.","L1 is connected between X and neutral N.","L2 is connected between X and terminal C of S1.","S1 (two-way): terminal 1 gets phase P (looped on to S2), terminal 2 gets neutral N (looped from L1).","S2 decides whether phase reaches X. S1 decides what the far end of L2 sees: phase (1) or neutral (2)."],
      hi:["आरेख बोर्ड लेआउट पर बना है: S1 के ऊपर L1, S2 के ऊपर L2, सप्लाई बाईं ओर से।","S2 (वन-वे) फेज़ P को लैंप तार X तक ले जाता है। X, L2 पर जाता है और वहाँ से लूप होकर L1 पर।","L1, X और न्यूट्रल N के बीच जुड़ा है।","L2, X और S1 के टर्मिनल C के बीच जुड़ा है।","S1 (टू-वे): टर्मिनल 1 पर फेज़ P (आगे S2 को लूप), टर्मिनल 2 पर न्यूट्रल N (L1 से लूप)।","S2 तय करता है कि फेज़ X तक पहुँचे या नहीं। S1 तय करता है कि L2 के दूसरे सिरे पर फेज़ (1) मिले या न्यूट्रल (2)।"],
      ml:["ഡയഗ്രം ബോർഡ് ലേഔട്ടിൽ തന്നെ വരച്ചിരിക്കുന്നു: S1-ന് മുകളിൽ L1, S2-ന് മുകളിൽ L2, സപ്ലൈ ഇടതുവശത്തുനിന്ന്.","S2 (വൺ-വേ) ഫേസ് P-യെ ലാമ്പ് വയർ X-ലേക്ക് എത്തിക്കുന്നു. X, L2-ലേക്കും അവിടെ നിന്ന് ലൂപ്പ് ചെയ്ത് L1-ലേക്കും.","L1, X-നും ന്യൂട്രൽ N-നും ഇടയിൽ ബന്ധിപ്പിച്ചിരിക്കുന്നു.","L2, X-നും S1-ന്റെ ടെർമിനൽ C-ക്കും ഇടയിൽ ബന്ധിപ്പിച്ചിരിക്കുന്നു.","S1 (ടു-വേ): ടെർമിനൽ 1-ൽ ഫേസ് P (S2-ലേക്ക് ലൂപ്പ്), ടെർമിനൽ 2-ൽ ന്യൂട്രൽ N (L1-ൽ നിന്ന് ലൂപ്പ്).","ഫേസ് X-ൽ എത്തണോ എന്ന് S2 തീരുമാനിക്കുന്നു. L2-ന്റെ മറ്റേ അറ്റത്ത് ഫേസ് (1) വേണോ ന്യൂട്രൽ (2) വേണോ എന്ന് S1 തീരുമാനിക്കുന്നു."]},
  sf:{en:"S1 has phase on terminal 1 and neutral on terminal 2. Use a good 6 A switch and keep its cover fitted.",hi:"S1 के टर्मिनल 1 पर फेज़ और टर्मिनल 2 पर न्यूट्रल है। अच्छा 6 A स्विच लगाएँ और उसका कवर हमेशा लगा रखें।",ml:"S1-ന്റെ ടെർമിനൽ 1-ൽ ഫേസും ടെർമിനൽ 2-ൽ ന്യൂട്രലും ഉണ്ട്. നല്ല 6 A സ്വിച്ച് ഉപയോഗിക്കുക, അതിന്റെ കവർ എപ്പോഴും ഘടിപ്പിക്കുക."},
  ex:{en:"Two people sharing one bucket of water: in series, each lamp gets only half the voltage (about 115 V), so both glow dim. In parallel, each lamp gets its own full bucket of 230 V and glows bright.",hi:"दो लोग एक ही बाल्टी पानी बाँटें: सीरीज़ में हर लैंप को केवल आधा वोल्टेज (लगभग 115 V) मिलता है, इसलिए दोनों मंद जलते हैं। पैरेलल में हर लैंप को अपनी पूरी 230 V की बाल्टी मिलती है और वह तेज़ जलता है।",ml:"രണ്ടുപേർ ഒരു ബക്കറ്റ് വെള്ളം പങ്കിടുന്നതുപോലെ: സീരീസിൽ ഓരോ ലാമ്പിനും പകുതി വോൾട്ടേജ് (ഏകദേശം 115 V) മാത്രം, അതിനാൽ രണ്ടും മങ്ങി കത്തുന്നു. പാരലലിൽ ഓരോ ലാമ്പിനും സ്വന്തം 230 V ബക്കറ്റ് മുഴുവനും കിട്ടും, അതിനാൽ പൂർണ്ണമായി കത്തുന്നു."}},
 {v:"layout",t:{en:"Layout and pipe plan",hi:"लेआउट और पाइप योजना",ml:"ലേഔട്ടും പൈപ്പ് പ്ലാനും"},
  li:{en:["Every run is one 15 cm piece. Six pieces in all: A, B, U1, D1, U2, D2.","Main run: supply → A → J1 → B → J2.","At J1 (4-way box): U1 up to lamp L1, D1 down to switch S1.","At J2 (3-way box): U2 up to lamp L2, D2 down to switch S2.","The table gives the wires in each run. D1 carries 4 wires, the most on the board."],
      hi:["हर रन एक 15 cm टुकड़ा है। कुल छह टुकड़े: A, B, U1, D1, U2, D2।","मुख्य रन: सप्लाई → A → J1 → B → J2।","J1 (4-वे बॉक्स) पर: U1 ऊपर लैंप L1 तक, D1 नीचे स्विच S1 तक।","J2 (3-वे बॉक्स) पर: U2 ऊपर लैंप L2 तक, D2 नीचे स्विच S2 तक।","तालिका में हर रन के तार दिए हैं। D1 में 4 तार हैं, बोर्ड पर सबसे अधिक।"],
      ml:["ഓരോ റണ്ണും ഒരു 15 cm കഷണം. ആകെ ആറ് കഷണങ്ങൾ: A, B, U1, D1, U2, D2.","പ്രധാന റൺ: സപ്ലൈ → A → J1 → B → J2.","J1-ൽ (4-വേ ബോക്സ്): U1 മുകളിലേക്ക് ലാമ്പ് L1 വരെ, D1 താഴേക്ക് സ്വിച്ച് S1 വരെ.","J2-ൽ (3-വേ ബോക്സ്): U2 മുകളിലേക്ക് ലാമ്പ് L2 വരെ, D2 താഴേക്ക് സ്വിച്ച് S2 വരെ.","ഓരോ റണ്ണിലെയും വയറുകൾ പട്ടികയിൽ. D1-ൽ 4 വയറുകൾ, ബോർഡിലെ ഏറ്റവും കൂടുതൽ."]},
  ex:{en:"The junction box is like a bus stand: routes meet and turn here, and you can open it to pull or check wires.",hi:"जंक्शन बॉक्स बस स्टैंड जैसा है: मार्ग यहाँ मिलते और मुड़ते हैं, और तार खींचने या जाँचने के लिए इसे खोला जा सकता है।",ml:"ജംഗ്ഷൻ ബോക്സ് ഒരു ബസ് സ്റ്റാൻഡ് പോലെയാണ്: റൂട്ടുകൾ ഇവിടെ ചേരുകയും തിരിയുകയും ചെയ്യുന്നു, വയർ വലിക്കാനോ പരിശോധിക്കാനോ ഇത് തുറക്കാം."}},
 {v:"marking",t:{en:"Marking the board",hi:"बोर्ड पर मार्किंग",ml:"ബോർഡിൽ മാർക്കിംഗ്"},
  li:{en:["Snap a chalked marking thread for the main horizontal line.","Mark the centre of J1 and J2 so that each pipe between them is 15 cm.","Draw the vertical lines through J1 and J2: one 15 cm piece up to each lamp, one down to each switch.","Place all fittings dry, without screws, and check that every 15 cm piece fits between its boxes.","Make pilot holes with the poker at every screw point. On hard teak, tap the poker lightly with the hammer."],
      hi:["मुख्य क्षैतिज रेखा के लिए चॉक लगे मार्किंग धागे को झटकें।","J1 और J2 के केंद्र इस तरह मार्क करें कि उनके बीच हर पाइप 15 cm हो।","J1 और J2 से ऊर्ध्वाधर रेखाएँ खींचें: हर लैंप तक ऊपर एक 15 cm टुकड़ा, हर स्विच तक नीचे एक।","सभी फिटिंग बिना स्क्रू के रखकर जाँचें कि हर 15 cm टुकड़ा अपने बॉक्सों के बीच ठीक बैठता है।","हर स्क्रू पॉइंट पर पोकर से पायलट छेद बनाएँ। कठोर सागौन पर पोकर को हथौड़े से हल्का ठोकें।"],
      ml:["പ്രധാന തിരശ്ചീന രേഖയ്ക്ക് ചോക്ക് പുരട്ടിയ മാർക്കിംഗ് നൂൽ തട്ടുക.","ഇടയിലെ ഓരോ പൈപ്പും 15 cm ആകുന്ന വിധത്തിൽ J1, J2 എന്നിവയുടെ മധ്യം മാർക്ക് ചെയ്യുക.","J1, J2 എന്നിവയിലൂടെ ലംബ രേഖകൾ വരയ്ക്കുക: ഓരോ ലാമ്പിലേക്കും മുകളിലേക്ക് ഒരു 15 cm കഷണം, ഓരോ സ്വിച്ചിലേക്കും താഴേക്ക് ഒന്ന്.","എല്ലാ ഫിറ്റിംഗുകളും സ്ക്രൂ ഇല്ലാതെ വച്ച്, ഓരോ 15 cm കഷണവും ബോക്സുകൾക്കിടയിൽ ശരിയായി ഇരിക്കുന്നുണ്ടോ എന്ന് പരിശോധിക്കുക.","ഓരോ സ്ക്രൂ പോയിന്റിലും പോക്കർ ഉപയോഗിച്ച് പൈലറ്റ് ദ്വാരം ഉണ്ടാക്കുക. കട്ടിയുള്ള തേക്കിൽ പോക്കറിൽ ചുറ്റിക കൊണ്ട് ചെറുതായി തട്ടുക."]},
  ex:{en:"A tailor marks the cloth with chalk before cutting. Measure twice, cut once.",hi:"दर्ज़ी काटने से पहले कपड़े पर चॉक से निशान लगाता है। दो बार नापें, एक बार काटें।",ml:"തയ്യൽക്കാരൻ മുറിക്കുന്നതിന് മുൻപ് തുണിയിൽ ചോക്ക് കൊണ്ട് അടയാളമിടുന്നു. രണ്ടു തവണ അളക്കുക, ഒരു തവണ മുറിക്കുക."}},
 {v:"cut",t:{en:"Cutting the pipe pieces",hi:"पाइप के टुकड़े काटना",ml:"പൈപ്പ് കഷണങ്ങൾ മുറിക്കൽ"},
  li:{en:["Measure 15 cm and mark a line all round the pipe.","Hold the pipe firmly. Start with a few short strokes on the mark.","Cut straight and square, using the full blade length. Cut on the forward stroke; lift slightly on the return.","Remove burrs inside and outside with a knife or file.","Make 6 pieces and check each one: 15 cm. A square cut sits fully in the box socket."],
      hi:["15 cm नापें और पाइप के चारों ओर रेखा बनाएँ।","पाइप को मज़बूती से पकड़ें। निशान पर कुछ छोटे स्ट्रोक से शुरू करें।","पूरी ब्लेड लंबाई से सीधा और समकोण काटें। आगे के स्ट्रोक पर काटें; वापसी में हल्का उठाएँ।","चाकू या रेती से अंदर और बाहर के बर हटाएँ।","6 टुकड़े बनाएँ और हर एक जाँचें: 15 cm। समकोण कट बॉक्स सॉकेट में पूरा बैठता है।"],
      ml:["15 cm അളന്ന് പൈപ്പിന് ചുറ്റും വര വരയ്ക്കുക.","പൈപ്പ് ഉറപ്പായി പിടിക്കുക. അടയാളത്തിൽ കുറച്ച് ചെറിയ സ്ട്രോക്കുകൾ കൊണ്ട് തുടങ്ങുക.","മുഴുവൻ ബ്ലേഡ് നീളം ഉപയോഗിച്ച് നേരെയും ലംബമായും മുറിക്കുക. മുന്നോട്ടുള്ള സ്ട്രോക്കിൽ മുറിക്കുക; തിരികെ വരുമ്പോൾ ചെറുതായി ഉയർത്തുക.","കത്തി അല്ലെങ്കിൽ ഫയൽ ഉപയോഗിച്ച് അകത്തും പുറത്തുമുള്ള ബർ നീക്കം ചെയ്യുക.","6 കഷണങ്ങൾ ഉണ്ടാക്കി ഓരോന്നും പരിശോധിക്കുക: 15 cm. ലംബമായ മുറിവ് ബോക്സ് സോക്കറ്റിൽ പൂർണ്ണമായി ഇരിക്കും."]},
  sf:{en:"Keep fingers away from the cutting line. Blade teeth face forward.",hi:"उंगलियाँ कटिंग लाइन से दूर रखें। ब्लेड के दाँत आगे की ओर।",ml:"വിരലുകൾ മുറിക്കുന്ന വരയിൽ നിന്ന് അകറ്റി വയ്ക്കുക. ബ്ലേഡിന്റെ പല്ലുകൾ മുന്നോട്ട്."},
  ex:{en:"A burr inside the pipe is like a sharp edge inside a shirt sleeve: every time the wire is pulled, its insulation gets scratched.",hi:"पाइप के अंदर का बर कमीज़ की आस्तीन के अंदर तेज़ किनारे जैसा है: हर बार तार खींचने पर उसका इंसुलेशन छिलता है।",ml:"പൈപ്പിനുള്ളിലെ ബർ ഷർട്ടിന്റെ കൈക്കുള്ളിലെ മൂർച്ചയുള്ള അറ്റം പോലെയാണ്: വയർ വലിക്കുമ്പോഴെല്ലാം അതിന്റെ ഇൻസുലേഷൻ ഉരയും."}},
 {v:"assembly",t:{en:"Assembling the pipe run",hi:"पाइप रन की असेंबली",ml:"പൈപ്പ് റൺ അസംബ്ലി"},
  li:{en:["Push pipe A into the left side of J1.","Fit pipe B between the right side of J1 and the left side of J2.","At J1: fit U1 on top and D1 at the bottom.","At J2: fit U2 on top and D2 at the bottom.","U1 enters lamp block L1, U2 enters L2, D1 enters the S1 box, D2 enters the S2 box.","Push every pipe fully into its socket. No gap should be seen."],
      hi:["पाइप A को J1 की बाईं ओर डालें।","पाइप B को J1 की दाईं ओर और J2 की बाईं ओर के बीच लगाएँ।","J1 पर: ऊपर U1 और नीचे D1 लगाएँ।","J2 पर: ऊपर U2 और नीचे D2 लगाएँ।","U1 लैंप ब्लॉक L1 में, U2 L2 में, D1 S1 बॉक्स में, D2 S2 बॉक्स में जाता है।","हर पाइप को सॉकेट में पूरा धकेलें। कोई गैप न दिखे।"],
      ml:["പൈപ്പ് A, J1-ന്റെ ഇടതുവശത്ത് കയറ്റുക.","പൈപ്പ് B, J1-ന്റെ വലതുവശത്തിനും J2-ന്റെ ഇടതുവശത്തിനും ഇടയിൽ ഘടിപ്പിക്കുക.","J1-ൽ: മുകളിൽ U1, താഴെ D1 ഘടിപ്പിക്കുക.","J2-ൽ: മുകളിൽ U2, താഴെ D2 ഘടിപ്പിക്കുക.","U1 ലാമ്പ് ബ്ലോക്ക് L1-ലേക്കും U2 L2-ലേക്കും D1 S1 ബോക്സിലേക്കും D2 S2 ബോക്സിലേക്കും കയറുന്നു.","ഓരോ പൈപ്പും സോക്കറ്റിൽ പൂർണ്ണമായി കയറ്റുക. ഒരു വിടവും കാണരുത്."]},
  ex:{en:"Like water pipes at home: tee, bend and box are the joints. A pipe not pushed fully in leaks water; here it leaves the wire exposed.",hi:"घर के पानी के पाइप की तरह: टी, बेंड और बॉक्स जोड़ हैं। पूरा न धकेला गया पाइप पानी टपकाता है; यहाँ तार खुला रह जाता है।",ml:"വീട്ടിലെ വെള്ള പൈപ്പുകൾ പോലെ: ടീ, ബെൻഡ്, ബോക്സ് എന്നിവ ജോയിന്റുകളാണ്. മുഴുവൻ കയറ്റാത്ത പൈപ്പ് വെള്ളം ചോർത്തും; ഇവിടെ വയർ പുറത്ത് കാണപ്പെടും."}},
 {v:"fixing",t:{en:"Fixing saddles and boxes",hi:"सैडल और बॉक्स फिक्स करना",ml:"സാഡിലുകളും ബോക്സുകളും ഉറപ്പിക്കൽ"},
  li:{en:["Place one saddle on each 15 cm piece, near its middle. Six saddles in all.","Pilot hole with the poker, then drive both screws with the screwdriver, a little at a time on each side.","Fix J1 and J2, the S1 and S2 boxes and both lamp round blocks with screws.","Check: pipes straight, level and firm. Nothing must move when pushed."],
      hi:["हर 15 cm टुकड़े पर बीच के पास एक सैडल रखें। कुल छह सैडल।","पोकर से पायलट छेद, फिर पेचकस से दोनों स्क्रू, हर तरफ़ थोड़ा-थोड़ा कसें।","J1 और J2, S1 और S2 बॉक्स और दोनों लैंप राउंड ब्लॉक स्क्रू से फिक्स करें।","जाँचें: पाइप सीधे, समतल और मज़बूत। धकेलने पर कुछ भी नहीं हिलना चाहिए।"],
      ml:["ഓരോ 15 cm കഷണത്തിലും നടുവിനടുത്ത് ഒരു സാഡിൽ വയ്ക്കുക. ആകെ ആറ് സാഡിലുകൾ.","പോക്കർ കൊണ്ട് പൈലറ്റ് ദ്വാരം, തുടർന്ന് സ്ക്രൂഡ്രൈവർ കൊണ്ട് രണ്ട് സ്ക്രൂകളും ഓരോ വശത്തും അൽപ്പാൽപ്പമായി മുറുക്കുക.","J1, J2, S1, S2 ബോക്സുകൾ, രണ്ട് ലാമ്പ് റൗണ്ട് ബ്ലോക്കുകൾ എന്നിവ സ്ക്രൂ ഉപയോഗിച്ച് ഉറപ്പിക്കുക.","പരിശോധിക്കുക: പൈപ്പുകൾ നേരെ, നിരപ്പിൽ, ഉറപ്പിൽ. തള്ളിയാൽ ഒന്നും അനങ്ങരുത്."]},
  sf:{en:"Do not over-tighten. PVC saddles and boxes can crack.",hi:"ज़्यादा न कसें। पीवीसी सैडल और बॉक्स टूट सकते हैं।",ml:"അമിതമായി മുറുക്കരുത്. PVC സാഡിലുകളും ബോക്സുകളും പൊട്ടാം."},
  ex:{en:"A saddle holds the pipe the way a belt clip holds a mobile pouch: firm, but not crushing it.",hi:"सैडल पाइप को वैसे पकड़ता है जैसे बेल्ट क्लिप मोबाइल पाउच को: मज़बूती से, पर दबाकर तोड़े बिना।",ml:"ബെൽറ്റ് ക്ലിപ്പ് മൊബൈൽ പൗച്ചിനെ പിടിക്കുന്നതുപോലെ സാഡിൽ പൈപ്പിനെ പിടിക്കുന്നു: ഉറപ്പോടെ, പക്ഷേ ഞെരിക്കാതെ."}},
 {v:"wires",t:{en:"Drawing wires",hi:"तार खींचना",ml:"വയർ വലിക്കൽ"},
  li:{en:["Straighten each wire before drawing.","Draw from box to box. J1, J2, the switch boxes and lamp blocks are your pulling points.","Count wires with the Layout table. D1 carries 4 wires, the most on the board.","Only one P and one N enter from the supply. P loops at S1 terminal 1 to feed S2. N loops at L1 to feed S1 terminal 2. X loops at L2 to feed L1.","No joints in pipes or boxes. Loops are made only at terminals.","Leave about 10 cm extra at every switch and lamp point."],
      hi:["खींचने से पहले हर तार सीधा करें।","बॉक्स से बॉक्स तक खींचें। J1, J2, स्विच बॉक्स और लैंप ब्लॉक खींचने के पॉइंट हैं।","लेआउट तालिका से तार गिनें। D1 में 4 तार हैं, बोर्ड पर सबसे अधिक।","सप्लाई से केवल एक P और एक N आते हैं। P, S1 टर्मिनल 1 पर लूप होकर S2 को जाता है। N, L1 पर लूप होकर S1 टर्मिनल 2 को जाता है। X, L2 पर लूप होकर L1 को जाता है।","पाइप या बॉक्स में कोई जोड़ नहीं। लूप केवल टर्मिनल पर।","हर स्विच और लैंप पॉइंट पर लगभग 10 cm अतिरिक्त छोड़ें।"],
      ml:["വലിക്കുന്നതിന് മുൻപ് ഓരോ വയറും നേരെയാക്കുക.","ബോക്സിൽ നിന്ന് ബോക്സിലേക്ക് വലിക്കുക. J1, J2, സ്വിച്ച് ബോക്സുകൾ, ലാമ്പ് ബ്ലോക്കുകൾ എന്നിവയാണ് വലിക്കാനുള്ള പോയിന്റുകൾ.","ലേഔട്ട് പട്ടിക നോക്കി വയറുകൾ എണ്ണുക. D1-ൽ 4 വയറുകൾ, ബോർഡിലെ ഏറ്റവും കൂടുതൽ.","സപ്ലൈയിൽ നിന്ന് ഒരു P-യും ഒരു N-ഉം മാത്രം. P, S1 ടെർമിനൽ 1-ൽ ലൂപ്പ് ചെയ്ത് S2-ലേക്ക്. N, L1-ൽ ലൂപ്പ് ചെയ്ത് S1 ടെർമിനൽ 2-ലേക്ക്. X, L2-ൽ ലൂപ്പ് ചെയ്ത് L1-ലേക്ക്.","പൈപ്പിലോ ബോക്സിലോ ജോയിന്റ് പാടില്ല. ലൂപ്പ് ടെർമിനലിൽ മാത്രം.","ഓരോ സ്വിച്ച്, ലാമ്പ് പോയിന്റിലും ഏകദേശം 10 cm അധികം വിടുക."]},
  ex:{en:"Like threading a needle: a straight thread goes in easily. Pull gently and steadily; do not jerk.",hi:"सुई में धागा डालने जैसा: सीधा धागा आसानी से जाता है। धीरे और लगातार खींचें; झटका न दें।",ml:"സൂചിയിൽ നൂൽ കോർക്കുന്നതുപോലെ: നേരെയുള്ള നൂൽ എളുപ്പം കയറും. സാവധാനം സ്ഥിരമായി വലിക്കുക; വെട്ടി വലിക്കരുത്."}},
 {v:"term",t:{en:"Connections at switches and lamps",hi:"स्विच और लैंप पर कनेक्शन",ml:"സ്വിച്ചുകളിലെയും ലാമ്പുകളിലെയും കണക്ഷനുകൾ"},
  li:{en:["Strip only about 1 cm of insulation. Twist the strands.","Three terminals take two wires (a loop): S1 terminal 1 (P ×2), L1 neutral terminal (N ×2), L2 X terminal (X ×2). Twist each pair together before inserting.","Insert fully and tighten. No bare copper outside the terminal.","Follow the terminal charts exactly.","Supply end: P and N are connected to the supply only by the instructor."],
      hi:["केवल लगभग 1 cm इंसुलेशन छीलें। स्ट्रैंड्स को मरोड़ें।","तीन टर्मिनलों पर दो तार (लूप) आते हैं: S1 टर्मिनल 1 (P ×2), L1 न्यूट्रल टर्मिनल (N ×2), L2 X टर्मिनल (X ×2)। डालने से पहले हर जोड़ी को साथ मरोड़ें।","पूरा डालें और कसें। टर्मिनल के बाहर नंगा तांबा न दिखे।","टर्मिनल चार्ट का ठीक पालन करें।","सप्लाई सिरा: P और N केवल अनुदेशक द्वारा सप्लाई से जोड़े जाते हैं।"],
      ml:["ഏകദേശം 1 cm ഇൻസുലേഷൻ മാത്രം കളയുക. സ്ട്രാൻഡുകൾ പിരിക്കുക.","മൂന്ന് ടെർമിനലുകളിൽ രണ്ട് വയറുകൾ (ലൂപ്പ്) വരുന്നു: S1 ടെർമിനൽ 1 (P ×2), L1 ന്യൂട്രൽ ടെർമിനൽ (N ×2), L2 X ടെർമിനൽ (X ×2). കയറ്റുന്നതിന് മുൻപ് ഓരോ ജോഡിയും ഒരുമിച്ച് പിരിക്കുക.","പൂർണ്ണമായി കയറ്റി മുറുക്കുക. ടെർമിനലിന് പുറത്ത് നഗ്ന ചെമ്പ് കാണരുത്.","ടെർമിനൽ ചാർട്ടുകൾ കൃത്യമായി പാലിക്കുക.","സപ്ലൈ അറ്റം: P, N എന്നിവ ഇൻസ്ട്രക്ടർ മാത്രമേ സപ്ലൈയുമായി ബന്ധിപ്പിക്കൂ."]},
  ex:{en:"S1 works like a two-way water valve that connects the far end of L2 either to the supply pipe (phase) or to the drain pipe (neutral).",hi:"S1 दो-तरफ़ा पानी वाल्व की तरह है जो L2 के दूसरे सिरे को या तो सप्लाई पाइप (फेज़) से या ड्रेन पाइप (न्यूट्रल) से जोड़ता है।",ml:"L2-ന്റെ മറ്റേ അറ്റത്തെ സപ്ലൈ പൈപ്പുമായോ (ഫേസ്) ഡ്രെയിൻ പൈപ്പുമായോ (ന്യൂട്രൽ) ബന്ധിപ്പിക്കുന്ന ഒരു ടു-വേ വാട്ടർ വാൽവ് പോലെയാണ് S1."}},
 {v:"test",t:{en:"Testing",hi:"परीक्षण",ml:"ടെസ്റ്റിംഗ്"},li:null,
  pre:{en:["Visual check: all covers fitted, saddles tight, no bare copper.","Strength check of all fixtures by hand (see the last step).","Tug test: pull each wire gently at its terminal. It must not come out.","Trace P: supply → S1 terminal 1 → loop → S2 IN. Trace N: supply → L1 → loop → S1 terminal 2.","Continuity test with the instructor's series test lamp or multimeter, if available."],
       hi:["दृश्य जाँच: सभी कवर लगे, सैडल कसे, कोई नंगा तांबा नहीं।","सभी फिक्सिंग की हाथ से मज़बूती जाँच (अंतिम चरण देखें)।","टग टेस्ट: हर तार को टर्मिनल पर हल्का खींचें। बाहर नहीं आना चाहिए।","P ट्रेस करें: सप्लाई → S1 टर्मिनल 1 → लूप → S2 IN। N ट्रेस करें: सप्लाई → L1 → लूप → S1 टर्मिनल 2।","उपलब्ध हो तो अनुदेशक के सीरीज़ टेस्ट लैंप या मल्टीमीटर से निरंतरता परीक्षण।"],
       ml:["ദൃശ്യ പരിശോധന: എല്ലാ കവറുകളും ഘടിപ്പിച്ചു, സാഡിലുകൾ മുറുകി, നഗ്ന ചെമ്പ് ഇല്ല.","എല്ലാ ഫിക്സിംഗുകളുടെയും ഉറപ്പ് കൈകൊണ്ട് പരിശോധിക്കുക (അവസാന ഘട്ടം കാണുക).","ടഗ് ടെസ്റ്റ്: ഓരോ വയറും ടെർമിനലിൽ ചെറുതായി വലിക്കുക. പുറത്തുവരരുത്.","P പിന്തുടരുക: സപ്ലൈ → S1 ടെർമിനൽ 1 → ലൂപ്പ് → S2 IN. N പിന്തുടരുക: സപ്ലൈ → L1 → ലൂപ്പ് → S1 ടെർമിനൽ 2.","ലഭ്യമെങ്കിൽ ഇൻസ്ട്രക്ടറുടെ സീരീസ് ടെസ്റ്റ് ലാമ്പ് അല്ലെങ്കിൽ മൾട്ടിമീറ്റർ ഉപയോഗിച്ച് കണ്ടിന്യൂയിറ്റി ടെസ്റ്റ്."]},
  liv:{en:["Tester on IN of S2 and terminal 1 of S1: glows.","Tester on terminal 2 of S1 and the N terminal of L1: no glow.","Operate S1 and S2 in all 4 positions and record the result in the table.","All-off condition: tester on both lamp holders must not glow.","Only-L1 condition: L2 is dark but both its terminals are live. Never change a lamp just because it is dark; switch off the supply first.","Switch OFF the supply after testing."],
       hi:["S2 के IN और S1 के टर्मिनल 1 पर टेस्टर: जलता है।","S1 के टर्मिनल 2 और L1 के N टर्मिनल पर टेस्टर: नहीं जलता।","S1 और S2 को चारों स्थितियों में चलाएँ और परिणाम तालिका में लिखें।","सब-बंद स्थिति: दोनों लैंप होल्डर पर टेस्टर नहीं जलना चाहिए।","केवल-L1 स्थिति: L2 बुझा है पर उसके दोनों टर्मिनल लाइव हैं। लैंप बुझा देखकर उसे न बदलें; पहले सप्लाई बंद करें।","परीक्षण के बाद सप्लाई बंद करें।"],
       ml:["S2-ന്റെ IN-ലും S1-ന്റെ ടെർമിനൽ 1-ലും ടെസ്റ്റർ: കത്തുന്നു.","S1-ന്റെ ടെർമിനൽ 2-ലും L1-ന്റെ N ടെർമിനലിലും ടെസ്റ്റർ: കത്തുന്നില്ല.","S1, S2 എന്നിവ 4 സ്ഥാനങ്ങളിലും പ്രവർത്തിപ്പിച്ച് ഫലം പട്ടികയിൽ രേഖപ്പെടുത്തുക.","എല്ലാം-ഓഫ് അവസ്ഥ: രണ്ട് ലാമ്പ് ഹോൾഡറുകളിലും ടെസ്റ്റർ കത്തരുത്.","L1-മാത്രം അവസ്ഥ: L2 അണഞ്ഞിരിക്കുന്നു, പക്ഷേ അതിന്റെ രണ്ട് ടെർമിനലുകളും ലൈവ് ആണ്. ലാമ്പ് അണഞ്ഞതുകൊണ്ട് മാത്രം അത് മാറ്റരുത്; ആദ്യം സപ്ലൈ ഓഫ് ചെയ്യുക.","ടെസ്റ്റിന് ശേഷം സപ്ലൈ ഓഫ് ചെയ്യുക."]},
  sf:{en:"Never test live without the instructor. Stand on a dry floor and use one hand.",hi:"अनुदेशक के बिना कभी लाइव परीक्षण न करें। सूखे फ़र्श पर खड़े हों और एक हाथ का उपयोग करें।",ml:"ഇൻസ്ട്രക്ടർ ഇല്ലാതെ ഒരിക്കലും ലൈവ് ടെസ്റ്റ് ചെയ്യരുത്. ഉണങ്ങിയ തറയിൽ നിൽക്കുക, ഒരു കൈ മാത്രം ഉപയോഗിക്കുക."},
  ex:{en:"A dark lamp is not a dead lamp, just as a closed water tap still has pressure behind it. Isolate the supply before you touch any holder.",hi:"बुझा लैंप मरा हुआ लैंप नहीं है, जैसे बंद नल के पीछे भी पानी का दबाव रहता है। किसी होल्डर को छूने से पहले सप्लाई अलग करें।",ml:"അടച്ച വാട്ടർ ടാപ്പിന് പിന്നിലും മർദ്ദം ഉള്ളതുപോലെ, അണഞ്ഞ ലാമ്പ് ഡെഡ് അല്ല. ഏതെങ്കിലും ഹോൾഡർ തൊടുന്നതിന് മുൻപ് സപ്ലൈ വേർപെടുത്തുക."}},
 {v:"faults",wide:1,t:{en:"Common faults and final checklist",hi:"सामान्य दोष और अंतिम जाँच सूची",ml:"സാധാരണ തകരാറുകളും അന്തിമ ചെക്ക്‌ലിസ്റ്റും"},li:null,
  ex:{en:"A pilot runs a checklist before every take-off, even after a thousand flights. Do the same before you call the instructor.",hi:"पायलट हर उड़ान से पहले जाँच सूची पढ़ता है, हज़ार उड़ानों के बाद भी। अनुदेशक को बुलाने से पहले आप भी ऐसा ही करें।",ml:"ആയിരം യാത്രകൾക്ക് ശേഷവും ഓരോ ടേക്ക്-ഓഫിന് മുൻപും പൈലറ്റ് ചെക്ക്‌ലിസ്റ്റ് പരിശോധിക്കുന്നു. ഇൻസ്ട്രക്ടറെ വിളിക്കുന്നതിന് മുൻപ് നിങ്ങളും അങ്ങനെ ചെയ്യുക."}}
];

/* ---------- state ---------- */
const S={lang:"en",step:0,s1:1,s2:0,tester:null,obs:{},chk:{},work:{}};
const store={get(k,d){try{const v=localStorage.getItem("hw_"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("hw_"+k,JSON.stringify(v))}catch(e){}}};
S.lang=store.get("lang","en");S.step=Math.min(store.get("step",0),STEPS.length-1);
let fs=store.get("fs",20),skin=store.get("skin","auto");
const $=s=>document.querySelector(s);
const u=k=>UI[S.lang][k];
const L=o=>typeof o==="string"?o:(o[S.lang]||o.en);
const nm=k=>({supply:u("supply")}[k]||k);

/* ---------- board drawing: 1 cm = 10 units; every run is one 15 cm piece ---------- */
const MY=330,J1=213,J2=429,LY=102,SY=555,BW=600,BH=650;
const PIPE_GEO={A:[30,MY,180,MY],B:[246,MY,396,MY],U1:[J1,297,J1,147],D1:[J1,363,J1,513],U2:[J2,297,J2,147],D2:[J2,363,J2,513]};
const PORDER=["A","B","U1","D1","U2","D2"];
function sadd(p){const [x1,y1,x2,y2]=PIPE_GEO[p];return [(x1+x2)/2,(y1+y2)/2,y1===y2?"h":"v"]}
function boardBg(){
  let g=`<rect x="0" y="0" width="${BW}" height="${BH}" rx="10" fill="var(--board)"/>`;
  for(let i=0;i<9;i++){const y=30+i*72;g+=`<path d="M0 ${y} C 180 ${y-14}, 380 ${y+16}, ${BW} ${y-6}" stroke="var(--grain)" stroke-width="2" fill="none" opacity=".45"/>`}
  return g;
}
function pipeLine(p,cls,d){const [x1,y1,x2,y2]=PIPE_GEO[p];const h=y1===y2;
  return `<g class="${cls||""}" style="--d:${d||0}s"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--pipe)" stroke-width="20"/><line x1="${x1-(h?0:5)}" y1="${y1-(h?5:0)}" x2="${x2-(h?0:5)}" y2="${y2-(h?5:0)}" stroke="var(--pipe-hi)" stroke-width="3" opacity=".7"/></g>`}
function jbox(x,cls,d,name){return `<g class="${cls||""}" style="--d:${d||0}s"><circle cx="${x}" cy="${MY}" r="33" fill="var(--pipe)"/><circle cx="${x}" cy="${MY}" r="25" fill="none" stroke="var(--pipe-hi)" stroke-width="2"/><text x="${x}" y="${MY+6}" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">${name}</text></g>`}
function lampBlock(x,cls,d,glow){return `<g class="${cls||""}" style="--d:${d||0}s">${glow?`<circle cx="${x}" cy="${LY}" r="62" fill="#FFD84D" opacity=".6"/>`:""}<circle cx="${x}" cy="${LY}" r="45" fill="var(--fit)" stroke="var(--fit-edge)" stroke-width="2"/><circle cx="${x}" cy="${LY}" r="22" fill="var(--fit)" stroke="var(--fit-edge)" stroke-width="2"/><circle cx="${x}" cy="${LY}" r="10" fill="${glow?"#FFE14D":"#C9A35C"}" stroke="var(--fit-edge)"/></g>`}
function swBox(cx,cls,d){const cy=SY;return `<g class="${cls||""}" style="--d:${d||0}s"><rect x="${cx-42}" y="${cy-42}" width="84" height="84" rx="6" fill="var(--fit)" stroke="var(--fit-edge)" stroke-width="2"/><rect x="${cx-12}" y="${cy-20}" width="24" height="40" rx="3" fill="#ffffff" stroke="var(--fit-edge)"/><rect x="${cx-8}" y="${cy-16}" width="16" height="16" rx="2" fill="#d9d6cf"/></g>`}
function saddle(p,cls,d){const [x,y,o]=sadd(p);const st=`class="${cls||""}" style="--d:${d||0}s"`;
  return o==="h"?`<g ${st}><rect x="${x-5}" y="${y-22}" width="10" height="44" rx="2" fill="#C9CED1" stroke="#6d7377"/><circle cx="${x}" cy="${y-27}" r="5" fill="#C9CED1" stroke="#6d7377"/><circle cx="${x}" cy="${y+27}" r="5" fill="#C9CED1" stroke="#6d7377"/></g>`
   :`<g ${st}><rect x="${x-22}" y="${y-5}" width="44" height="10" rx="2" fill="#C9CED1" stroke="#6d7377"/><circle cx="${x-27}" cy="${y}" r="5" fill="#C9CED1" stroke="#6d7377"/><circle cx="${x+27}" cy="${y}" r="5" fill="#C9CED1" stroke="#6d7377"/></g>`}
function tag(x,y,t,size){size=size||17;return `<g><rect x="${x-4}" y="${y-size}" width="${String(t).length*size*.62+10}" height="${size+8}" rx="5" fill="rgba(0,0,0,.62)"/><text x="${x+1}" y="${y}" font-size="${size}" fill="#fff" font-weight="700">${t}</text></g>`}
function labels(){
  const pt={A:[120,304],B:[276,304],U1:[230,190],D1:[230,480],U2:[446,190],D2:[446,480]};
  let s=PORDER.map(p=>tag(pt[p][0],pt[p][1],p,15)).join("");
  s+=tag(10,300,nm("supply"),15);
  s+=`<g font-size="24" font-weight="800" fill="#fff"><text x="${J1-58}" y="${LY+8}" text-anchor="end">L1</text><text x="${J2+58}" y="${LY+8}">L2</text><text x="${J1-52}" y="${SY+8}" text-anchor="end">S1</text><text x="${J2+52}" y="${SY+8}">S2</text></g>`;
  return s;
}
function dims(){
  const h=(x1,x2,y)=>`<g stroke="#fff" stroke-width="1.5"><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><line x1="${x1}" y1="${y-7}" x2="${x1}" y2="${y+7}"/><line x1="${x2}" y1="${y-7}" x2="${x2}" y2="${y+7}"/></g><text x="${(x1+x2)/2}" y="${y+20}" text-anchor="middle" font-size="15" fill="#fff" font-weight="700">15 cm</text>`;
  const v=(x,y1,y2,side)=>`<g stroke="#fff" stroke-width="1.5"><line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/><line x1="${x-7}" y1="${y1}" x2="${x+7}" y2="${y1}"/><line x1="${x-7}" y1="${y2}" x2="${x+7}" y2="${y2}"/></g><text x="${side>0?x+8:x-8}" y="${(y1+y2)/2+5}" text-anchor="${side>0?"start":"end"}" font-size="15" fill="#fff" font-weight="700">15 cm</text>`;
  return h(30,180,378)+h(246,396,378)+v(160,147,297,-1)+v(160,363,513,-1)+v(500,147,297,1)+v(500,363,513,1);
}
/* routes traced from the given wiring diagram: N loops at L1, P loops at S1, X loops at L2 */
const ROUTE={
 N1:["N","M14 324 H204 V120"],
 P1:["P","M14 336 H201 V540"],
 N2:["N","M213 120 V330 H209 V540"],
 P2:["P","M225 540 V338 H424 V540"],
 C:["C","M217 540 V330 H420 V120"],
 Xa:["X","M434 540 V330 H438 V120"],
 Xb:["X","M429 120 V322 H222 V120"]
};
function wireLayer(anim){
  return Object.entries(ROUTE).map(([k,[w,d]],i)=>{const a=anim?`class="draw" style="--d:${i*.9}s;--t:1.5s"`:"";
   return `<path d="${d}" pathLength="1" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round" opacity=".55" ${a}/><path d="${d}" pathLength="1" fill="none" stroke="var(${WC[w]})" stroke-width="3.5" stroke-linejoin="round" ${a}/>`}).join("");
}
function layoutSVG(o){
  o=o||{};
  let s=`<svg viewBox="-4 -4 ${BW+8} ${BH+8}" role="img" aria-label="${u("dims")}">`+boardBg();
  if(o.marks){
    s+=`<g stroke="var(--chalk)" stroke-width="2.5" fill="none" stroke-dasharray="1"><path class="draw" pathLength="1" style="--t:1.2s" d="M20 ${MY} H${BW-60}"/><path class="draw" pathLength="1" style="--d:1.2s;--t:.8s" d="M${J1} 40 V620"/><path class="draw" pathLength="1" style="--d:1.6s;--t:.8s" d="M${J2} 40 V620"/></g>`;
    [[J1,MY],[J2,MY],[J1,LY],[J2,LY],[J1,SY],[J2,SY]].forEach((c,i)=>{s+=`<g class="seq" style="--d:${2.5+i*.2}s" stroke="#fff" stroke-width="3"><line x1="${c[0]-10}" y1="${c[1]-10}" x2="${c[0]+10}" y2="${c[1]+10}"/><line x1="${c[0]+10}" y1="${c[1]-10}" x2="${c[0]-10}" y2="${c[1]+10}"/></g>`});

}
function workTable(){const c=L(WORK.cols),ok=L(WORK.ok);const n=Object.values(S.work).filter(v=>v===1).length;
  return `<div class="panel tw"><table><thead><tr><th>#</th><th>${c[0]}</th><th>${c[1]}</th><th>${c[2]}</th></tr></thead><tbody>${WORK.rows.map((r,i)=>{const v=S.work[i];return `<tr><td class="num">${i+1}</td><td><b>${L(r[0])}</b></td><td>${L(r[1])}</td><td class="obs code" data-work="${i}" tabindex="0" role="button" style="white-space:nowrap;color:${v===1?"var(--ok)":v===2?"var(--safe-line)":"inherit"}">${v===1?"✔ "+ok[0]:v===2?"✘ "+ok[1]:"—"}</td></tr>`}).join("")}</tbody><tfoot><tr><td colspan="3" style="text-align:right"><b>${ok[0]}</b></td><td class="num">${n} / ${WORK.rows.length}</td></tr></tfoot></table></div>`}

/* ---------- render ---------- */
function exBox(st){return st.ex?`<div class="box ex"><div class="lbl"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="6" r="5" fill="currentColor"/><rect x="5.5" y="11" width="5" height="4" rx="1" fill="currentColor"/></svg>${u("ex")}</div><p>${L(st.ex)}</p></div>`:""}
function sfBox(st){return st.sf?`<div class="box safe"><div class="lbl"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1 L15 14 H1 Z" fill="currentColor"/><rect x="7.2" y="5.5" width="1.6" height="4.5" fill="var(--safe-bg)"/><rect x="7.2" y="11" width="1.6" height="1.6" fill="var(--safe-bg)"/></svg>${u("safe")}</div><p>${L(st.sf)}</p></div>`:""}
const ol=a=>`<ol class="do">${a.map(x=>`<li><span>${x}</span></li>`).join("")}</ol>`;
function replayBtn(id){return `<button class="btn ghost" data-replay="${id}">↻ ${u("play")}</button>`}
const ANIM={marking:{marks:1},assembly:{seq:1},fixing:{saddles:1,saddleAnim:1},wires:{saddles:1,wires:1,wireAnim:1,xray:1}};
function visual(st){
  switch(st.v){
   case "photo":return `<div class="panel">${layoutSVG({saddles:1,glow:"b"})}<p class="cap">${u("photoCap")}</p></div>`;
   case "tools":return `<div class="tools">${TOOLS.map(t=>`<div class="panel tool">${ICON[t.i]}<div><h4>${L(t.n)}</h4><p>${L(t.u)}</p></div></div>`).join("")}</div>`;
   case "mats":return `<div class="panel"><div class="tw"><table><thead><tr><th>${u("item")}</th><th>${u("qty")}</th><th>${u("where")}</th></tr></thead><tbody>${MATS.map(r=>`<tr><td>${L(r[0])}</td><td class="num">${L(r[1])}</td><td>${L(r[2])}</td></tr>`).join("")}</tbody></table></div></div><div class="panel"><b>${u("legend")}</b>${legend()}</div>`;
   case "circuit":return circuitPanel(false)+`<div class="panel"><div class="vbar"><b>${u("truth")}</b></div>${truthTable()}</div><div class="panel">${legend()}</div>`;
   case "layout":return `<div class="panel"><div class="vbar"><b>${u("dims")}</b></div>${layoutSVG({dims:1,saddles:1})}</div><div class="panel"><div class="tw"><table><thead><tr><th>${u("pieces")}</th><th>${u("route")}</th><th>${u("wires")}</th><th>${u("count")}</th></tr></thead><tbody>${RUNS.map(p=>`<tr><td class="code">${p.p}</td><td>${nm(p.a)} → ${nm(p.b)}</td><td>${p.w.map(w=>`<span class="dot" style="background:var(${WC[w]})"></span><span class="code">${w}</span>`).join(" &nbsp;")}${p.note?`<br><small style="color:var(--muted)">${L(p.note)}</small>`:""}</td><td class="num">${p.w.length}</td></tr>`).join("")}</tbody></table></div></div>`;
   case "marking":return `<div class="panel" id="anim"><div class="vbar"><b>${u("marking")}</b>${replayBtn("marking")}</div><div class="slot">${layoutSVG(ANIM.marking)}</div></div>`;
   case "cut":return `<div class="panel">${cutSVG()}</div>`;
   case "assembly":return `<div class="panel" id="anim"><div class="vbar"><b>${u("assembly")}</b>${replayBtn("assembly")}</div><div class="slot">${layoutSVG(ANIM.assembly)}</div></div>`;
   case "fixing":return `<div class="panel" id="anim"><div class="vbar"><b>${u("saddle")}</b>${replayBtn("fixing")}</div><div class="slot">${layoutSVG(ANIM.fixing)}</div></div><div class="panel">${saddleSVG()}</div>`;
   case "wires":return `<div class="panel" id="anim"><div class="vbar"><b>${u("drawing")}</b>${replayBtn("wires")}</div><div class="slot">${layoutSVG(ANIM.wires)}</div><p class="cap">${u("xray")}</p></div><div class="panel">${legend()}</div>`;
   case "term":return termSVG()+`<div class="panel">${legend()}</div>`;
   case "test":return circuitPanel(true)+`<div class="panel">${obsTable()}</div>`;
   case "faults":return "";
  }
}
function render(){
  const st=STEPS[S.step],lang=S.lang;
  document.documentElement.lang=lang;
  $("#ttl").textContent=u("ttl");$("#sub").textContent=u("sub");
  $("#prev").textContent=u("prev");$("#next").textContent=u("next");$("#fsBtn").textContent="⛶ "+u("full");
  $("#skinLbl").textContent=u("theme");
  $("#skin").innerHTML=["auto","light","dark","hc"].map(k=>`<option value="${k}" ${k===skin?"selected":""}>${u(k)}</option>`).join("");
  ["en","hi","ml"].forEach(k=>$("#l-"+k).setAttribute("aria-pressed",k===lang));
  $("#nav").innerHTML=STEPS.map((s,i)=>`<button data-go="${i}" ${i===S.step?'aria-current="step"':""}><span class="n">${String(i+1).padStart(2,"0")}</span>${L(s.t)}</button>`).join("");
  $("#pos").textContent=`${u("step")} ${S.step+1} / ${STEPS.length}`;
  $("#prev").disabled=S.step===0;$("#next").disabled=S.step===STEPS.length-1;
  let txt=`<p class="eyebrow">${u("step")} ${String(S.step+1).padStart(2,"0")}</p><h2>${L(st.t)}</h2>`;
  if(st.li) txt+=ol(L(st.li));
  if(st.v==="test") txt+=`<h3>${u("before")}</h3>${ol(L(st.pre))}<h3>${u("live")}</h3>${ol(L(st.liv))}`;
  let html;
  if(st.v==="faults"){
    html=`<section class="step wide"><div class="txt">${txt}<div class="panel tw" style="margin-top:.6rem"><table><thead><tr><th>${u("fault")}</th><th>${u("cause")}</th><th>${u("fix")}</th></tr></thead><tbody>${FAULTS.map(r=>`<tr>${r.map((c,j)=>`<td>${j===0?`<b>${L(c)}</b>`:L(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
     <h3>${L(WORK.head)}</h3><p style="margin:.2rem 0 .6rem">${L(WORK.note)}</p>${workTable()}<div class="box ex"><div class="lbl">${u("ex")}</div><p>${L(WORK.ex)}</p></div>
     <h3>${u("final")}</h3><ul class="chk">${L(CHECK).map((c,i)=>`<li><label><input type="checkbox" id="chk${i}" data-chk="${i}" ${S.chk[i]?"checked":""}>${c}</label></li>`).join("")}</ul>${exBox(st)}</div></section>`;
  } else if(st.wide){
    html=`<section class="step wide"><div class="txt">${txt}</div><div class="vis">${visual(st)}</div><div class="txt">${sfBox(st)}${exBox(st)}</div></section>`;
  } else {
    html=`<section class="step"><div class="txt">${txt}${sfBox(st)}${exBox(st)}</div><div class="vis">${visual(st)}</div></section>`;
  }
  $("#stage").innerHTML=html;
  store.set("lang",lang);store.set("step",S.step);
  const cur=$("#nav [aria-current]");if(cur)cur.scrollIntoView({block:"nearest",inline:"center"});
}
function go(i){S.step=Math.max(0,Math.min(STEPS.length-1,i));S.tester=null;render();window.scrollTo({top:0})}
function applySkin(){if(skin==="auto")document.documentElement.removeAttribute("data-skin");else document.documentElement.setAttribute("data-skin",skin);store.set("skin",skin)}
function applyFs(){fs=Math.max(14,Math.min(34,fs));document.documentElement.style.setProperty("--fs",fs+"px");store.set("fs",fs)}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-l],[data-sw],[data-tp],[data-replay],[data-obs],[data-work],#prev,#next,#fsDown,#fsUp,#fsReset,#fsBtn");
  if(!t)return;
  if(t.dataset.go!==undefined)go(+t.dataset.go);
  else if(t.dataset.l){S.lang=t.dataset.l;render()}
  else if(t.dataset.sw==="s1"){S.s1=S.s1===1?2:1;render()}
  else if(t.dataset.sw==="s2"){S.s2^=1;render()}
  else if(t.dataset.tp){S.tester=t.dataset.tp;render()}
  else if(t.dataset.replay){const slot=$("#anim .slot");slot.innerHTML="";requestAnimationFrame(()=>slot.innerHTML=layoutSVG(ANIM[t.dataset.replay]))}
  else if(t.dataset.obs!==undefined){const i=t.dataset.obs;S.obs[i]=((S.obs[i]||0)+1)%5;render()}
  else if(t.dataset.work!==undefined){const i=t.dataset.work;S.work[i]=((S.work[i]||0)+1)%3;render()}
  else if(t.id==="prev")go(S.step-1);
  else if(t.id==="next")go(S.step+1);
  else if(t.id==="fsDown"){fs-=2;applyFs()}
  else if(t.id==="fsUp"){fs+=2;applyFs()}
  else if(t.id==="fsReset"){fs=20;applyFs()}
  else if(t.id==="fsBtn"){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(err){}}
});
document.addEventListener("change",e=>{
  if(e.target.id==="skin"){skin=e.target.value;applySkin()}
  if(e.target.dataset.chk!==undefined)S.chk[e.target.dataset.chk]=e.target.checked;
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("select,input"))return;
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-sw],[data-tp],[data-obs],[data-work]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}));return}
  if(e.key==="ArrowRight"||e.key==="PageDown")go(S.step+1);
  if(e.key==="ArrowLeft"||e.key==="PageUp")go(S.step-1);
});
applySkin();applyFs();render();
</script>
