<style>
/* Layout: workshop "station board" — header controls, step strip, two-column stage (instructions | live drawing), pager. */
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --ink:#16201B; --muted:#4F5C55; --line:#CCD4CD;
  --accent:#8A4B1F; --accent-ink:#FFFFFF; --chip:#E2E7E1;
  --ex-bg:#FFF4D6; --ex-line:#C99A1A; --safe-bg:#FDE7E4; --safe-line:#C0392B;
  --board:#B26B36; --grain:#8F5326; --pipe:#1E1F1F; --pipe-hi:#5E6162; --fit:#F4F2EC; --fit-edge:#8F8A7F;
  --chalk:#1E6FD9; --dim:#16201B;
  --wL:#D62828; --wN:#1A1A1A; --wL1:#E2AE00; --wL2:#1F5FD1; --wLW:#F07C1A; --halo:rgba(0,0,0,.18);
  --glow:#FFD84D; --ok:#1E8E3E;
  --f-disp:"Saira Semi Condensed","Noto Sans Devanagari","Noto Sans Malayalam",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Noto Sans Devanagari","Noto Sans Malayalam",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --fs:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101512; --surface:#18201B; --ink:#E9EFEA; --muted:#A3B0A8; --line:#2E3A33;
  --accent:#E8A06A; --accent-ink:#1A0F07; --chip:#222C26;
  --ex-bg:#2B2410; --ex-line:#D9AA2B; --safe-bg:#2E1513; --safe-line:#F06A5A;
  --chalk:#6FB1FF; --dim:#E9EFEA; --wL2:#4C8DF6; --halo:rgba(255,255,255,.55); --glow:#FFE066; --ok:#4CC873;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#18201B; --ink:#E9EFEA; --muted:#A3B0A8; --line:#2E3A33;
  --accent:#E8A06A; --accent-ink:#1A0F07; --chip:#222C26;
  --ex-bg:#2B2410; --ex-line:#D9AA2B; --safe-bg:#2E1513; --safe-line:#F06A5A;
  --chalk:#6FB1FF; --dim:#E9EFEA; --wL2:#4C8DF6; --halo:rgba(255,255,255,.55); --glow:#FFE066; --ok:#4CC873;
  color-scheme:dark}
/* explicit skins chosen in the page win over host/system */
:root[data-skin="light"]{
  --bg:#EEF1EC; --surface:#FFFFFF; --ink:#16201B; --muted:#4F5C55; --line:#CCD4CD;
  --accent:#8A4B1F; --accent-ink:#FFFFFF; --chip:#E2E7E1;
  --ex-bg:#FFF4D6; --ex-line:#C99A1A; --safe-bg:#FDE7E4; --safe-line:#C0392B;
  --chalk:#1E6FD9; --dim:#16201B; --wL2:#1F5FD1; --halo:rgba(0,0,0,.18); --glow:#FFD84D; --ok:#1E8E3E;
  color-scheme:light}
:root[data-skin="dark"]{
  --bg:#101512; --surface:#18201B; --ink:#E9EFEA; --muted:#A3B0A8; --line:#2E3A33;
  --accent:#E8A06A; --accent-ink:#1A0F07; --chip:#222C26;
  --ex-bg:#2B2410; --ex-line:#D9AA2B; --safe-bg:#2E1513; --safe-line:#F06A5A;
  --chalk:#6FB1FF; --dim:#E9EFEA; --wL2:#4C8DF6; --halo:rgba(255,255,255,.55); --glow:#FFE066; --ok:#4CC873;
  color-scheme:dark}
:root[data-skin="hc"]{
  --bg:#000000; --surface:#000000; --ink:#FFFFFF; --muted:#FFFFFF; --line:#FFFFFF;
  --accent:#FFE600; --accent-ink:#000000; --chip:#000000;
  --ex-bg:#000000; --ex-line:#FFE600; --safe-bg:#000000; --safe-line:#FF5A4D;
  --board:#7A4420; --grain:#5C3115; --fit:#FFFFFF; --fit-edge:#000000; --pipe:#111111; --pipe-hi:#9A9A9A;
  --chalk:#00E5FF; --dim:#FFFFFF; --wL:#FF3B3B; --wL1:#FFE600; --wL2:#3D9BFF; --wLW:#FF9A1F; --halo:rgba(255,255,255,.9);
  --glow:#FFFF00; --ok:#00FF66;
  color-scheme:dark}

html{font-size:var(--fs)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 24px}
*{box-sizing:border-box}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between;padding-block:.6rem;border-bottom:2px solid var(--line)}
.brand{min-width:0}
.brand h1{font-family:var(--f-disp);font-weight:800;font-size:1.5rem;line-height:1.1;margin:0;text-wrap:balance}
.brand p{margin:.1rem 0 0;color:var(--muted);font-size:.8rem}
.ctrls{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.seg{display:flex;border:2px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:.3rem .65rem;cursor:pointer;font-size:.8rem;font-weight:700}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ctrls select{background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:.28rem .5rem;font-size:.8rem;font-weight:700}
.ctrls label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

.steps{display:flex;gap:.4rem;overflow-x:auto;padding-block:.6rem;scrollbar-width:thin}
.steps button{flex:0 0 auto;display:flex;gap:.4rem;align-items:baseline;background:var(--chip);border:2px solid var(--line);border-radius:999px;padding:.25rem .75rem;cursor:pointer;font-size:.75rem;font-weight:700;white-space:nowrap}
.steps button .n{font-family:var(--f-mono);color:var(--muted)}
.steps button[aria-current="step"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.steps button[aria-current="step"] .n{color:inherit}

.step{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:1.5rem;align-items:start;padding-block:.6rem 1rem}
.step.wide{grid-template-columns:minmax(0,1fr)}
@media (max-width:980px){.step{grid-template-columns:minmax(0,1fr)}}
.txt{min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 .2rem;font-weight:700}
h2{font-family:var(--f-disp);font-weight:800;font-size:2rem;line-height:1.1;margin:0 0 .8rem;text-wrap:balance}
h3{font-family:var(--f-disp);font-weight:700;font-size:1.2rem;margin:1rem 0 .4rem}
ol.do{margin:0;padding:0;list-style:none;counter-reset:d;display:grid;gap:.55rem}
ol.do li{counter-increment:d;display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.6rem;align-items:start}
ol.do li::before{content:counter(d);font-family:var(--f-mono);font-weight:700;font-size:.85rem;width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);margin-top:.1rem}
.box{border-left:6px solid;padding:.7rem 1rem;border-radius:0 10px 10px 0;margin-top:1rem}
.box .lbl{display:flex;gap:.45rem;align-items:center;font-family:var(--f-mono);font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.25rem}
.box p{margin:0}
.ex{background:var(--ex-bg);border-color:var(--ex-line)}
.ex .lbl{color:var(--ex-line)}
.safe{background:var(--safe-bg);border-color:var(--safe-line)}
.safe .lbl{color:var(--safe-line)}
:root[data-skin="hc"] .box{border:3px solid;border-left-width:8px}

.vis{min-width:0;display:grid;gap:.8rem}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.8rem;min-width:0}
.panel svg{display:block;width:100%;height:auto}
.panel .cap{font-size:.75rem;color:var(--muted);margin:.4rem 0 0}
.vbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between;margin-bottom:.4rem}
.vbar b{font-family:var(--f-disp);font-size:1rem}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:.35rem .9rem;font-weight:700;font-size:.8rem;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}

.photo{position:relative;border-radius:10px;overflow:hidden}
.photo img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.7rem;padding:.12rem .5rem;border-radius:999px;border:2px solid #fff;white-space:nowrap;animation:pop .5s both}
.pin.sw{background:#16201B;color:#fff}

table{border-collapse:collapse;width:100%;font-size:.85rem}
.tw{overflow-x:auto}
th,td{border:2px solid var(--line);padding:.35rem .55rem;text-align:left;vertical-align:top}
th{font-family:var(--f-disp);background:var(--chip);font-weight:700}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:center;font-weight:700}
.dot{display:inline-block;width:.9em;height:.9em;border-radius:50%;vertical-align:-.1em;margin-right:.2em;box-shadow:0 0 0 2px var(--halo)}
.code{font-family:var(--f-mono);font-weight:700}

.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:.8rem}
.tool{display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:.7rem;align-items:start}
.tool svg{width:5.5rem;height:5.5rem}
.tool h4{margin:0 0 .15rem;font-family:var(--f-disp);font-size:1.05rem}
.tool p{margin:0;font-size:.85rem}

.legend{display:flex;flex-wrap:wrap;gap:.35rem .9rem;font-size:.8rem}
.tt td,.tt th{text-align:center}
.tt tr.on td{background:var(--ex-bg)}
.obs{cursor:pointer;min-width:4rem;font-weight:700}
.chk{list-style:none;padding:0;margin:0;display:grid;gap:.35rem}
.chk label{display:flex;gap:.55rem;align-items:flex-start;cursor:pointer}
.chk input{width:1.2rem;height:1.2rem;margin-top:.2rem;accent-color:var(--accent)}
.msg{font-weight:700;min-height:1.5em;font-size:.9rem}

.pager{display:flex;gap:.8rem;align-items:center;justify-content:space-between;border-top:2px solid var(--line);padding-block:.7rem}
.pager .pos{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums}
.pager .btn{font-size:.95rem;padding:.5rem 1.2rem}
.pager .btn:disabled{opacity:.35;cursor:default}

/* SVG text + anims */
svg text{font-family:var(--f-body)}
.lbl-svg{fill:var(--ink);font-weight:700}
.seq{animation:drop .55s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:var(--d,0s);transform-box:fill-box;transform-origin:center}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw var(--t,1.4s) ease-in-out both;animation-delay:var(--d,0s)}
.fade{animation:fade .5s both;animation-delay:var(--d,0s)}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.flow{stroke-dasharray:10 8;animation:flow .7s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
.saw-x{animation:sawx .45s ease-in-out infinite alternate}
.saw-y{animation:sawy 7s linear infinite}
.kerf{animation:kerf 7s linear infinite;transform-box:fill-box;transform-origin:top}
@keyframes sawx{from{transform:translateX(-55px)}to{transform:translateX(55px)}}
@keyframes sawy{0%{transform:translateY(-70px)}85%{transform:translateY(58px)}100%{transform:translateY(58px)}}
@keyframes kerf{0%{transform:scaleY(0)}85%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.sink{animation:sink 3.6s ease-in-out infinite;transform-box:fill-box}
@keyframes sink{0%{transform:translateY(-10px)}70%,100%{transform:translateY(0)}}
.lampglow{transition:opacity .25s}
.sw-hit{cursor:pointer}
.tp{cursor:pointer}
.tp:hover circle.ring{stroke-width:4}
@media (prefers-reduced-motion:reduce){
  .seq,.draw,.fade,.pin{animation:none!important;stroke-dashoffset:0}
  .flow,.saw-x,.saw-y,.kerf,.spin,.sink{animation:none!important}
}
</style>

<header class="bar">
  <div class="brand"><h1 id="ttl"></h1><p id="sub"></p></div>
  <div class="ctrls">
    <div class="seg" id="langSeg" role="group" aria-label="Language">

  </div>
</header>
<nav class="steps" id="nav" aria-label="Steps"></nav>
<main id="stage"></main>
<footer class="pager">
  <button class="btn" id="prev"></button>
  <span class="pos" id="pos"></span>
  <button class="btn" id="next"></button>
</footer>

 ex:{en:"Before climbing a ladder you shake it to see that it is firm. Shake every fixture the same way before you hand over the job.",hi:"सीढ़ी पर चढ़ने से पहले उसे हिलाकर देखते हैं कि वह मज़बूत है। काम सौंपने से पहले हर फिक्सिंग को ऐसे ही हिलाकर जाँचें।",ml:"ഏണിയിൽ കയറുന്നതിന് മുൻപ് അത് ഉറച്ചതാണോ എന്ന് കുലുക്കി നോക്കുന്നു. ജോലി ഏൽപ്പിക്കുന്നതിന് മുൻപ് ഓരോ ഫിക്സിംഗും അതുപോലെ കുലുക്കി പരിശോധിക്കുക."},
 rows:[
  [{en:"Saddles",hi:"सैडल",ml:"സാഡിലുകൾ"},{en:"Push the pipe sideways by hand near each saddle. No movement; both screws fully home; saddle not tilted.",hi:"हर सैडल के पास पाइप को हाथ से बगल में धकेलें। कोई हलचल नहीं; दोनों स्क्रू पूरे अंदर; सैडल तिरछा नहीं।",ml:"ഓരോ സാഡിലിനരികിലും പൈപ്പ് കൈകൊണ്ട് വശത്തേക്ക് തള്ളുക. അനക്കം ഇല്ല; രണ്ട് സ്ക്രൂകളും പൂർണ്ണമായി ഇറങ്ങി; സാഡിൽ ചരിഞ്ഞിട്ടില്ല."}],
  [{en:"Pipe joints (tee, junction box, bend)",hi:"पाइप जोड़ (टी, जंक्शन बॉक्स, बेंड)",ml:"പൈപ്പ് ജോയിന്റുകൾ (ടീ, ജംഗ്ഷൻ ബോക്സ്, ബെൻഡ്)"},{en:"Pull each pipe gently at its socket. It must not come out; no gap visible.",hi:"हर पाइप को उसके सॉकेट पर हल्का खींचें। बाहर नहीं आना चाहिए; कोई गैप न दिखे।",ml:"ഓരോ പൈപ്പും സോക്കറ്റിൽ ചെറുതായി വലിക്കുക. പുറത്തുവരരുത്; വിടവ് കാണരുത്."}],
  [{en:"Switch boxes S1, S2",hi:"स्विच बॉक्स S1, S2",ml:"സ്വിച്ച് ബോക്സുകൾ S1, S2"},{en:"Hold the box and try to rock and twist it. No movement; all fixing screws fitted.",hi:"बॉक्स पकड़कर हिलाने और घुमाने की कोशिश करें। कोई हलचल नहीं; सभी फिक्सिंग स्क्रू लगे।",ml:"ബോക്സ് പിടിച്ച് ആട്ടാനും തിരിക്കാനും ശ്രമിക്കുക. അനക്കം ഇല്ല; എല്ലാ ഫിക്സിംഗ് സ്ക്രൂകളും ഉണ്ട്."}],
  [{en:"Lamp round block and holder",hi:"लैंप राउंड ब्लॉक और होल्डर",ml:"ലാമ്പ് റൗണ്ട് ബ്ലോക്കും ഹോൾഡറും"},{en:"Rock the holder by hand. Block and holder firm; holder screwed to the block.",hi:"होल्डर को हाथ से हिलाएँ। ब्लॉक और होल्डर मज़बूत; होल्डर ब्लॉक पर स्क्रू से कसा।",ml:"ഹോൾഡർ കൈകൊണ്ട് ആട്ടുക. ബ്ലോക്കും ഹോൾഡറും ഉറപ്പിൽ; ഹോൾഡർ ബ്ലോക്കിൽ സ്ക്രൂ ചെയ്തിരിക്കുന്നു."}],
  [{en:"Switch plates and box covers",hi:"स्विच प्लेट और बॉक्स कवर",ml:"സ്വിച്ച് പ്ലേറ്റുകളും ബോക്സ് കവറുകളും"},{en:"Cover screws tight, plate sits flush, switch operates smoothly, no crack.",hi:"कवर स्क्रू कसे, प्लेट समतल बैठी, स्विच आसानी से चलता है, कोई दरार नहीं।",ml:"കവർ സ്ക്രൂകൾ മുറുകി, പ്ലേറ്റ് നിരപ്പായി ഇരിക്കുന്നു, സ്വിച്ച് സുഗമമായി പ്രവർത്തിക്കുന്നു, പൊട്ടലില്ല."}],
  [{en:"Screw heads",hi:"स्क्रू हेड",ml:"സ്ക്രൂ തലകൾ"},{en:"Every screw straight and flush, slot not damaged. No hammered or loose screw.",hi:"हर स्क्रू सीधा और समतल, खाँचा खराब नहीं। कोई हथौड़े से ठोका या ढीला स्क्रू नहीं।",ml:"ഓരോ സ്ക്രൂവും നേരെയും നിരപ്പായും, വിടവ് കേടായിട്ടില്ല. ചുറ്റിക കൊണ്ട് അടിച്ചതോ അയഞ്ഞതോ ആയ സ്ക്രൂ ഇല്ല."}],
  [{en:"Line and level",hi:"लाइन और लेवल",ml:"ലൈനും ലെവലും"},{en:"Sight along each pipe: horizontal runs level, vertical runs plumb; bend smooth, not flattened.",hi:"हर पाइप के साथ देखें: क्षैतिज रन समतल, ऊर्ध्वाधर रन साहुल में; बेंड चिकना, चपटा नहीं।",ml:"ഓരോ പൈപ്പിലൂടെയും നോക്കുക: തിരശ്ചീന റൺ നിരപ്പിൽ, ലംബ റൺ കുത്തനെ; ബെൻഡ് സുഗമം, പരന്നിട്ടില്ല."}],
  [{en:"PVC parts",hi:"पीवीसी भाग",ml:"PVC ഭാഗങ്ങൾ"},{en:"No crack or white stress mark on saddles, boxes, tee or bend from over-tightening.",hi:"ज़्यादा कसने से सैडल, बॉक्स, टी या बेंड पर कोई दरार या सफ़ेद तनाव निशान नहीं।",ml:"അമിതമായി മുറുക്കിയതുമൂലം സാഡിൽ, ബോക്സ്, ടീ, ബെൻഡ് എന്നിവയിൽ പൊട്ടലോ വെളുത്ത സ്ട്രെസ് അടയാളമോ ഇല്ല."}]

 {v:"mats",t:{en:"Materials",hi:"सामग्री",ml:"സാമഗ്രികൾ"},
  li:{en:["Collect every item in the table before you start.","Check the two switches: both must be two-way (3 terminals: C, L1, L2).","Check the pipe sockets: tee, box and bend must suit 19 mm pipe."],
      hi:["शुरू करने से पहले तालिका की हर सामग्री इकट्ठा करें।","दोनों स्विच जाँचें: दोनों टू-वे होने चाहिए (3 टर्मिनल: C, L1, L2)।","पाइप सॉकेट जाँचें: टी, बॉक्स और बेंड 19 mm पाइप के अनुकूल हों।"],
      ml:["തുടങ്ങുന്നതിന് മുൻപ് പട്ടികയിലെ എല്ലാ സാധനങ്ങളും ശേഖരിക്കുക.","രണ്ട് സ്വിച്ചുകളും പരിശോധിക്കുക: രണ്ടും ടു-വേ ആയിരിക്കണം (3 ടെർമിനലുകൾ: C, L1, L2).","പൈപ്പ് സോക്കറ്റുകൾ പരിശോധിക്കുക: ടീ, ബോക്സ്, ബെൻഡ് എന്നിവ 19 mm പൈപ്പിന് യോജിച്ചതായിരിക്കണം."]},
  ex:{en:"A cook keeps all ingredients ready before lighting the stove. Ready materials mean no running around in the middle of the job.",hi:"रसोइया चूल्हा जलाने से पहले सारी सामग्री तैयार रखता है। सामग्री तैयार हो तो काम के बीच में भागदौड़ नहीं होती।",ml:"പാചകക്കാരൻ അടുപ്പ് കത്തിക്കുന്നതിന് മുൻപ് എല്ലാ ചേരുവകളും തയ്യാറാക്കി വയ്ക്കുന്നു. സാധനങ്ങൾ തയ്യാറാണെങ്കിൽ ജോലിക്കിടയിൽ ഓടേണ്ടി വരില്ല."}},
 {v:"circuit",t:{en:"Circuit diagram: how two-way works",hi:"परिपथ आरेख: टू-वे कैसे काम करता है",ml:"സർക്യൂട്ട് ഡയഗ്രം: ടു-വേ എങ്ങനെ പ്രവർത്തിക്കുന്നു"},
  li:{en:["Each two-way switch has 3 terminals: C (common), L1 and L2. The blade joins C to either L1 or L2.","Phase L goes only to C of S1.","L1 of S1 joins L1 of S2; L2 joins L2. These two are the strapping wires.","C of S2 goes to the lamp (lamp wire LW). Neutral N goes straight to the lamp.","The lamp glows when both switches are on the same track: L1–L1 or L2–L2."],
      hi:["हर टू-वे स्विच में 3 टर्मिनल होते हैं: C (कॉमन), L1 और L2। ब्लेड C को L1 या L2 से जोड़ता है।","फेज़ L केवल S1 के C पर जाता है।","S1 का L1, S2 के L1 से; L2, L2 से जुड़ता है। ये दो स्ट्रैपिंग तार हैं।","S2 का C लैंप पर जाता है (लैंप तार LW)। न्यूट्रल N सीधे लैंप पर जाता है।","जब दोनों स्विच एक ही ट्रैक पर हों, L1–L1 या L2–L2, तब लैंप जलता है।"],
      ml:["ഓരോ ടു-വേ സ്വിച്ചിനും 3 ടെർമിനലുകൾ: C (കോമൺ), L1, L2. ബ്ലേഡ് C-യെ L1 അല്ലെങ്കിൽ L2-മായി ബന്ധിപ്പിക്കുന്നു.","ഫേസ് L, S1-ന്റെ C-യിലേക്ക് മാത്രം പോകുന്നു.","S1-ന്റെ L1, S2-ന്റെ L1-ലേക്ക്; L2, L2-ലേക്ക്. ഇവ രണ്ടുമാണ് സ്ട്രാപ്പിംഗ് വയറുകൾ.","S2-ന്റെ C ലാമ്പിലേക്ക് പോകുന്നു (ലാമ്പ് വയർ LW). ന്യൂട്രൽ N നേരിട്ട് ലാമ്പിലേക്ക്.","രണ്ട് സ്വിച്ചുകളും ഒരേ ട്രാക്കിൽ, L1–L1 അല്ലെങ്കിൽ L2–L2, ആയിരിക്കുമ്പോൾ ലാമ്പ് കത്തുന്നു."]},
  ex:{en:"Railway points: the train (current) reaches the station (lamp) only when both point levers set the same track. Change one lever and the track breaks; change the other lever and the track is complete again.",hi:"रेलवे पॉइंट: ट्रेन (करंट) स्टेशन (लैंप) तक तभी पहुँचती है जब दोनों पॉइंट लीवर एक ही ट्रैक सेट करें। एक लीवर बदलें तो ट्रैक टूटता है; दूसरा लीवर बदलें तो ट्रैक फिर पूरा हो जाता है।",ml:"റെയിൽവേ പോയിന്റ്: രണ്ട് പോയിന്റ് ലിവറുകളും ഒരേ ട്രാക്ക് സെറ്റ് ചെയ്യുമ്പോൾ മാത്രമേ ട്രെയിൻ (കറന്റ്) സ്റ്റേഷനിൽ (ലാമ്പ്) എത്തൂ. ഒരു ലിവർ മാറ്റിയാൽ ട്രാക്ക് മുറിയും; മറ്റേ ലിവർ മാറ്റിയാൽ ട്രാക്ക് വീണ്ടും പൂർണ്ണമാകും."}},
 {v:"layout",t:{en:"Layout and pipe plan",hi:"लेआउट और पाइप योजना",ml:"ലേഔട്ടും പൈപ്പ് പ്ലാനും"},
  li:{en:["Every pipe piece is 15 cm. Six pieces: P1 to P6.","Main run from supply: P1 → tee → P2 → junction box → P3 → bend → P4 → S2.","Branches: tee down P5 → S1. Junction box up P6 → lamp.","The table gives the wires inside each pipe."],
      hi:["हर पाइप टुकड़ा 15 cm है। छह टुकड़े: P1 से P6।","सप्लाई से मुख्य रन: P1 → टी → P2 → जंक्शन बॉक्स → P3 → बेंड → P4 → S2।","शाखाएँ: टी से नीचे P5 → S1। जंक्शन बॉक्स से ऊपर P6 → लैंप।","तालिका में हर पाइप के अंदर के तार दिए हैं।"],
      ml:["ഓരോ പൈപ്പ് കഷണവും 15 cm. ആറ് കഷണങ്ങൾ: P1 മുതൽ P6 വരെ.","സപ്ലൈയിൽ നിന്നുള്ള പ്രധാന റൺ: P1 → ടീ → P2 → ജംഗ്ഷൻ ബോക്സ് → P3 → ബെൻഡ് → P4 → S2.","ശാഖകൾ: ടീയിൽ നിന്ന് താഴേക്ക് P5 → S1. ജംഗ്ഷൻ ബോക്സിൽ നിന്ന് മുകളിലേക്ക് P6 → ലാമ്പ്.","ഓരോ പൈപ്പിനുള്ളിലെയും വയറുകൾ പട്ടികയിൽ നൽകിയിരിക്കുന്നു."]},
  ex:{en:"The junction box is like a bus stand: routes meet and turn here, and you can open it to pull or check wires.",hi:"जंक्शन बॉक्स बस स्टैंड जैसा है: मार्ग यहाँ मिलते और मुड़ते हैं, और तार खींचने या जाँचने के लिए इसे खोला जा सकता है।",ml:"ജംഗ്ഷൻ ബോക്സ് ഒരു ബസ് സ്റ്റാൻഡ് പോലെയാണ്: റൂട്ടുകൾ ഇവിടെ ചേരുകയും തിരിയുകയും ചെയ്യുന്നു, വയർ വലിക്കാനോ പരിശോധിക്കാനോ ഇത് തുറക്കാം."}},
 {v:"marking",t:{en:"Marking the board",hi:"बोर्ड पर मार्किंग",ml:"ബോർഡിൽ മാർക്കിംഗ്"},
  li:{en:["Snap a chalked marking thread to draw the main horizontal line.","Mark the centres of tee, junction box, bend, S1, S2 and lamp block from the layout.","Draw the vertical lines for P5 (down to S1), P4 (down to S2) and P6 (up to lamp) with a steel rule or try square.","Place all fittings dry, without screws, and check the fit.","Make pilot holes with the poker at every screw point. On hard teak, tap the poker lightly with the hammer."],
      hi:["चॉक लगे मार्किंग धागे को झटक कर मुख्य क्षैतिज रेखा खींचें।","लेआउट से टी, जंक्शन बॉक्स, बेंड, S1, S2 और लैंप ब्लॉक के केंद्र मार्क करें।","स्टील रूल या ट्राई स्क्वायर से P5 (S1 तक नीचे), P4 (S2 तक नीचे) और P6 (लैंप तक ऊपर) की ऊर्ध्वाधर रेखाएँ खींचें।","सभी फिटिंग बिना स्क्रू के रखकर फिट जाँचें।","हर स्क्रू पॉइंट पर पोकर से पायलट छेद बनाएँ। कठोर सागौन पर पोकर को हथौड़े से हल्का ठोकें।"],
      ml:["ചോക്ക് പുരട്ടിയ മാർക്കിംഗ് നൂൽ തട്ടി പ്രധാന തിരശ്ചീന രേഖ വരയ്ക്കുക.","ലേഔട്ട് നോക്കി ടീ, ജംഗ്ഷൻ ബോക്സ്, ബെൻഡ്, S1, S2, ലാമ്പ് ബ്ലോക്ക് എന്നിവയുടെ മധ്യം മാർക്ക് ചെയ്യുക.","സ്റ്റീൽ റൂൾ അല്ലെങ്കിൽ ട്രൈ സ്ക്വയർ ഉപയോഗിച്ച് P5 (S1 വരെ താഴേക്ക്), P4 (S2 വരെ താഴേക്ക്), P6 (ലാമ്പ് വരെ മുകളിലേക്ക്) എന്നിവയുടെ ലംബ രേഖകൾ വരയ്ക്കുക.","എല്ലാ ഫിറ്റിംഗുകളും സ്ക്രൂ ഇല്ലാതെ വച്ച് ഫിറ്റ് പരിശോധിക്കുക.","ഓരോ സ്ക്രൂ പോയിന്റിലും പോക്കർ ഉപയോഗിച്ച് പൈലറ്റ് ദ്വാരം ഉണ്ടാക്കുക. കട്ടിയുള്ള തേക്കിൽ പോക്കറിൽ ചുറ്റിക കൊണ്ട് ചെറുതായി തട്ടുക."]},
  ex:{en:"A tailor marks the cloth with chalk before cutting. Measure twice, cut once.",hi:"दर्ज़ी काटने से पहले कपड़े पर चॉक से निशान लगाता है। दो बार नापें, एक बार काटें।",ml:"തയ്യൽക്കാരൻ മുറിക്കുന്നതിന് മുൻപ് തുണിയിൽ ചോക്ക് കൊണ്ട് അടയാളമിടുന്നു. രണ്ടു തവണ അളക്കുക, ഒരു തവണ മുറിക്കുക."}},
 {v:"cut",t:{en:"Cutting the pipe pieces",hi:"पाइप के टुकड़े काटना",ml:"പൈപ്പ് കഷണങ്ങൾ മുറിക്കൽ"},
  li:{en:["Measure 15 cm and mark a line all round the pipe.","Hold the pipe firmly. Start with a few short strokes on the mark.","Cut straight and square, using the full blade length. Cut on the forward stroke; lift slightly on the return.","Remove burrs inside and outside with a knife or file.","Make 6 pieces and check each one: 15 cm."],
      hi:["15 cm नापें और पाइप के चारों ओर रेखा बनाएँ।","पाइप को मज़बूती से पकड़ें। निशान पर कुछ छोटे स्ट्रोक से शुरू करें।","पूरी ब्लेड लंबाई से सीधा और समकोण काटें। आगे के स्ट्रोक पर काटें; वापसी में हल्का उठाएँ।","चाकू या रेती से अंदर और बाहर के बर हटाएँ।","6 टुकड़े बनाएँ और हर एक जाँचें: 15 cm।"],
      ml:["15 cm അളന്ന് പൈപ്പിന് ചുറ്റും വര വരയ്ക്കുക.","പൈപ്പ് ഉറപ്പായി പിടിക്കുക. അടയാളത്തിൽ കുറച്ച് ചെറിയ സ്ട്രോക്കുകൾ കൊണ്ട് തുടങ്ങുക.","മുഴുവൻ ബ്ലേഡ് നീളം ഉപയോഗിച്ച് നേരെയും ലംബമായും മുറിക്കുക. മുന്നോട്ടുള്ള സ്ട്രോക്കിൽ മുറിക്കുക; തിരികെ വരുമ്പോൾ ചെറുതായി ഉയർത്തുക.","കത്തി അല്ലെങ്കിൽ ഫയൽ ഉപയോഗിച്ച് അകത്തും പുറത്തുമുള്ള ബർ നീക്കം ചെയ്യുക.","6 കഷണങ്ങൾ ഉണ്ടാക്കി ഓരോന്നും പരിശോധിക്കുക: 15 cm."]},
  sf:{en:"Keep fingers away from the cutting line. Blade teeth face forward.",hi:"उंगलियाँ कटिंग लाइन से दूर रखें। ब्लेड के दाँत आगे की ओर।",ml:"വിരലുകൾ മുറിക്കുന്ന വരയിൽ നിന്ന് അകറ്റി വയ്ക്കുക. ബ്ലേഡിന്റെ പല്ലുകൾ മുന്നോട്ട്."},
  ex:{en:"A burr inside the pipe is like a sharp edge inside a shirt sleeve: every time the wire is pulled, its insulation gets scratched.",hi:"पाइप के अंदर का बर कमीज़ की आस्तीन के अंदर तेज़ किनारे जैसा है: हर बार तार खींचने पर उसका इंसुलेशन छिलता है।",ml:"പൈപ്പിനുള്ളിലെ ബർ ഷർട്ടിന്റെ കൈക്കുള്ളിലെ മൂർച്ചയുള്ള അറ്റം പോലെയാണ്: വയർ വലിക്കുമ്പോഴെല്ലാം അതിന്റെ ഇൻസുലേഷൻ ഉരയും."}},
 {v:"assembly",t:{en:"Assembling the pipe run",hi:"पाइप रन की असेंबली",ml:"പൈപ്പ് റൺ അസംബ്ലി"},
  li:{en:["Push P1 and P2 into the two straight sides of the tee. Push P5 into the tee branch, pointing down.","Fit P2 into the junction box. Fit P3 on the opposite side and P6 on the top outlet.","Fit the bend on P3, then P4 into the bend, pointing down.","P5 enters the S1 box, P4 enters the S2 box, P6 enters the lamp round block.","Push every pipe fully into its socket. No gap should be seen."],
      hi:["P1 और P2 को टी की दोनों सीधी तरफ़ डालें। P5 को टी की शाखा में नीचे की ओर डालें।","P2 को जंक्शन बॉक्स में लगाएँ। P3 को सामने की तरफ़ और P6 को ऊपर के आउटलेट में लगाएँ।","P3 पर बेंड लगाएँ, फिर P4 को बेंड में नीचे की ओर लगाएँ।","P5, S1 बॉक्स में; P4, S2 बॉक्स में; P6, लैंप राउंड ब्लॉक में जाता है।","हर पाइप को सॉकेट में पूरा अंदर धकेलें। कोई गैप न दिखे।"],
      ml:["P1, P2 എന്നിവ ടീയുടെ രണ്ട് നേർവശങ്ങളിലും കയറ്റുക. P5 ടീയുടെ ശാഖയിൽ താഴേക്ക് കയറ്റുക.","P2 ജംഗ്ഷൻ ബോക്സിൽ കയറ്റുക. P3 എതിർവശത്തും P6 മുകളിലെ ഔട്ട്‌ലെറ്റിലും കയറ്റുക.","P3-ൽ ബെൻഡ് ഘടിപ്പിക്കുക, തുടർന്ന് P4 ബെൻഡിൽ താഴേക്ക് കയറ്റുക.","P5 S1 ബോക്സിലേക്കും P4 S2 ബോക്സിലേക്കും P6 ലാമ്പ് റൗണ്ട് ബ്ലോക്കിലേക്കും കയറുന്നു.","ഓരോ പൈപ്പും സോക്കറ്റിൽ പൂർണ്ണമായി കയറ്റുക. ഒരു വിടവും കാണരുത്."]},
  ex:{en:"Like water pipes at home: tee, bend and box are the joints. A pipe not pushed fully in leaks water; here it leaves the wire exposed.",hi:"घर के पानी के पाइप की तरह: टी, बेंड और बॉक्स जोड़ हैं। पूरा न धकेला गया पाइप पानी टपकाता है; यहाँ तार खुला रह जाता है।",ml:"വീട്ടിലെ വെള്ള പൈപ്പുകൾ പോലെ: ടീ, ബെൻഡ്, ബോക്സ് എന്നിവ ജോയിന്റുകളാണ്. മുഴുവൻ കയറ്റാത്ത പൈപ്പ് വെള്ളം ചോർത്തും; ഇവിടെ വയർ പുറത്ത് കാണപ്പെടും."}},
 {v:"fixing",t:{en:"Fixing saddles and boxes",hi:"सैडल और बॉक्स फिक्स करना",ml:"സാഡിലുകളും ബോക്സുകളും ഉറപ്പിക്കൽ"},
  li:{en:["Place one saddle on each pipe piece, near its middle. Six saddles in all.","Pilot hole with the poker, then drive both screws with the screwdriver, a little at a time on each side.","Fix the S1 and S2 boxes and the lamp round block with screws.","Check: pipe straight, level and firm. It must not move when pushed."],
      hi:["हर पाइप टुकड़े पर बीच के पास एक सैडल रखें। कुल छह सैडल।","पोकर से पायलट छेद, फिर पेचकस से दोनों स्क्रू, हर तरफ़ थोड़ा-थोड़ा कसें।","S1, S2 बॉक्स और लैंप राउंड ब्लॉक को स्क्रू से फिक्स करें।","जाँचें: पाइप सीधा, समतल और मज़बूत। धकेलने पर हिलना नहीं चाहिए।"],
      ml:["ഓരോ പൈപ്പ് കഷണത്തിലും നടുവിനടുത്ത് ഒരു സാഡിൽ വയ്ക്കുക. ആകെ ആറ് സാഡിലുകൾ.","പോക്കർ കൊണ്ട് പൈലറ്റ് ദ്വാരം, തുടർന്ന് സ്ക്രൂഡ്രൈവർ കൊണ്ട് രണ്ട് സ്ക്രൂകളും ഓരോ വശത്തും അൽപ്പാൽപ്പമായി മുറുക്കുക.","S1, S2 ബോക്സുകളും ലാമ്പ് റൗണ്ട് ബ്ലോക്കും സ്ക്രൂ ഉപയോഗിച്ച് ഉറപ്പിക്കുക.","പരിശോധിക്കുക: പൈപ്പ് നേരെ, നിരപ്പിൽ, ഉറപ്പിൽ. തള്ളിയാൽ അനങ്ങരുത്."]},
  sf:{en:"Do not over-tighten. PVC saddles and boxes can crack.",hi:"ज़्यादा न कसें। पीवीसी सैडल और बॉक्स टूट सकते हैं।",ml:"അമിതമായി മുറുക്കരുത്. PVC സാഡിലുകളും ബോക്സുകളും പൊട്ടാം."},
  ex:{en:"A saddle holds the pipe the way a belt clip holds a mobile pouch: firm, but not crushing it.",hi:"सैडल पाइप को वैसे पकड़ता है जैसे बेल्ट क्लिप मोबाइल पाउच को: मज़बूती से, पर दबाकर तोड़े बिना।",ml:"ബെൽറ്റ് ക്ലിപ്പ് മൊബൈൽ പൗച്ചിനെ പിടിക്കുന്നതുപോലെ സാഡിൽ പൈപ്പിനെ പിടിക്കുന്നു: ഉറപ്പോടെ, പക്ഷേ ഞെരിക്കാതെ."}},
 {v:"wires",t:{en:"Drawing wires",hi:"तार खींचना",ml:"വയർ വലിക്കൽ"},
  li:{en:["Straighten each wire before drawing. Kinks make drawing hard and damage insulation.","Draw from box to box. The junction box, switch boxes and lamp block are your pulling points.","Draw all wires of one pipe together. Match the count with the Layout table.","Keep wires continuous. No joints inside a pipe, tee or bend.","Leave about 10 cm extra at every switch and lamp point."],
      hi:["खींचने से पहले हर तार सीधा करें। मोड़ (kink) से खींचना कठिन होता है और इंसुलेशन खराब होता है।","बॉक्स से बॉक्स तक खींचें। जंक्शन बॉक्स, स्विच बॉक्स और लैंप ब्लॉक खींचने के पॉइंट हैं।","एक पाइप के सभी तार एक साथ खींचें। लेआउट तालिका से गिनती मिलाएँ।","तार लगातार रखें। पाइप, टी या बेंड के अंदर कोई जोड़ नहीं।","हर स्विच और लैंप पॉइंट पर लगभग 10 cm अतिरिक्त छोड़ें।"],
      ml:["വലിക്കുന്നതിന് മുൻപ് ഓരോ വയറും നേരെയാക്കുക. വളവുകൾ (kink) വലിക്കൽ പ്രയാസമാക്കുകയും ഇൻസുലേഷൻ കേടാക്കുകയും ചെയ്യും.","ബോക്സിൽ നിന്ന് ബോക്സിലേക്ക് വലിക്കുക. ജംഗ്ഷൻ ബോക്സ്, സ്വിച്ച് ബോക്സുകൾ, ലാമ്പ് ബ്ലോക്ക് എന്നിവയാണ് വലിക്കാനുള്ള പോയിന്റുകൾ.","ഒരു പൈപ്പിലെ എല്ലാ വയറുകളും ഒരുമിച്ച് വലിക്കുക. ലേഔട്ട് പട്ടികയുമായി എണ്ണം ഒത്തുനോക്കുക.","വയറുകൾ തുടർച്ചയായിരിക്കണം. പൈപ്പ്, ടീ, ബെൻഡ് എന്നിവയ്ക്കുള്ളിൽ ജോയിന്റ് പാടില്ല.","ഓരോ സ്വിച്ച്, ലാമ്പ് പോയിന്റിലും ഏകദേശം 10 cm അധികം വിടുക."]},
  ex:{en:"Like threading a needle: a straight thread goes in easily. Pull gently and steadily; do not jerk.",hi:"सुई में धागा डालने जैसा: सीधा धागा आसानी से जाता है। धीरे और लगातार खींचें; झटका न दें।",ml:"സൂചിയിൽ നൂൽ കോർക്കുന്നതുപോലെ: നേരെയുള്ള നൂൽ എളുപ്പം കയറും. സാവധാനം സ്ഥിരമായി വലിക്കുക; വെട്ടി വലിക്കരുത്."}},
 {v:"term",t:{en:"Connections at S1, S2 and lamp",hi:"S1, S2 और लैंप पर कनेक्शन",ml:"S1, S2, ലാമ്പ് എന്നിവയിലെ കണക്ഷനുകൾ"},
  li:{en:["Strip only about 1 cm of insulation. Twist the strands.","Insert fully into the terminal and tighten. No bare copper outside the terminal.","Follow the terminal charts exactly.","Supply end: red L and black N are connected to the supply only by the instructor."],
      hi:["केवल लगभग 1 cm इंसुलेशन छीलें। स्ट्रैंड्स को मरोड़ें।","टर्मिनल में पूरा डालें और कसें। टर्मिनल के बाहर नंगा तांबा न दिखे।","टर्मिनल चार्ट का ठीक पालन करें।","सप्लाई सिरा: लाल L और काला N केवल अनुदेशक द्वारा सप्लाई से जोड़े जाते हैं।"],
      ml:["ഏകദേശം 1 cm ഇൻസുലേഷൻ മാത്രം കളയുക. സ്ട്രാൻഡുകൾ പിരിക്കുക.","ടെർമിനലിൽ പൂർണ്ണമായി കയറ്റി മുറുക്കുക. ടെർമിനലിന് പുറത്ത് നഗ്നമായ ചെമ്പ് കാണരുത്.","ടെർമിനൽ ചാർട്ടുകൾ കൃത്യമായി പാലിക്കുക.","സപ്ലൈ അറ്റം: ചുവപ്പ് L, കറുപ്പ് N എന്നിവ ഇൻസ്ട്രക്ടർ മാത്രമേ സപ്ലൈയുമായി ബന്ധിപ്പിക്കൂ."]},
  ex:{en:"Common terminal C is like the inlet of a two-way water valve: water entering goes out through outlet L1 or outlet L2, one at a time.",hi:"कॉमन टर्मिनल C दो-तरफ़ा पानी वाल्व के इनलेट जैसा है: अंदर आया पानी एक समय में आउटलेट L1 या आउटलेट L2 से निकलता है।",ml:"കോമൺ ടെർമിനൽ C ഒരു ടു-വേ വാട്ടർ വാൽവിന്റെ ഇൻലെറ്റ് പോലെയാണ്: അകത്തുവരുന്ന വെള്ളം ഒരു സമയം ഔട്ട്‌ലെറ്റ് L1 വഴിയോ ഔട്ട്‌ലെറ്റ് L2 വഴിയോ പുറത്തുപോകുന്നു."}},
 {v:"test",t:{en:"Testing",hi:"परीक्षण",ml:"ടെസ്റ്റിംഗ്"},li:null,
  pre:{en:["Visual check: all covers fitted, saddles tight, no bare copper.","Strength check of all fixtures by hand (see the last step).","Tug test: pull each wire gently at its terminal. It must not come out.","Trace the red wire: supply → C of S1 only.","Continuity test with the instructor's series test lamp or multimeter, if available."],
       hi:["दृश्य जाँच: सभी कवर लगे, सैडल कसे, कोई नंगा तांबा नहीं।","सभी फिक्सिंग की हाथ से मज़बूती जाँच (अंतिम चरण देखें)।","टग टेस्ट: हर तार को टर्मिनल पर हल्का खींचें। बाहर नहीं आना चाहिए।","लाल तार ट्रेस करें: सप्लाई → केवल S1 का C।","उपलब्ध हो तो अनुदेशक के सीरीज़ टेस्ट लैंप या मल्टीमीटर से निरंतरता परीक्षण।"],
       ml:["ദൃശ്യ പരിശോധന: എല്ലാ കവറുകളും ഘടിപ്പിച്ചു, സാഡിലുകൾ മുറുകി, നഗ്ന ചെമ്പ് ഇല്ല.","എല്ലാ ഫിക്സിംഗുകളുടെയും ഉറപ്പ് കൈകൊണ്ട് പരിശോധിക്കുക (അവസാന ഘട്ടം കാണുക).","ടഗ് ടെസ്റ്റ്: ഓരോ വയറും ടെർമിനലിൽ ചെറുതായി വലിക്കുക. പുറത്തുവരരുത്.","ചുവപ്പ് വയർ പിന്തുടരുക: സപ്ലൈ → S1-ന്റെ C മാത്രം.","ലഭ്യമെങ്കിൽ ഇൻസ്ട്രക്ടറുടെ സീരീസ് ടെസ്റ്റ് ലാമ്പ് അല്ലെങ്കിൽ മൾട്ടിമീറ്റർ ഉപയോഗിച്ച് കണ്ടിന്യൂയിറ്റി ടെസ്റ്റ്."]},
  liv:{en:["Tester on C of S1: glows.","Tester on the N terminal of the lamp holder: no glow.","Operate S1 and S2 in all 4 positions and record the result in the table.","Lamp OFF: tester on lamp holder terminals must not glow. This proves the switches are in the phase.","Switch OFF the supply after testing."],
       hi:["S1 के C पर टेस्टर: जलता है।","लैंप होल्डर के N टर्मिनल पर टेस्टर: नहीं जलता।","S1 और S2 को चारों स्थितियों में चलाएँ और परिणाम तालिका में लिखें।","लैंप OFF: लैंप होल्डर टर्मिनलों पर टेस्टर नहीं जलना चाहिए। इससे सिद्ध होता है कि स्विच फेज़ में हैं।","परीक्षण के बाद सप्लाई बंद करें।"],
       ml:["S1-ന്റെ C-യിൽ ടെസ്റ്റർ: കത്തുന്നു.","ലാമ്പ് ഹോൾഡറിന്റെ N ടെർമിനലിൽ ടെസ്റ്റർ: കത്തുന്നില്ല.","S1, S2 എന്നിവ 4 സ്ഥാനങ്ങളിലും പ്രവർത്തിപ്പിച്ച് ഫലം പട്ടികയിൽ രേഖപ്പെടുത്തുക.","ലാമ്പ് OFF: ലാമ്പ് ഹോൾഡർ ടെർമിനലുകളിൽ ടെസ്റ്റർ കത്തരുത്. സ്വിച്ചുകൾ ഫേസിലാണെന്ന് ഇത് തെളിയിക്കുന്നു.","ടെസ്റ്റിന് ശേഷം സപ്ലൈ ഓഫ് ചെയ്യുക."]},
  sf:{en:"Never test live without the instructor. Stand on a dry floor and use one hand.",hi:"अनुदेशक के बिना कभी लाइव परीक्षण न करें। सूखे फ़र्श पर खड़े हों और एक हाथ का उपयोग करें।",ml:"ഇൻസ്ട്രക്ടർ ഇല്ലാതെ ഒരിക്കലും ലൈവ് ടെസ്റ്റ് ചെയ്യരുത്. ഉണങ്ങിയ തറയിൽ നിൽക്കുക, ഒരു കൈ മാത്രം ഉപയോഗിക്കുക."},
  ex:{en:"Check the tester first on a known live socket, just as you would check a thermometer in known hot water before trusting its reading.",hi:"पहले टेस्टर को ज्ञात लाइव सॉकेट पर जाँचें, जैसे थर्मामीटर पर भरोसा करने से पहले उसे ज्ञात गर्म पानी में जाँचते हैं।",ml:"ആദ്യം ടെസ്റ്റർ അറിയാവുന്ന ലൈവ് സോക്കറ്റിൽ പരിശോധിക്കുക, തെർമോമീറ്ററിനെ വിശ്വസിക്കുന്നതിന് മുൻപ് അറിയാവുന്ന ചൂടുവെള്ളത്തിൽ പരിശോധിക്കുന്നതുപോലെ."}},
 {v:"faults",wide:1,t:{en:"Common faults and final checklist",hi:"सामान्य दोष और अंतिम जाँच सूची",ml:"സാധാരണ തകരാറുകളും അന്തിമ ചെക്ക്‌ലിസ്റ്റും"},li:null,
  ex:{en:"A pilot runs a checklist before every take-off, even after a thousand flights. Do the same before you call the instructor.",hi:"पायलट हर उड़ान से पहले जाँच सूची पढ़ता है, हज़ार उड़ानों के बाद भी। अनुदेशक को बुलाने से पहले आप भी ऐसा ही करें।",ml:"ആയിരം യാത്രകൾക്ക് ശേഷവും ഓരോ ടേക്ക്-ഓഫിന് മുൻപും പൈലറ്റ് ചെക്ക്‌ലിസ്റ്റ് പരിശോധിക്കുന്നു. ഇൻസ്ട്രക്ടറെ വിളിക്കുന്നതിന് മുൻപ് നിങ്ങളും അങ്ങനെ ചെയ്യുക."}}
];

/* ---------- state ---------- */
const S={lang:"en",step:0,s1:1,s2:1,tester:null,obs:{},chk:{},work:{}};
const store={get(k,d){try{const v=localStorage.getItem("twc_"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("twc_"+k,JSON.stringify(v))}catch(e){}}};
S.lang=store.get("lang","en");S.step=Math.min(store.get("step",0),STEPS.length-1);
let fs=store.get("fs",20),skin=store.get("skin","auto");
const $=s=>document.querySelector(s);
const u=k=>UI[S.lang][k];
const L=o=>typeof o==="string"?o:(o[S.lang]||o.en);
const nm=k=>({supply:u("supply"),tee:u("tee"),jb:u("jb"),bend:u("bend"),lamp:u("lamp"),S1:"S1",S2:"S2"}[k]);

/* ---------- layout drawing (units: 1 cm = 10) ---------- */
const PIPE_GEO={P1:[40,320,190,320],P2:[230,320,380,320],P3:[444,320,594,320],P4:[654,380,654,530],P5:[210,340,210,490],P6:[412,288,412,138]};
const SADDLE={P1:[115,320,"h"],P2:[305,320,"h"],P3:[519,320,"h"],P4:[654,455,"v"],P5:[210,415,"v"],P6:[412,213,"v"]};
function boardBg(){
  let g=`<rect x="0" y="0" width="760" height="640" rx="10" fill="var(--board)"/>`;
  for(let i=0;i<9;i++){const y=30+i*70;g+=`<path d="M0 ${y} C 200 ${y-14}, 420 ${y+16}, 760 ${y-6}" stroke="var(--grain)" stroke-width="2" fill="none" opacity=".45"/>`}
  return g;
}
function pipeLine(p,cls,d){const [x1,y1,x2,y2]=PIPE_GEO[p];
  return `<g class="${cls||""}" style="--d:${d||0}s"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--pipe)" stroke-width="20"/><line x1="${x1+(y1===y2?0:-5)}" y1="${y1+(y1===y2?-5:0)}" x2="${x2+(y1===y2?0:-5)}" y2="${y2+(y1===y2?-5:0)}" stroke="var(--pipe-hi)" stroke-width="3" opacity=".7"/></g>`}
function fitting(k,cls,d){
  const st=`class="${cls||""}" style="--d:${d||0}s"`;
  switch(k){

   ${rows.map((r,i)=>{const x=80+i*70;return `<path d="M${x} 66 V${150}" stroke="var(--halo)" stroke-width="9" fill="none"/><path d="M${x} 66 V150" stroke="var(${WC[r[1]]})" stroke-width="6" fill="none" class="draw" pathLength="1" style="--d:${i*.4}s;--t:.8s;stroke-dasharray:1"/>
     <circle cx="${x}" cy="160" r="15" fill="#d9b85c" stroke="#7a5c12" stroke-width="2"/><line x1="${x-9}" y1="160" x2="${x+9}" y2="160" stroke="#5a420c" stroke-width="3"/>
     <text x="${x}" y="206" text-anchor="middle" font-size="20" font-weight="800" fill="#16201B">${r[0]}</text><text x="${x}" y="58" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke">${r[1]}</text>`}).join("")}</svg>`;
  return `<div class="tools" style="grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))">
   <div class="panel">${sw(u("s1b"),[["L1","L1"],["C","L"],["L2","L2"]])}</div>
   <div class="panel">${sw(u("s2b"),[["L1","L1"],["C","LW"],["L2","L2"]])}</div>
   <div class="panel"><svg viewBox="0 0 300 260" role="img" aria-label="${u("lh")}"><text x="150" y="24" text-anchor="middle" font-size="18" font-weight="800" class="lbl-svg">${u("lh")}</text>
     <circle cx="150" cy="170" r="80" fill="var(--fit)" stroke="var(--fit-edge)" stroke-width="2"/><circle cx="150" cy="170" r="40" fill="var(--fit)" stroke="var(--fit-edge)" stroke-width="2"/>
     <path d="M115 66 V170" stroke="var(--halo)" stroke-width="9"/><path d="M115 66 V170" stroke="var(--wLW)" stroke-width="6" class="draw" pathLength="1" style="--t:.8s;stroke-dasharray:1"/>
     <path d="M185 66 V170" stroke="var(--halo)" stroke-width="9"/><path d="M185 66 V170" stroke="var(--wN)" stroke-width="6" class="draw" pathLength="1" style="--d:.4s;--t:.8s;stroke-dasharray:1"/>
     <circle cx="115" cy="170" r="13" fill="#d9b85c" stroke="#7a5c12" stroke-width="2"/><circle cx="185" cy="170" r="13" fill="#d9b85c" stroke="#7a5c12" stroke-width="2"/>
     <text x="115" y="58" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke">LW</text><text x="185" y="58" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke">N</text></svg></div></div>`;
}
function obsTable(){
  const rows=[[1,1],[1,2],[2,1],[2,2]];
  return `<div class="tw"><table class="tt"><thead><tr><th>S1</th><th>S2</th><th>${u("exp")}</th><th>${u("obs")}</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="code">L${r[0]}</td><td class="code">L${r[1]}</td><td class="code">${r[0]===r[1]?"ON":"OFF"}</td><td class="obs code" data-obs="${i}" tabindex="0" role="button">${S.obs[i]||"—"}</td></tr>`).join("")}</tbody></table></div>`;
}

/* ---------- render ---------- */
function exBox(st){return st.ex?`<div class="box ex"><div class="lbl"><svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="6" r="5" fill="currentColor"/><rect x="5.5" y="11" width="5" height="4" rx="1" fill="currentColor"/></svg>${u("ex")}</div><p>${L(st.ex)}</p></div>`:""}
function sfBox(st){return st.sf?`<div class="box safe"><div class="lbl"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 1 L15 14 H1 Z" fill="currentColor"/><rect x="7.2" y="5.5" width="1.6" height="4.5" fill="var(--safe-bg)"/><rect x="7.2" y="11" width="1.6" height="1.6" fill="var(--safe-bg)"/></svg>${u("safe")}</div><p>${L(st.sf)}</p></div>`:""}
const ol=a=>`<ol class="do">${a.map(x=>`<li><span>${x}</span></li>`).join("")}</ol>`;
function replayBtn(id){return `<button class="btn ghost" data-replay="${id}">↻ ${u("play")}</button>`}
function visual(st){
  switch(st.v){
   case "photo":{const pins=[["S1",41,82,1],["S2",78.8,79,1],[nm("lamp"),53.6,10],[nm("jb"),55.7,44],[nm("tee"),38.2,44.4],[nm("bend"),70.6,47.8],[nm("supply"),24.8,44]];
     return `<div class="panel"><div class="photo"><img src="${PHOTO}" alt="${u("photoCap")}">${pins.map((p,i)=>`<span class="pin ${p[3]?"sw":""}" style="left:${p[1]}%;top:${p[2]}%;animation-delay:${.3+i*.25}s">${p[0]}</span>`).join("")}</div><p class="cap">${u("photoCap")}</p></div>`;}
   case "tools":return `<div class="tools">${TOOLS.map(t=>`<div class="panel tool">${ICON[t.i]}<div><h4>${L(t.n)}</h4><p>${L(t.u)}</p></div></div>`).join("")}</div>`;
   case "mats":return `<div class="panel"><div class="tw"><table><thead><tr><th>${u("item")}</th><th>${u("qty")}</th><th>${u("where")}</th></tr></thead><tbody>${MATS.map(r=>`<tr><td>${L(r[0])}</td><td class="num">${L(r[1])}</td><td>${L(r[2])}</td></tr>`).join("")}</tbody></table></div></div><div class="panel"><b>${u("legend")}</b>${legend()}</div>`;
   case "circuit":return circuitPanel(false)+`<div class="panel"><div class="vbar"><b>${u("truth")}</b></div>${truthTable()}</div><div class="panel">${legend()}</div>`;
   case "layout":return `<div class="panel"><div class="vbar"><b>${u("dims")}</b></div>${layoutSVG({dims:1,counts:1,saddles:1})}</div><div class="panel"><div class="tw"><table><thead><tr><th>${u("pipe")}</th><th>${u("route")}</th><th>${u("wires")}</th><th>${u("count")}</th></tr></thead><tbody>${PIPES.map(p=>`<tr><td class="code">${p.p}</td><td>${nm(p.a)} → ${nm(p.b)}</td><td>${p.w.map(w=>`<span class="dot" style="background:var(${WC[w]})"></span><span class="code">${w}</span>`).join(" &nbsp;")}</td><td class="num">${p.w.length}</td></tr>`).join("")}</tbody></table></div></div>`;
   case "marking":return `<div class="panel" id="anim"><div class="vbar"><b>${u("marking")}</b>${replayBtn("marking")}</div><div class="slot">${layoutSVG({marks:1})}</div></div>`;
   case "cut":return `<div class="panel">${cutSVG()}</div>`;
   case "assembly":return `<div class="panel" id="anim"><div class="vbar"><b>${u("assembly")}</b>${replayBtn("assembly")}</div><div class="slot">${layoutSVG({seq:1})}</div></div>`;
   case "fixing":return `<div class="panel" id="anim"><div class="vbar"><b>${u("saddle")}</b>${replayBtn("fixing")}</div><div class="slot">${layoutSVG({saddles:1,saddleAnim:1})}</div></div><div class="panel">${saddleSVG()}</div>`;
   case "wires":return `<div class="panel" id="anim"><div class="vbar"><b>${u("drawing")}</b>${replayBtn("wires")}</div><div class="slot">${layoutSVG({saddles:1,wires:1,wireAnim:1,xray:1})}</div><p class="cap">${u("xray")}</p></div><div class="panel">${legend()}</div>`;
   case "term":return termSVG()+`<div class="panel">${legend()}</div>`;
   case "test":return circuitPanel(true)+`<div class="panel">${obsTable()}</div>`;
   case "faults":return "";
  }
}
function workTable(){const c=L(WORK.cols),ok=L(WORK.ok);const n=Object.values(S.work).filter(v=>v===1).length;
  return `<div class="panel tw"><table><thead><tr><th>#</th><th>${c[0]}</th><th>${c[1]}</th><th>${c[2]}</th></tr></thead><tbody>${WORK.rows.map((r,i)=>{const v=S.work[i];return `<tr><td class="num">${i+1}</td><td><b>${L(r[0])}</b></td><td>${L(r[1])}</td><td class="obs code" data-work="${i}" tabindex="0" role="button" style="white-space:nowrap;color:${v===1?"var(--ok)":v===2?"var(--safe-line)":"inherit"}">${v===1?"✔ "+ok[0]:v===2?"✘ "+ok[1]:"—"}</td></tr>`}).join("")}</tbody><tfoot><tr><td colspan="3" style="text-align:right"><b>${ok[0]}</b></td><td class="num">${n} / ${WORK.rows.length}</td></tr></tfoot></table></div>`}
function render(){
  const st=STEPS[S.step],lang=S.lang;
  document.documentElement.lang=lang;
  $("#ttl").textContent=u("ttl");$("#sub").textContent=u("sub");
  document.title="Two-Way Conduit Wiring";
  $("#prev").textContent=u("prev");$("#next").textContent=u("next");$("#fsBtn").textContent="⛶ "+u("full");
  $("#skinLbl").textContent=u("theme");
  $("#skin").innerHTML=["auto","light","dark","hc"].map(k=>`<option value="${k}" ${k===skin?"selected":""}>${u(k)}</option>`).join("");
  ["en","hi","ml"].forEach(k=>$("#l-"+k).setAttribute("aria-pressed",k===lang));
  $("#nav").innerHTML=STEPS.map((s,i)=>`<button data-go="${i}" ${i===S.step?'aria-current="step"':""}><span class="n">${String(i+1).padStart(2,"0")}</span>${L(s.t)}</button>`).join("");
  $("#pos").textContent=`${u("step")} ${S.step+1} / ${STEPS.length}`;
  $("#prev").disabled=S.step===0;$("#next").disabled=S.step===STEPS.length-1;
  let txt=`<p class="eyebrow">${u("step")} ${String(S.step+1).padStart(2,"0")}</p><h2>${L(st.t)}</h2>`;
  if(st.li) txt+=ol(L(st.li));
  if(st.v==="test") txt+=`<h3>${u("before")}</h3>${ol(L(st.pre))}<h3>${u("live")}</h3>${ol(L(st.liv))}`;
  let html;
  if(st.v==="faults"){
    html=`<section class="step wide"><div class="txt">${txt}<div class="panel tw" style="margin-top:.6rem"><table><thead><tr><th>${u("fault")}</th><th>${u("cause")}</th><th>${u("fix")}</th></tr></thead><tbody>${FAULTS.map(r=>`<tr>${r.map((c,j)=>`<td>${j===0?`<b>${L(c)}</b>`:L(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
     <h3>${L(WORK.head)}</h3><p style="margin:.2rem 0 .6rem">${L(WORK.note)}</p>${workTable()}<div class="box ex"><div class="lbl">${u("ex")}</div><p>${L(WORK.ex)}</p></div>
     <h3>${u("final")}</h3><ul class="chk">${L(CHECK).map((c,i)=>`<li><label><input type="checkbox" id="chk${i}" data-chk="${i}" ${S.chk[i]?"checked":""}>${c}</label></li>`).join("")}</ul>${exBox(st)}</div></section>`;
  } else if(st.wide){
    html=`<section class="step wide"><div class="txt">${txt}</div><div class="vis">${visual(st)}</div><div class="txt">${sfBox(st)}${exBox(st)}</div></section>`;
  } else {
    html=`<section class="step"><div class="txt">${txt}${sfBox(st)}${exBox(st)}</div><div class="vis">${visual(st)}</div></section>`;
  }
  $("#stage").innerHTML=html;
  store.set("lang",lang);store.set("step",S.step);
  const cur=$("#nav [aria-current]");if(cur)cur.scrollIntoView({block:"nearest",inline:"center"});
}
function go(i){S.step=Math.max(0,Math.min(STEPS.length-1,i));S.tester=null;render();window.scrollTo({top:0})}
function applySkin(){if(skin==="auto")document.documentElement.removeAttribute("data-skin");else document.documentElement.setAttribute("data-skin",skin);store.set("skin",skin)}
function applyFs(){fs=Math.max(14,Math.min(34,fs));document.documentElement.style.setProperty("--fs",fs+"px");store.set("fs",fs)}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-go],[data-l],[data-sw],[data-tp],[data-replay],[data-obs],[data-work],#prev,#next,#fsDown,#fsUp,#fsReset,#fsBtn");
  if(!t)return;
  if(t.dataset.go!==undefined)go(+t.dataset.go);
  else if(t.dataset.l){S.lang=t.dataset.l;render()}
  else if(t.dataset.sw){S[t.dataset.sw.toLowerCase()]^=3;render()}
  else if(t.dataset.tp){S.tester=t.dataset.tp;render()}
  else if(t.dataset.replay){const slot=$("#anim .slot");const o={marking:{marks:1},assembly:{seq:1},fixing:{saddles:1,saddleAnim:1},wires:{saddles:1,wires:1,wireAnim:1,xray:1}}[t.dataset.replay];slot.innerHTML="";requestAnimationFrame(()=>slot.innerHTML=layoutSVG(o))}
  else if(t.dataset.obs!==undefined){const i=t.dataset.obs;S.obs[i]=S.obs[i]==="ON"?"OFF":S.obs[i]==="OFF"?"":"ON";t.textContent=S.obs[i]||"—"}
  else if(t.dataset.work!==undefined){const i=t.dataset.work;S.work[i]=((S.work[i]||0)+1)%3;render()}
  else if(t.id==="prev")go(S.step-1);
  else if(t.id==="next")go(S.step+1);
  else if(t.id==="fsDown"){fs-=2;applyFs()}
  else if(t.id==="fsUp"){fs+=2;applyFs()}
  else if(t.id==="fsReset"){fs=20;applyFs()}
  else if(t.id==="fsBtn"){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(err){}}
});
document.addEventListener("change",e=>{
  if(e.target.id==="skin"){skin=e.target.value;applySkin()}
  if(e.target.dataset.chk!==undefined)S.chk[e.target.dataset.chk]=e.target.checked;
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("select,input"))return;
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-sw],[data-tp],[data-obs],[data-work]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}));return}
  if(e.key==="ArrowRight"||e.key==="PageDown")go(S.step+1);
  if(e.key==="ArrowLeft"||e.key==="PageUp")go(S.step-1);
});
applySkin();applyFs();render();
</script>
