<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Series &amp; Parallel Circuits</title>
<meta name="section" content="Circuits &amp; Power Systems">
<meta name="section-order" content="2">
<meta name="order" content="1">
<meta name="description" content="Series and parallel connection of lamps">

<meta name="color-scheme" content="light">
<style>
:root {
  --page: #eef1f4; --panel: #ffffff; --ink: #1f2d3a; --muted: #5a6977; --line: #d3dae1;
  --steel: #2f4a63; --accent: #1c65a8; --ok: #1d8049; --warn: #a96a0c; --err: #bf2d22;
  --font: "Bahnschrift", "DIN Alternate", "Barlow", "Roboto Condensed", "Nirmala UI", "Noto Sans Devanagari", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #eef1f4; --panel: #ffffff; --ink: #1f2d3a; } }
:root[data-theme="dark"] { --page: #eef1f4; --panel: #ffffff; --ink: #1f2d3a; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font); }
body { font-size: 15px; line-height: 1.45; }
html:lang(hi) body { font-size: 15.5px; }
.wrap { max-width: 1680px; margin: 0 auto; padding: 10px 14px 24px; }
header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 6px 2px 10px; }
.brand h1 { margin: 0; font-size: 26px; font-weight: 700; line-height: 1.12; }
.brand p { margin: 3px 0 0; color: var(--muted); font-size: 14px; }
.tabs { display: inline-flex; background: #dfe5ea; border-radius: 10px; padding: 4px; gap: 4px; }
.tabs button { font: inherit; font-size: 16px; font-weight: 600; border: 0; background: transparent; color: var(--steel); padding: 9px 20px; border-radius: 7px; cursor: pointer; min-height: 42px; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(20,40,60,.18); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 10px; }
.tg { display: flex; align-items: center; gap: 8px; }
.tg > span { color: var(--muted); font-size: 13px; }
.wIn { width: 62px; font: inherit; font-size: 15px; padding: 7px 6px; border: 1px solid var(--line); border-radius: 7px; min-height: 40px; text-align: center; }
.wUnit { color: var(--muted); font-size: 13px; margin-left: -4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: inherit; font-size: 14px; border: 0; background: #f6f8fa; color: var(--ink); padding: 8px 12px; cursor: pointer; min-height: 40px; }
.seg button + button { border-left: 1px solid var(--line); }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; font: inherit; font-size: 11px; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--accent); }
.sw.auto { background: conic-gradient(#d3261d 0 50%, #2b2e33 50% 100%); color: #fff; font-weight: 700; }
select { font: inherit; font-size: 14px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 7px; min-height: 40px; background: #f6f8fa; }
.btn { font: inherit; font-size: 14px; font-weight: 600; background: #f4f6f8; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 13px; min-height: 40px; cursor: pointer; }
.btn:hover:not(:disabled) { background: #e8edf1; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--steel); border-color: var(--steel); color: #fff; }
.btn.primary:hover { background: #253c52; }
.btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; min-height: 40px; }
.chk input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--steel); }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.stage { position: relative; }
#board { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; border-radius: 8px; }
body.busy #board { cursor: progress !important; }
.toast { position: absolute; left: 50%; top: 14px; transform: translate(-50%, -10px); background: #1f2d3a; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 90%; text-align: center; z-index: 5; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--err); } .toast.ok { background: var(--ok); }
.status { display: flex; gap: 14px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-left: 8px solid var(--muted); border-radius: 10px; padding: 12px 16px; margin: 10px 0; min-height: 76px; }
.status .ic { flex: 0 0 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px; background: var(--muted); margin-top: 2px; }
.status h2 { margin: 0 0 2px; font-size: 19px; line-height: 1.25; }
.status p { margin: 0; color: #33424f; max-width: 82ch; }
.status.ok { border-left-color: var(--ok); } .status.ok .ic { background: var(--ok); } .status.ok h2 { color: var(--ok); }
.status.warn { border-left-color: var(--warn); } .status.warn .ic { background: var(--warn); } .status.warn h2 { color: var(--warn); }
.status.err { border-left-color: var(--err); background: #fff6f5; } .status.err .ic { background: var(--err); } .status.err h2 { color: var(--err); }
.status.info { border-left-color: var(--steel); } .status.info .ic { background: var(--steel); }
.status .ic::after { content: "i"; }
.status.ok .ic::after { content: "✓"; } .status.warn .ic::after { content: "!"; } .status.err .ic::after { content: "✕"; }
.lower > * { min-width: 0; }
.lower { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
.card h2 { font-size: 18px; margin: 0; }
.cardHead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.cardHead div { display: flex; gap: 8px; }
.tableWrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
th, td { border: 1px solid var(--line); padding: 6px 8px; text-align: center; white-space: nowrap; }
th { background: #eef2f5; font-weight: 600; }
td.empty { color: var(--muted); white-space: normal; padding: 14px; }
td.tick { color: var(--ok); font-weight: 700; } td.cross { color: var(--err); font-weight: 700; }
.concl { margin-top: 10px; background: #f1f7f3; border: 1px solid #cfe3d6; border-radius: 8px; padding: 10px 14px; }
.concl h3 { margin: 0 0 4px; font-size: 16px; color: var(--ok); }
.concl p { margin: 0 0 4px; max-width: 82ch; }
.concl .hint { color: var(--muted); font-size: 13px; }
.safety ul { margin: 6px 0 0; padding-left: 18px; }
.safety li { margin: 0 0 6px; }
.safety .ref { color: var(--muted); font-size: 13px; margin-top: 8px; }
footer { color: var(--muted); font-size: 13px; margin-top: 12px; text-align: center; }
#modal { position: fixed; inset: 0; background: rgba(20,32,44,.55); display: grid; place-items: center; z-index: 20; padding: 16px; }
#modal[hidden] { display: none; }
.mBox { background: #fff; border-radius: 12px; width: min(940px, 100%); padding: 16px 18px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
.mBox h2 { margin: 0 0 8px; font-size: 20px; }
.schem { width: 100%; height: auto; background: #fbfcfd; border: 1px solid var(--line); border-radius: 8px; }
.mFoot { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.mFoot p { margin: 0; color: var(--muted); font-size: 13px; }
/* ---- SVG ---- */
svg text { font-family: var(--font); }
.stencil { font-size: 25px; font-weight: 700; letter-spacing: 2px; fill: #45525a; }
.stencilSm { font-size: 14px; letter-spacing: 1px; fill: #5c6a71; }
.sticker { font-size: 15px; font-weight: 700; fill: #1d2429; letter-spacing: .5px; }
.lblW { font-size: 17px; font-weight: 700; fill: #fff; }
.lblWs { font-size: 12.5px; fill: #e3e8ec; }
.lblD { font-size: 16px; font-weight: 700; fill: #2c2a26; }
.lblDs { font-size: 12px; fill: #5b564b; }
.lblWin { font-size: 11px; font-weight: 700; fill: #fff; }
.lblRock { font-size: 17px; font-weight: 700; fill: #fff; opacity: .9; }
.polL { font-size: 15px; font-weight: 700; fill: #c8261d; }
.polN { font-size: 15px; font-weight: 700; fill: #1c1d20; }
.polS { font-size: 16px; font-weight: 700; fill: #fff; }
.dialNum { font-size: 11px; fill: #111; }
.dialUnit { font-size: 20px; font-weight: 700; fill: #111; }
.dialSym { font-size: 11px; fill: #111; }
.lcdLab { font-size: 16px; font-weight: 700; fill: #7fe3a6; letter-spacing: 1px; }
.lcdTxt { font-size: 23px; font-weight: 700; fill: #8dffc0; font-variant-numeric: tabular-nums; }
body.noLcd .lcd { display: none; }
.busLab { font-size: 13px; font-weight: 700; fill: #4d3a0c; }
.dpHit { cursor: pointer; }
.post .tring { fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; }
.post.hover .tring { opacity: 1; }
.post.pending .tring { opacity: 1; stroke: #f0a400; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { stroke-width: 6; } }
.lead { cursor: pointer; }
.selHalo { stroke: #ffd21f; stroke-width: 15; fill: none; opacity: .75; stroke-linejoin: round; }
.delBtn { cursor: pointer; }
.led { fill: #5b1d1d; stroke: #111; }
.aflash { fill: none; stroke: #ff2a1f; stroke-width: 6; opacity: 0; }
.meter.alarm .aflash { animation: blink .42s steps(1) infinite; }
.meter.alarm .led { animation: led .42s steps(1) infinite; }
@keyframes blink { 50% { opacity: 1; } }
@keyframes led { 50% { fill: #ff3b2f; } }
.meter .fire, .meter .smoke, .meter .crack, .meter .soot { display: none; }
.meter.burning .fire { display: inline; }
.meter.smoking .smoke { display: inline; }
.meter.burnt .crack, .meter.burnt .soot { display: inline; }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flick .16s ease-in-out infinite alternate; opacity: .95; }
.flame.f2 { animation-duration: .21s; animation-delay: -.07s; }
.flame.f3 { animation-duration: .19s; animation-delay: -.12s; }
.flame.f4 { animation-duration: .13s; }
@keyframes flick { from { transform: scale(1, 1) skewX(3deg); } to { transform: scale(.86, 1.14) skewX(-4deg); } }
.smoke circle { transform-box: fill-box; transform-origin: center; animation: rise 2.5s linear infinite; opacity: 0; }
@keyframes rise { 0% { transform: translate(0,0) scale(.6); opacity: 0; } 15% { opacity: .5; } 100% { transform: translate(16px,-170px) scale(2.6); opacity: 0; } }
.spark { animation: spark .9s ease-out forwards; }
@keyframes spark { 0% { opacity: 1; } 100% { opacity: 0; } }
.sLab { font-size: 15px; fill: #1d2a36; }
.sMeter { font-size: 14px; font-weight: 700; fill: #1d2a36; }
.sNote { font-size: 14px; fill: #5a6977; font-style: italic; }
@media (prefers-reduced-motion: reduce) {
  .flame, .smoke circle, .post.pending .tring { animation: none; }
  .smoke circle { opacity: .4; }
}
@media (max-width: 920px) {
  .stage { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #board { min-width: 900px; }
  .stage::after { content: "↔"; display: block; color: var(--muted); font-size: 13px; padding: 2px; text-align: center; }
}
@media (max-width: 1000px) {
  .lower { grid-template-columns: 1fr; }
  .wrap { padding: 8px 8px 18px; }
  .brand h1 { font-size: 21px; }
  .tabs button { padding: 8px 12px; font-size: 15px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 data-i18n="ui.title"></h1>
      <p data-i18n="ui.sub"></p>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="series" aria-selected="true" data-i18n="ui.tabS"></button>
      <button role="tab" data-tab="parallel" aria-selected="false" data-i18n="ui.tabP"></button>
    </div>
  </header>

  <div class="toolbar">
    <div class="tg"><span data-i18n="ui.lang"></span>
      <select id="langSel" aria-label="Language">
        <option value="en">English</option>
        <option value="hi">हिंदी</option>
      </select>
    </div>
    <div class="tg"><span data-i18n="ui.lamps"></span>
      <label class="chk">L1 <input class="wIn" type="number" step="5" inputmode="numeric" aria-label="L1 watt"></label>
      <label class="chk">L2 <input class="wIn" type="number" step="5" inputmode="numeric" aria-label="L2 watt"></label>
      <label class="chk">L3 <input class="wIn" type="number" step="5" inputmode="numeric" aria-label="L3 watt"></label>
      <span class="wUnit">W</span>
      <div class="seg">
        <button data-preset="equal" data-i18n="ui.p1"></button>
        <button data-preset="unequal" data-i18n="ui.p2"></button>
      </div>
    </div>
    <div class="tg"><span data-i18n="ui.colour"></span>
      <button class="sw auto" data-col="auto" aria-pressed="true" data-i18n-aria="ui.auto">A</button>
      <button class="sw" data-col="red" aria-pressed="false" data-i18n-aria="ui.red" style="background:#d3261d"></button>
      <button class="sw" data-col="black" aria-pressed="false" data-i18n-aria="ui.black" style="background:#2b2e33"></button>
      <button class="sw" data-col="yellow" aria-pressed="false" data-i18n-aria="ui.yellow" style="background:#efbf22"></button>
      <button class="sw" data-col="blue" aria-pressed="false" data-i18n-aria="ui.blue" style="background:#1f6bd0"></button>
    </div>
    <div class="tg">
      <button class="btn" id="btnUndo" data-i18n="ui.undo" disabled></button>
      <button class="btn" id="btnDel" data-i18n="ui.del" disabled></button>
      <button class="btn" id="btnReset" data-i18n="ui.reset"></button>
    </div>
    <div class="tg">
      <button class="btn primary" id="btnCheck" data-i18n="ui.check"></button>
      <button class="btn" id="btnDiagram" data-i18n="ui.diagram"></button>
      <button class="btn danger" id="btnReplace" data-i18n="ui.replace" hidden></button>
    </div>
    <div class="tg">
      <label class="chk"><input type="checkbox" id="tglRead" checked> <span data-i18n="ui.readouts"></span></label>
      <label class="chk"><input type="checkbox" id="tglSound" checked> <span data-i18n="ui.sound"></span></label>
    </div>
  </div>

  <div class="stage">
    <svg id="board" viewBox="0 0 1620 1230" aria-label="Wiring panel"></svg>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <section id="status" class="status info" aria-live="polite">
    <div class="ic" aria-hidden="true"></div>
    <div><h2 id="stTitle"></h2><p id="stText"></p></div>
  </section>

  <div class="lower">
    <section class="card">
      <div class="cardHead">
        <h2 data-i18n="ui.obs"></h2>
        <div><button class="btn primary" id="btnRecord" data-i18n="ui.record"></button><button class="btn" id="btnClear" data-i18n="ui.clear"></button></div>
      </div>
      <div class="tableWrap"><table id="obsTable"></table></div>
      <div id="conclusion" class="concl" hidden></div>
    </section>
    <section class="card safety">
      <h2 data-i18n="ui.safety"></h2>
      <ul>
        <li data-i18n="ui.s1"></li><li data-i18n="ui.s2"></li><li data-i18n="ui.s3"></li>
        <li data-i18n="ui.s4"></li><li data-i18n="ui.s5"></li>
      </ul>
      <p class="ref" data-i18n="ui.refs"></p>
    </section>
  </div>
  <footer data-i18n="ui.footer"></footer>
</div>

<div id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="mBox">
    <h2 id="modalTitle"></h2>
    <div id="schemBox"></div>
    <div class="mFoot">
      <p data-i18n="ui.modalNote"></p>
      <div><button class="btn" id="btnDemo" data-i18n="ui.wireMe"></button> <button class="btn primary" id="btnClose" data-i18n="ui.close"></button></div>
    </div>
  </div>
</div>

/* =====================================================================
   2. ROUTER  – orthogonal A* on the board grid.
   Hard rules : never through a component body, never through a cell
                used by another lead, never through a foreign terminal
                or the four cells around it (keeps posts accessible).
   Soft costs : turns, hugging bodies, passing near foreign terminals.
   If a new lead cannot be placed, existing leads are ripped up and
   re-routed in other orders before giving up.
   ===================================================================== */
const DC = [0, 1, 0, -1], DR = [-1, 0, 1, 0];

class Router {
  constructor(B) {
    this.B = B;
    const N = GW * GH;
    this.N = N;
    this.block = new Uint8Array(N);
    this.cost = new Float32Array(N);
    this.termAt = new Int16Array(N).fill(-1);
    this.guard = new Int16Array(N).fill(-1);   // 4-neighbour of a terminal
    this.prox = new Int16Array(N).fill(-1);    // within radius 2 of a terminal (-2 = several)
    for (let c = 0; c < GW; c++) for (const r of [0, 1, GH - 2, GH - 1]) this.block[r * GW + c] = 1;
    for (let r = 0; r < GH; r++) for (const c of [0, 1, GW - 2, GW - 1]) this.block[r * GW + c] = 1;
    B.comps.forEach(cp => {
      const [c0, r0, c1, r1] = cp.body;
      for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) this.block[r * GW + c] = 1;
    });
    // hugging cost
    for (let r = 1; r < GH - 1; r++) for (let c = 1; c < GW - 1; c++) {
      const i = r * GW + c; if (this.block[i]) continue;
      let near = 0;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) if (this.block[i + dr * GW + dc]) near = 1;
      if (near) this.cost[i] += 0.6;
    }
    B.termList.forEach(t => {
      const i = t.r * GW + t.c;
      this.termAt[i] = t.idx;
      for (let d = 0; d < 4; d++) {
        const c = t.c + DC[d], r = t.r + DR[d];
        if (c < 0 || r < 0 || c >= GW || r >= GH) continue;
        this.guard[r * GW + c] = t.idx;
      }
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
        const c = t.c + dc, r = t.r + dr;
        if (c < 0 || r < 0 || c >= GW || r >= GH) continue;
        const j = r * GW + c;
        this.prox[j] = (this.prox[j] === -1 || this.prox[j] === t.idx) ? t.idx : -2;
      }
    });
    const S = N * 4;
    this.g = new Float32Array(S);
    this.stamp = new Uint32Array(S);
    this.closed = new Uint32Array(S);
    this.from = new Int32Array(S);
    this.gen = 0;
    this.heapS = new Int32Array(S * 2);
    this.heapF = new Float32Array(S * 2);
  }

  /* occ: Int32Array(N) lead index per cell or -1 */
  route(ta, tb, occ) {
    if (ta === tb) return null;
    const s = ta.r * GW + ta.c, goal = tb.r * GW + tb.c;
    const A = ta.idx, Bi = tb.idx;
    const gen = ++this.gen;
    const g = this.g, st = this.stamp, cl = this.closed, from = this.from;
    const hS = this.heapS, hF = this.heapF;
    let hn = 0;
    const gc = tb.c, gr = tb.r;
    const push = (sid, f) => {
      let i = hn++;
      while (i > 0) { const p = (i - 1) >> 1; if (hF[p] <= f) break; hS[i] = hS[p]; hF[i] = hF[p]; i = p; }
      hS[i] = sid; hF[i] = f;
    };
    const pop = () => {
      const top = hS[0]; hn--;
      if (hn > 0) {
        const ls = hS[hn], lf = hF[hn]; let i = 0;
        for (;;) {
          let l = 2 * i + 1; if (l >= hn) break;
          if (l + 1 < hn && hF[l + 1] < hF[l]) l++;
          if (hF[l] >= lf) break;
          hS[i] = hS[l]; hF[i] = hF[l]; i = l;
        }
        hS[i] = ls; hF[i] = lf;
      }
      return top;
    };
    const h = (c, r) => Math.abs(c - gc) + Math.abs(r - gr);
    for (let d = 0; d < 4; d++) {
      const sid = s * 4 + d; st[sid] = gen; g[sid] = 0; from[sid] = -1;
      push(sid, h(ta.c, ta.r));
    }
    const inDir = (tb.out + 2) % 4;  // preferred direction of travel when entering goal
    let found = -1, iter = 0;
    while (hn > 0) {
      const sid = pop();
      if (cl[sid] === gen) continue;
      cl[sid] = gen;
      const cell = sid >> 2, dir = sid & 3;
      if (cell === goal) { found = sid; break; }
      if (++iter > 200000) break;
      const c = cell % GW, r = (cell / GW) | 0;
      for (let d = 0; d < 4; d++) {
        const nc = c + DC[d], nr = r + DR[d];
        if (nc < 0 || nr < 0 || nc >= GW || nr >= GH) continue;
        const n = nr * GW + nc;
        if (this.block[n]) continue;
        if (n !== goal) {
          if (this.termAt[n] >= 0) continue;
          if (occ[n] >= 0) continue;
          const gd = this.guard[n];
          if (gd >= 0 && gd !== A && gd !== Bi) continue;
        }
        let step = 1 + this.cost[n];
        if (cell === s) { if (d !== ta.out) step += 3; }
        else if (d !== dir) step += 2;
        const px = this.prox[n];
        if (px !== -1 && px !== A && px !== Bi) step += 3;
        if (n === goal && d !== inDir) step += 3;
        const nid = n * 4 + d;
        const ng = g[sid] + step;
        if (st[nid] !== gen || ng < g[nid]) {
          st[nid] = gen; g[nid] = ng; from[nid] = sid;
          push(nid, ng + h(nc, nr));
        }
      }
    }
    if (found < 0) return null;
    const cells = [];
    for (let x = found; x >= 0; x = from[x]) {
      const cc = x >> 2;
      if (cells[cells.length - 1] !== cc) cells.push(cc);
    }
    cells.reverse();
    return cells;
  }

  mark(occ, cells, li) {
    for (const cc of cells) if (this.termAt[cc] < 0) occ[cc] = li;
  }

  /* route leads in given order; returns array of paths (by lead index) or null */
  routeAll(leads, order) {
    const occ = new Int32Array(this.N).fill(-1);
    const paths = new Array(leads.length);
    for (const li of order) {
      const L = leads[li];
      const p = this.route(this.B.term[L.a], this.B.term[L.b], occ);
      if (!p) return null;
      this.mark(occ, p, li);
      paths[li] = p;
    }
    return paths;
  }

  occupancy(leads, skip) {
    const occ = new Int32Array(this.N).fill(-1);
    leads.forEach((L, i) => { if (i !== skip && L.path) this.mark(occ, L.path, i); });
    return occ;
  }

  /* Place leads[newIdx]; existing leads already have paths.
     Returns true and updates .path on all leads, or false. */
  place(leads, newIdx, budgetMs = 700) {
    const occ = this.occupancy(leads, newIdx);
    const L = leads[newIdx];
    const ta = this.B.term[L.a], tb = this.B.term[L.b];
    const p = this.route(ta, tb, occ);
    const man = Math.abs(ta.c - tb.c) + Math.abs(ta.r - tb.r);
    const total = paths => paths.reduce((s, q) => s + (q ? q.length : 400), 0);
    let best = null, bestScore = Infinity;
    if (p) {
      best = leads.map((l, i) => i === newIdx ? p : l.path);
      bestScore = total(best);
      if (p.length <= 1.5 * man + 14) { L.path = p; return true; }   // good enough
    }
    const n = leads.length;
    const others = [...Array(n).keys()].filter(i => i !== newIdx);
    const len = i => leads[i].path ? leads[i].path.length : 999;
    const tries = [
      [newIdx, ...others],
      [...others.slice().sort((a, b) => len(a) - len(b)), newIdx],
      [newIdx, ...others.slice().sort((a, b) => len(a) - len(b))],
      [newIdx, ...others.slice().reverse()],
      [newIdx, ...others.slice().sort((a, b) => len(b) - len(a))]
    ];
    const t0 = Date.now();
    const budget = best ? Math.min(250, budgetMs) : budgetMs;
    let seed = 12345 + n * 7;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    for (let k = 0; ; k++) {
      let order;
      if (k < tries.length) order = tries[k];
      else {
        if (Date.now() - t0 > budget || k > 400 || (!p && best)) break;
        order = [newIdx, ...others];
        for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
      }
      const paths = this.routeAll(leads, order);
      if (paths) {
        const sc = total(paths);
        if (sc < bestScore - 0.5) { best = paths; bestScore = sc; }
        if (!p && k >= tries.length) break;
      }
    }
    if (!best) return false;
    leads.forEach((l, i) => l.path = best[i]);
    return true;
  }

  /* After deletion try a clean re-route in creation order; keep old paths if it fails */
  tidy(leads) {
    const paths = this.routeAll(leads, [...leads.keys()]);
    if (paths) leads.forEach((l, i) => l.path = paths[i]);
  }
}

/* =====================================================================
   3. NETLIST + SOLVER (Modified Nodal Analysis, resistive AC RMS)
   Supply 230 V with 0.1 Ω internal resistance (Norton form),
   ammeter 0.05 Ω, voltmeter 100 kΩ, DP contact 0.01 Ω, lamp R = V²/P.

const G_SRC = 1 / 0.1, G_AMM = 1 / 0.05, G_VM = 1 / 100000, G_DP = 1 / 0.01;

function makeUF(n) {
  const p = [...Array(n).keys()];
  const find = x => { while (p[x] !== x) { p[x] = p[p[x]]; x = p[x]; } return x; };
  const union = (a, b) => { a = find(a); b = find(b); if (a !== b) p[a] = b; };
  return { p, find, union, clone() { const u = makeUF(n); u.p.splice(0, n, ...p); return u; } };
}

function buildNet(B, leads) {

  const uf = makeUF(n);
  leads.forEach(Ld => uf.union(T[Ld.a].idx, T[Ld.b].idx));
  B.comps.forEach(c => { if (c.type === 'bus') for (let i = 1; i < c.terms.length; i++) uf.union(c.terms[0].idx, c.terms[i].idx); });
  const roots = new Map(); let nn = 0;
  for (let i = 0; i < n; i++) { const r = uf.find(i); if (!roots.has(r)) roots.set(r, nn++); }
  const node = id => roots.get(uf.find(T[id].idx));
  return { uf, node, nn };
}

function solveNet(B, net, st, dpL, dpN, vShort) {
  const els = [], nd = net.node, w = st.w;
  els.push({ id: 'SRC', a: nd('SUP.L'), b: nd('SUP.N'), g: G_SRC });
  if (dpL) els.push({ id: 'DPL', a: nd('DP.Lin'), b: nd('DP.Lout'), g: G_DP });
  if (dpN) els.push({ id: 'DPN', a: nd('DP.Nin'), b: nd('DP.Nout'), g: G_DP });
  B.comps.forEach(c => {
    if (c.type === 'meter') {
      const g = c.kind === 'A' ? (st.burnt.has(c.id) ? 0 : G_AMM) : (vShort === c.id ? 1000 : G_VM);
      if (g > 0) els.push({ id: c.id, a: nd(c.id + '.a'), b: nd(c.id + '.b'), g });
    } else if (c.type === 'lamp') {
      els.push({ id: c.id, a: nd(c.id + '.a'), b: nd(c.id + '.b'), g: 1 / lampR(w[c.idx]) });
    }
  });
  const nn = net.nn, gnd = nd('SUP.N');
  const map = new Int32Array(nn).fill(-1); let m = 0;
  for (let i = 0; i < nn; i++) if (i !== gnd) map[i] = m++;
  const A = new Float64Array(m * m), z = new Float64Array(m);
  for (let i = 0; i < m; i++) A[i * m + i] += 1e-9;
  els.forEach(e => {
    const ia = map[e.a], ib = map[e.b];
    if (ia >= 0) A[ia * m + ia] += e.g;
    if (ib >= 0) A[ib * m + ib] += e.g;
    if (ia >= 0 && ib >= 0) { A[ia * m + ib] -= e.g; A[ib * m + ia] -= e.g; }
  });
  if (map[nd('SUP.L')] >= 0) z[map[nd('SUP.L')]] += VS * G_SRC;
  for (let k = 0; k < m; k++) {
    let piv = k, best = Math.abs(A[k * m + k]);
    for (let i = k + 1; i < m; i++) { const v = Math.abs(A[i * m + k]); if (v > best) { best = v; piv = i; } }
    if (piv !== k) {
      for (let j = 0; j < m; j++) { const t = A[k * m + j]; A[k * m + j] = A[piv * m + j]; A[piv * m + j] = t; }
      const t = z[k]; z[k] = z[piv]; z[piv] = t;
    }
    const d = A[k * m + k];
    for (let i = k + 1; i < m; i++) {
      const f = A[i * m + k] / d; if (f === 0) continue;
      for (let j = k; j < m; j++) A[i * m + j] -= f * A[k * m + j];
      z[i] -= f * z[k];
    }
  }
  const x = new Float64Array(m);
  for (let i = m - 1; i >= 0; i--) {
    let s = z[i];
    for (let j = i + 1; j < m; j++) s -= A[i * m + j] * x[j];
    x[i] = s / A[i * m + i];
  }
  const V = i => (i === gnd ? 0 : x[map[i]]);
  const I = {}, dV = {};
  els.forEach(e => { dV[e.id] = Math.abs(V(e.a) - V(e.b)); I[e.id] = e.g * dV[e.id]; });
  return { I, dV };
}

/* ---------- helpers shared by the checks ---------- */
function fmtCur(c, v) {
  return c.unit === 'mA' ? (v * 1000).toFixed(1) + ' mA' : v.toFixed(3) + ' A';
}
function isConnected(B, leads, c) {
  return c.terms.every(t => leads.some(L => L.a === t.id || L.b === t.id));
}
function acrossSame(net, m, c) {
  const a = net.node(m.id + '.a'), b = net.node(m.id + '.b');
  const p = net.node(c.id + '.a'), q = net.node(c.id + '.b');
  return (a === p && b === q) || (a === q && b === p);
}
function inSeriesWith(B, net, mA, mB) {
  const elemTerms = B.termList.filter(t => ['meter', 'lamp', 'dp', 'supply'].includes(t.comp.type));
  for (const ta of mA.terms) for (const tb of mB.terms) {
    const na = net.node(ta.id);
    if (na !== net.node(tb.id)) continue;
    const others = elemTerms.filter(t => net.node(t.id) === na && t.comp !== mA && t.comp !== mB &&
      !(t.comp.type === 'meter' && t.comp.kind === 'V'));
    if (!others.length) return true;
  }
  return false;
}

/* =====================================================================
   4. FAULT ENGINE
   st = { dpOn, w:[w1,w2,w3], burnt:Set }
   status = { level, t:[key,params], x:[[key,params], ...] }
   ===================================================================== */
function evaluate(B, leads, st, simulate) {
  const res = { meters: {}, lampI: {}, lampP: {}, status: null, burn: [], alarm: [], short: null,
                correct: false, energised: false };
  const meters = B.comps.filter(c => c.type === 'meter');
  const lamps = B.comps.filter(c => c.type === 'lamp');
  const amms = meters.filter(c => c.kind === 'A'), vms = meters.filter(c => c.kind === 'V');
  const mainA = B.comp.A, mainV = B.comp.V;
  const brA = [B.comp.A1, B.comp.A2, B.comp.A3], brV = [B.comp.V1, B.comp.V2, B.comp.V3];
  meters.forEach(c => res.meters[c.id] = 0);
  lamps.forEach(c => { res.lampI[c.id] = 0; res.lampP[c.id] = 0; });
  const w = st.w, Irated = k => w[k] / VS;
  const say = (level, t, x) => { res.status = { level, t, x }; return res; };

  if (!st.dpOn && !simulate)
    return say('info', ['msg.off.t'], [[leads.length ? 'msg.off.x' : 'msg.off0.x']]);
  res.energised = !simulate;

  const net = buildNet(B, leads), T = B.term;

  /* a) dead short through leads and switch only */
  const uf2 = net.uf.clone();
  uf2.union(T['DP.Lin'].idx, T['DP.Lout'].idx); uf2.union(T['DP.Nin'].idx, T['DP.Nout'].idx);
  if (uf2.find(T['SUP.L'].idx) === uf2.find(T['SUP.N'].idx)) {
    res.short = net.uf.find(T['SUP.L'].idx) === net.uf.find(T['SUP.N'].idx) ? 'supply' : 'dp';
    res.energised = false;
    return say('err', ['msg.short.t'], [['msg.short.x']]);
  }

  const n = solveNet(B, net, st, true, true, null);
  meters.forEach(c => res.meters[c.id] = c.kind === 'A' ? (n.I[c.id] || 0) : (n.dV[c.id] || 0));
  lamps.forEach(c => { res.lampI[c.id] = n.I[c.id]; res.lampP[c.id] = n.I[c.id] * n.I[c.id] * lampR(w[c.idx]); });
  const lampLit = s => lamps.some(c => s.I[c.id] > 0.02 * Irated(c.idx));

  /* b) ammeter carrying a fault current */
  amms.forEach(c => { if (!st.burnt.has(c.id) && n.I[c.id] > 5 * c.fs) res.burn.push(c.id); });
  if (res.burn.length) {
    lamps.forEach(c => { res.lampI[c.id] = 0; res.lampP[c.id] = 0; });
    const big = Math.max(...res.burn.map(id => n.I[id]));
    const amps = big < 10 ? big.toFixed(2) : big.toFixed(0);
    const u = uf2.clone();
    res.burn.forEach(id => u.union(T[id + '.a'].idx, T[id + '.b'].idx));
    const shorting = u.find(T['SUP.L'].idx) === u.find(T['SUP.N'].idx);
    const names = res.burn.join(', ');
    return shorting
      ? say('err', ['msg.ashort.t'], [['msg.ashort.x', [names, amps]]])
      : say('err', ['msg.aover.t'], [['msg.aover.x', [names, amps]]]);
  }

  /* c) voltmeter in series */
  vms.forEach(v => {
    const s = solveNet(B, net, st, true, true, v.id);
    let ser = lamps.some(c => s.I[c.id] > 0.1 * Irated(c.idx) && n.I[c.id] < 0.02 * Irated(c.idx));
    if (!ser) ser = amms.some(a => !st.burnt.has(a.id) && s.I[a.id] > 0.2 * a.fs && n.I[a.id] < 0.02 * a.fs);
    if (ser) res.alarm.push(v.id);
  });
  if (res.alarm.length)
    return say('err', ['msg.vser.t'], [['msg.vser.x', [res.alarm.join(', '), res.meters[res.alarm[0]].toFixed(0)]]]);

  /* d) open circuit */
  if (!lampLit(n)) {
    if (!leads.length) return say('warn', ['msg.none.t'], [['msg.none.x']]);
    const used = new Set(); leads.forEach(Ld => { used.add(Ld.a); used.add(Ld.b); });
    const loose = [];
    B.comps.filter(c => c.type !== 'bus').forEach(c => c.terms.forEach(t => { if (!used.has(t.id)) loose.push(L(t.nk, t.np)); }));
    return loose.length
      ? say('warn', ['msg.open.t'], [['msg.open.x', [loose.slice(0, 4).join(', ')]]])
      : say('warn', ['msg.open.t'], [['msg.open2.x']]);
  }

  /* e) DP switch usage */
  const sL = solveNet(B, net, st, false, true, null), sN = solveNet(B, net, st, true, false, null);
  const fL = lampLit(sL), fN = lampLit(sN);
  const f = id => net.uf.find(T[id].idx);
  let dpLevel = null; const dpNotes = [];
  if (fL && fN) { dpLevel = 'err'; dpNotes.push(['msg.dpby.x']); }
  else if (fL) { dpLevel = 'warn'; dpNotes.push(['msg.dpl.x']); }
  else if (fN) { dpLevel = 'warn'; dpNotes.push(['msg.dpn.x']); }
  if (f('SUP.L') === f('DP.Nin') && f('SUP.N') === f('DP.Lin')) { dpLevel = dpLevel || 'warn'; dpNotes.push(['msg.dpsw.x']); }

  /* f) topology */
  const ctx = { B, net, n, st, res, lamps, mainA, mainV, brA, brV, leads, Irated };
  const topo = B.id === 'series' ? checkSeries(ctx) : checkParallel(ctx);
  if (dpLevel) {
    const lvl = (dpLevel === 'err' || topo.level === 'err') ? 'err' : 'warn';
    const x = dpNotes.concat(topo.level === 'ok' ? [] : topo.x);
    return say(lvl, [dpLevel === 'err' ? 'msg.dpby.t' : 'msg.dpchk.t'], x);
  }
  res.correct = topo.level === 'ok';
  return say(topo.level, topo.t, topo.x);
}

/* instruments that are not wired up yet – reported as a gentle hint */
function pending(ctx) {
  const { B, leads } = ctx;
  return B.comps.filter(c => c.type === 'meter' && !isConnected(B, leads, c)).map(c => c.label);
}
function branchChecks(ctx, expectV) {
  const { B, net, res, lamps, brA, brV, leads, st } = ctx;
  for (let k = 0; k < 3; k++) {
    const V = brV[k], Lk = lamps[k];
    if (isConnected(B, leads, V) && !acrossSame(net, V, Lk))
      return { level: 'warn', t: ['msg.vkwrong.t', [V.label, Lk.label]], x: [['msg.vkwrong.x', [V.label, Lk.label]]] };
    const A = brA[k];
    if (isConnected(B, leads, A) && !st.burnt.has(A.id) && !inSeriesWith(B, net, A, Lk)) {
      let j = -1;
      for (let q = 0; q < 3; q++) if (q !== k && inSeriesWith(B, net, A, lamps[q])) j = q;
      return j >= 0
        ? { level: 'warn', t: ['msg.akwrong.t', [A.label, Lk.label]], x: [['msg.akwrong.x', [A.label, lamps[j].label, Lk.label]]] }
        : { level: 'warn', t: ['msg.akwrong.t', [A.label, Lk.label]], x: [['msg.akwrong2.x', [A.label, Lk.label]]] };
    }
  }
  return null;
}

function checkSeries(ctx) {
  const { B, net, n, st, res, lamps, mainA, mainV, leads } = ctx;
  const w = st.w, R = lamps.map(c => lampR(w[c.idx]));
  const Iexp = VS / R.reduce((a, b) => a + b, 0);
  const I = lamps.map(c => n.I[c.id]);
  const near = (x, y, tol) => Math.abs(x - y) <= tol * y;
  if (I.every(i => near(i, Iexp, 0.03))) {
    if (st.burnt.size) return { level: 'warn', t: ['msg.burnt.t'], x: [['msg.burnt.x', [[...st.burnt].join(', ')]]] };
    const a = res.meters.A, v = res.meters.V;
    if (isConnected(B, leads, mainA)) {
      if (a < 0.5 * Iexp) return { level: 'warn', t: ['msg.anotpath.t'], x: [['msg.anotpath.x']] };
      if (!near(a, Iexp, 0.03)) return { level: 'warn', t: ['msg.amis.t'], x: [['msg.amis.x']] };
    }
    if (isConnected(B, leads, mainV) && v < 220)
      return { level: 'warn', t: ['msg.vnot.t'], x: [[v > 5 ? 'msg.vpart.x' : 'msg.vnot.x', [v.toFixed(1)]]] };
    const br = branchChecks(ctx);
    if (br) return br;
    const vl = lamps.map((c, k) => (I[k] * R[k]).toFixed(0) + ' V').join(', ');
    const x = [['msg.sok.x', [fmtCur(mainA, I[0]), v.toFixed(0), vl]]];
    const p = pending(ctx);
    if (p.length) x.push(['msg.hint', [p.join(', ')]]);
    return { level: 'ok', t: ['msg.sok.t'], x };
  }
  const amms = B.comps.filter(c => c.type === 'meter' && c.kind === 'A');
  for (const c of lamps) {
    if (n.I[c.id] >= 0.02 * Iexp) continue;
    for (const A of amms) {
      if (!st.burnt.has(A.id) && acrossSame(net, A, c))
        return { level: 'err', t: ['msg.aacross.t', [A.label, c.label]], x: [['msg.aacross.x', [A.label, c.label]]] };
    }
  }
  const full = lamps.filter((c, k) => near(I[k], VS / R[k], 0.05));
  if (full.length >= 2)
    return { level: 'err', t: ['msg.snot.t'], x: [['msg.snot.par', [full.map(c => c.label).join(', ')]]] };
  const dark = lamps.filter((c, k) => I[k] < 0.02 * w[c.idx] / VS);
  return { level: 'err', t: ['msg.snot.t'], x: [[dark.length ? 'msg.snot.dark' : 'msg.snot.gen', [dark.map(c => c.label).join(', ')]]] };
}

function checkParallel(ctx) {
  const { B, net, n, st, res, lamps, mainA, mainV, brA, leads } = ctx;
  const w = st.w;
  const Ik = lamps.map(c => n.I[c.id]);
  const Iexp = lamps.map(c => VS / lampR(w[c.idx]));
  const near = (x, y, tol) => Math.abs(x - y) <= tol * y;
  const sum = Ik.reduce((a, b) => a + b, 0);
  if (Ik.every((i, k) => near(i, Iexp[k], 0.03))) {
    if (st.burnt.size) return { level: 'warn', t: ['msg.burnt.t'], x: [['msg.burnt.x', [[...st.burnt].join(', ')]]] };
    const at = res.meters.A, v = res.meters.V;
    if (isConnected(B, leads, mainA) && !near(at, sum, 0.02)) {
      const one = Ik.some(i => near(at, i, 0.03));
      return { level: 'warn', t: ['msg.atmain.t'], x: [[one ? 'msg.atbr.x' : 'msg.atmain.x']] };
    }
    const br = branchChecks(ctx);
    if (br) return br;
    if (isConnected(B, leads, mainV) && v < 220)
      return { level: 'warn', t: ['msg.vnot.t'], x: [[v > 5 ? 'msg.vpart.x' : 'msg.vnot.x', [v.toFixed(1)]]] };
    const x = [['msg.pok.x', [v.toFixed(0), Ik.map((i, k) => fmtCur(brA[k], i)).join(' + '), fmtCur(mainA, sum)]]];
    const p = pending(ctx);
    if (p.length) x.push(['msg.hint', [p.join(', ')]]);
    return { level: 'ok', t: ['msg.pok.t'], x };
  }
  const sI = VS / lamps.reduce((s, c) => s + lampR(w[c.idx]), 0);
  if (Ik.every(i => near(i, sI, 0.05)))
    return { level: 'err', t: ['msg.pnot.t'], x: [['msg.pnot.ser']] };
  const bad = lamps.filter((c, k) => !near(Ik[k], Iexp[k], 0.03));
  return { level: 'err', t: ['msg.pnot.t'], x: [['msg.pnot.gen', [bad.map(c => c.label).join(', ')]]] };
}

function screw(g, x, y, r, rot) {

function drawBoard(g) {
  el('rect', { x: 2, y: 2, width: VW - 4, height: VH - 4, rx: 6, fill: 'url(#gFrame)', stroke: '#8b9498', 'stroke-width': 2 }, g);
  el('rect', { x: 20, y: 20, width: VW - 40, height: VH - 40, fill: 'url(#gPanel)', stroke: '#9aa5a1', 'stroke-width': 1.5 }, g);
  const wear = el('g', { 'clip-path': 'url(#cBoard)', stroke: '#8d9a95', fill: 'none' }, g);
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

    const [ax, ay] = p[p.length - 1], [bx, by] = pts[i], [cx, cy] = pts[i + 1];

/* ---------- wiring actions ---------- */
function snapshot(s) { s.undo.push(s.leads.map(Ld => ({ ...Ld, path: Ld.path.slice() }))); if (s.undo.length > 60) s.undo.shift(); }

  if (s.leads.some(Ld => (Ld.a === ta.id && Ld.b === tb.id) || (Ld.a === tb.id && Ld.b === ta.id))) { toast('toast.dup'); return; }
  const count = id => s.leads.filter(Ld => Ld.a === id || Ld.b === id).length;
  if (count(ta.id) >= 3 || count(tb.id) >= 3) { toast('toast.max', 'err'); return; }
  const prev = s.leads.map(Ld => Ld.path);
  const nl = { id: 'w' + (app.seq++), a: ta.id, b: tb.id, color: app.color === 'auto' ? autoColor(ta.id, tb.id, s) : app.color, path: null };
  s.leads.push(nl);
  document.body.classList.add('busy');
  const ok = s.router.place(s.leads, s.leads.length - 1);
  document.body.classList.remove('busy');
  if (!ok) {
    s.leads.pop(); s.leads.forEach((l, i) => l.path = prev[i]);
    toast('toast.noroute', 'err');
    return;
  }
  const added = s.leads.pop(), saved = s.leads.map(l => l.path);
  s.leads.forEach((l, i) => l.path = prev[i]);
  snapshot(s);
  s.leads.forEach((l, i) => l.path = saved[i]);
  s.leads.push(added);
  Snd.plug(); s.sticky = null;
  renderLeads(s); refresh();
}

  renderLeads(s); refresh();
}

  renderLeads(s); refresh();
}

/* ---------- DP switch and evaluation ---------- */
function toggleDP(bid, force, silent) {
  const s = BS[bid];

  s.tripping = false;

  if (force == null) { s.sticky = null; clearTimeout(s.burnTimer); clearTimeout(s.shortTimer); }

}
function refresh(bid) {

  s.res = res;
  s.B.comps.forEach(c => {
    if (c.type !== 'meter') return;
    const R = s.refs[c.id];
    R.group.classList.toggle('alarm', s.dpOn && res.alarm.includes(c.id));
    R.group.classList.toggle('burnt', s.burnt.has(c.id));
  });
  if (s.dpOn && s.tripping) { /* effects already running */ }
  else if (s.dpOn && res.short) {
    s.tripping = true;
    spark(s, res.short); Snd.bang();
    s.sticky = res.status;
    clearTimeout(s.shortTimer);
    s.shortTimer = setTimeout(() => toggleDP(bid, false, true), 650);
  } else if (s.dpOn && res.burn.length) {

    res.burn.forEach(id => { s.burnt.add(id); s.refs[id].group.classList.add('burning', 'burnt', 'smoking'); s.needle[id].v = 900; });
    Snd.crackle(3.2);
    s.sticky = res.status;
    clearTimeout(s.burnTimer);
    const burning = res.burn.slice();
    s.burnTimer = setTimeout(() => {
      burning.forEach(id => {
        s.refs[id].group.classList.remove('burning');
        clearTimeout(s.smokeTimers[id]);
        s.smokeTimers[id] = setTimeout(() => s.refs[id].group.classList.remove('smoking'), 5000);
      });

    }, 3000);

  if (bid === app.cur) {

}

/* ---------- animation ---------- */
const lerpC = (a, b, t) => {
  const pa = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16));

};
function filColor(b) {

      if (c.type === 'meter') {
        const R = s.refs[c.id], N = s.needle[c.id], burnt = s.burnt.has(c.id);
        const val = res.meters[c.id] || 0;
        const target = burnt ? 54 : dialAngle(val / c.fs);
        N.v += (95 * (target - N.a) - 10 * N.v) * dt; N.a += N.v * dt;
        if (N.a > 56) { N.a = 56; N.v = -Math.abs(N.v) * 0.3; }
        if (N.a < -47) { N.a = -47; N.v = Math.abs(N.v) * 0.2; }
        R.needle.setAttribute('transform', `rotate(${N.a.toFixed(2)} ${R.px} ${R.py})`);
        let txt;
        if (burnt) txt = 'Err';
        else if (val > c.fs * 1.25) txt = 'OL';
        else if (c.kind === 'V') txt = val.toFixed(1) + ' V';
        else if (c.unit === 'mA') txt = (val * 1000).toFixed(1) + ' mA';
        else txt = val.toFixed(3) + ' A';
        if (R.lcd.textContent !== txt) R.lcd.textContent = txt;
      } else if (c.type === 'lamp') {
        const R = s.refs[c.id];
        const ratio = Math.max(0, Math.min(1.1, (res.lampP[c.id] || 0) / app.w[c.idx]));
        s.glow[c.id] += (Math.pow(ratio, 0.55) - s.glow[c.id]) * Math.min(1, dt * 7);
        const b = s.glow[c.id];
        R.glow.setAttribute('opacity', (Math.pow(b, 1.3) * 0.95).toFixed(3));
        R.core.setAttribute('opacity', Math.min(1, b * 1.2).toFixed(3));
        R.tint.setAttribute('opacity', (b * 0.5).toFixed(3));
        R.fil.setAttribute('stroke', filColor(b));

requestAnimationFrame(frame);
setInterval(() => { const s = cur(); if (s.dpOn && s.res && s.res.alarm.length) Snd.beep(); }, 420);

/* ---------- pointer ---------- */
function svgPoint(e) {

}

  return best;

  const del = e.target.closest('[data-del]');

  const t = termNear(pt);

  const h = termNear(pt);

  if ((e.key === 'Delete' || e.key === 'Backspace') && app.sel && !inField) { e.preventDefault(); deleteLead(app.sel); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.closest && e.target.closest('[data-dp]')) { e.preventDefault(); toggleDP(app.cur); }
});

/* ---------- toolbar ---------- */
function switchBoard(bid) {
  if (bid === app.cur) return;
  app.pending = null; app.sel = null; app.hover = null;
  cur().previewLayer.textContent = ''; renderLeads(cur());
  app.cur = bid;
  ['series', 'parallel'].forEach(b => BS[b].layer.style.display = b === bid ? '' : 'none');
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === bid));
  renderLeads(cur()); refresh();
}
document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => switchBoard(b.dataset.tab)));

function setLampLabels() {
  ['series', 'parallel'].forEach(bid => BS[bid].B.comps.forEach(c => {
    if (c.type === 'lamp') { const lb = BS[bid].refs[c.id].lab; lb.textContent = `${c.label}  ${app.w[c.idx]} W`; lb.resize && lb.resize(); }
  }));
}
function applyWatts() {
  setLampLabels();
  refresh('series'); refresh('parallel'); refresh();
}
document.querySelectorAll('.wIn').forEach((inp, k) => {
  inp.addEventListener('change', () => {
    if (BS.series.dpOn || BS.parallel.dpOn) { toast('toast.lampoff', 'err'); inp.value = app.w[k]; return; }
    let v = Math.round(+inp.value || W_DEF[k]);
    v = Math.max(W_MIN, Math.min(W_MAX, v));
    inp.value = v; app.w[k] = v; applyWatts();
  });
});
document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
  if (BS.series.dpOn || BS.parallel.dpOn) { toast('toast.lampoff', 'err'); return; }
  app.w = PRESETS[b.dataset.preset].slice();
  document.querySelectorAll('.wIn').forEach((inp, k) => inp.value = app.w[k]);
  applyWatts();
}));
document.querySelectorAll('[data-col]').forEach(b => b.addEventListener('click', () => {
  app.color = b.dataset.col;
  document.querySelectorAll('[data-col]').forEach(x => x.setAttribute('aria-pressed', x === b));
  if (app.sel && app.color !== 'auto') {
    const s = cur(), Ld = s.leads.find(l => l.id === app.sel);
    if (Ld) { Ld.color = app.color; renderLeads(s); }
  }
}));
$('#btnUndo').addEventListener('click', undo);
$('#btnDel').addEventListener('click', () => app.sel && deleteLead(app.sel));
$('#btnReset').addEventListener('click', resetWiring);
$('#btnCheck').addEventListener('click', () => {
  const s = cur();
  if (s.dpOn) { renderStatus(s.sticky || s.res.status); return; }
  const r = evaluate(s.B, s.leads, { dpOn: true, w: app.w, burnt: s.burnt }, true);
  const bad = r.short || r.burn.length || r.alarm.length;
  renderStatus(bad ? { level: 'err', t: r.status.t, x: r.status.x } : r.status, bad ? 'pfx.on' : 'pfx.check');
});
$('#btnDiagram').addEventListener('click', openModal);
$('#btnReplace').addEventListener('click', () => {
  const s = cur();
  if (s.dpOn) { toast('toast.repoff', 'err'); return; }
  s.burnt.forEach(id => { s.refs[id].group.classList.remove('burnt', 'burning', 'smoking'); s.needle[id] = { a: -45, v: 0 }; });
  s.burnt.clear(); s.sticky = null;
  refresh(); toast('toast.replaced');
});
$('#tglRead').addEventListener('change', e => document.body.classList.toggle('noLcd', !e.target.checked));
$('#tglSound').addEventListener('change', e => { Snd.on = e.target.checked; });

/* ---------- observation table ---------- */
function updateTable() {
  const s = cur(), bid = app.cur;
  const head = bid === 'series'
    ? [L('ui.no'), L('ui.lampsW'), 'V (V)', 'V1 (V)', 'V2 (V)', 'V3 (V)', L('ui.sumV'), 'I (mA)', 'I1 (mA)', 'I2 (mA)', 'I3 (mA)', L('ui.check2')]
    : [L('ui.no'), L('ui.lampsW'), 'V (V)', 'V1 (V)', 'V2 (V)', 'V3 (V)', 'IT (A)', 'I1 (A)', 'I2 (A)', 'I3 (A)', L('ui.sumI') + ' (A)', L('ui.check2')];
  let h = '<thead><tr>' + head.map(x => `<th>${x}</th>`).join('') + '</tr></thead><tbody>';
  if (!s.obs.length) h += `<tr><td colspan="${head.length}" class="empty">${L('ui.empty')}</td></tr>`;
  s.obs.forEach((o, i) => {
    const c = o.ok ? 'tick' : 'cross';
    const mark = o.ok ? '✓ ' + L(bid === 'series' ? 'ui.okSumV' : 'ui.okSumI') : '✗';
    h += `<tr><td>${i + 1}</td><td>${o.w}</td><td>${o.V.toFixed(1)}</td><td>${o.V1.toFixed(1)}</td><td>${o.V2.toFixed(1)}</td><td>${o.V3.toFixed(1)}</td>` +
      (bid === 'series'
        ? `<td>${o.sumV.toFixed(1)}</td><td>${(o.I * 1000).toFixed(1)}</td><td>${(o.I1 * 1000).toFixed(1)}</td><td>${(o.I2 * 1000).toFixed(1)}</td><td>${(o.I3 * 1000).toFixed(1)}</td>`
        : `<td>${o.IT.toFixed(3)}</td><td>${o.I1.toFixed(3)}</td><td>${o.I2.toFixed(3)}</td><td>${o.I3.toFixed(3)}</td><td>${o.sumI.toFixed(3)}</td>`) +
      `<td class="${c}">${mark}</td></tr>`;
  });
  $('#obsTable').innerHTML = h + '</tbody>';
  const cc = $('#conclusion');
  cc.hidden = !s.obs.length;
  const sets = new Set(s.obs.map(o => o.w));
  cc.innerHTML = `<h3>${L('ui.concl')}</h3><p>${L(bid === 'series' ? 'ui.conclS' : 'ui.conclP')}</p>` +
    (sets.size < 2 ? `<p class="hint">${L('ui.hintSets')}</p>` : '');
}
$('#btnRecord').addEventListener('click', () => {
  const s = cur(), r = s.res;
  if (!s.dpOn) { toast('toast.recon'); return; }
  if (!r || !r.correct) { toast('toast.recbad', 'err'); return; }
  if (s.obs.length >= 8) s.obs.shift();
  const m = r.meters, wtxt = app.w.join(', ');
  const V1 = m.V1, V2 = m.V2, V3 = m.V3;
  if (app.cur === 'series') {
    const sumV = V1 + V2 + V3;
    s.obs.push({ w: wtxt, V: m.V, V1, V2, V3, sumV, I: m.A, I1: m.A1, I2: m.A2, I3: m.A3,
                 ok: Math.abs(m.V - sumV) <= 0.03 * m.V });
  } else {
    const sumI = m.A1 + m.A2 + m.A3;
    s.obs.push({ w: wtxt, V: m.V, V1, V2, V3, IT: m.A, I1: m.A1, I2: m.A2, I3: m.A3, sumI,
                 ok: Math.abs(m.A - sumI) <= 0.03 * m.A });
  }
  updateTable(); toast('toast.recok', 'ok');
});
$('#btnClear').addEventListener('click', () => { cur().obs = []; updateTable(); });

/* ---------- schematic (IS/IEC 60617 symbols) ---------- */
function schematic(bid) {
  const S = el('svg', { viewBox: '0 0 820 360', class: 'schem', role: 'img' });
  const g = el('g', { stroke: '#1d2a36', 'stroke-width': 2.2, fill: 'none', 'stroke-linecap': 'round' }, S);
  const Ln = (x1, y1, x2, y2) => el('line', { x1, y1, x2, y2 }, g);
  const dot = (x, y) => el('circle', { cx: x, cy: y, r: 4, fill: '#1d2a36' }, g);
  const term = (x, y, lab) => { el('circle', { cx: x, cy: y, r: 6, fill: '#fff' }, g); tx(S, x - 12, y + 5, lab, { class: 'sLab', 'text-anchor': 'end' }); };
  const meterSym = (x, y, lab) => { el('circle', { cx: x, cy: y, r: 18, fill: '#fff' }, g); tx(S, x, y + 6, lab, { class: 'sMeter', 'text-anchor': 'middle' }); };
  const lampSym = (x, y, lab, side) => {
    el('circle', { cx: x, cy: y, r: 18, fill: '#fff' }, g);
    Ln(x - 12.7, y - 12.7, x + 12.7, y + 12.7); Ln(x - 12.7, y + 12.7, x + 12.7, y - 12.7);
    tx(S, side ? x + 26 : x, side ? y + 5 : y - 26, lab, { class: 'sLab', 'text-anchor': side ? 'start' : 'middle' });
  };
  const dp = (x, yT, yB) => {
    [yT, yB].forEach(y => { dot(x - 20, y); Ln(x - 20, y, x + 16, y - 16); dot(x + 22, y); });
    el('line', { x1: x - 2, y1: yT - 8, x2: x - 2, y2: yB - 8, 'stroke-dasharray': '6 5', 'stroke-width': 1.6 }, g);
    tx(S, x, yB + 30, L('sch.dp'), { class: 'sLab', 'text-anchor': 'middle' });
  };
  const top = 70, bot = 290;
  term(50, top, 'L'); term(50, bot, 'N');
  Ln(56, top, 110, top); Ln(56, bot, 110, bot); dp(130, top, bot);
  Ln(152, top, 210, top); Ln(152, bot, 210, bot);
  dot(195, top); dot(195, bot);
  Ln(195, top, 195, (top + bot) / 2 - 18); Ln(195, (top + bot) / 2 + 18, 195, bot); meterSym(195, (top + bot) / 2, 'V');
  if (bid === 'series') {
    Ln(210, top, 262, top); meterSym(280, top, 'A'); Ln(298, top, 340, top);
    const xs = [380, 530, 680];
    xs.forEach((x, k) => {
      meterSym(x - 40, top, 'A' + (k + 1)); lampSym(x + 40, top, 'L' + (k + 1));
      Ln(x - 22, top, x + 22, top);
      if (k) Ln(xs[k - 1] + 58, top, x - 58, top);
      dot(x + 22, top); dot(x + 58, top);
      Ln(x + 22, top, x + 22, top + 60); Ln(x + 58, top, x + 58, top + 60);
      Ln(x + 22, top + 60, x + 28, top + 60); Ln(x + 52, top + 60, x + 58, top + 60);
      meterSym(x + 40, top + 60, 'V' + (k + 1));
    });
    Ln(340, top, 340, top); Ln(xs[2] + 58, top, 760, top); Ln(760, top, 760, bot); Ln(760, bot, 210, bot);
    tx(S, 410, 340, L('sch.note.s'), { class: 'sNote', 'text-anchor': 'middle' });
  } else {
    Ln(210, top, 262, top); meterSym(280, top, 'A'); Ln(298, top, 740, top); Ln(210, bot, 740, bot);
    [400, 550, 700].forEach((x, k) => {
      dot(x, top); dot(x, bot);
      Ln(x, top, x, 112); meterSym(x, 130, 'A' + (k + 1)); Ln(x, 148, x, 192);
      lampSym(x, 210, 'L' + (k + 1), true); Ln(x, 228, x, bot);
      Ln(x, 170, x - 60, 170); Ln(x - 60, 170, x - 60, 192);
      Ln(x, 250, x - 60, 250); Ln(x - 60, 250, x - 60, 228);
      meterSym(x - 60, 210, 'V' + (k + 1));
      dot(x, 170); dot(x, 250);
    });
    tx(S, 410, 340, L('sch.note.p'), { class: 'sNote', 'text-anchor': 'middle' });
  }
  return S;
}
function openModal() {
  $('#modalTitle').textContent = L(app.cur === 'series' ? 'ui.modalS' : 'ui.modalP');
  const box = $('#schemBox'); box.textContent = ''; box.appendChild(schematic(app.cur));
  $('#modal').hidden = false; $('#btnClose').focus();
}
function closeModal() { $('#modal').hidden = true; }
$('#btnClose').addEventListener('click', closeModal);
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
$('#btnDemo').addEventListener('click', () => {
  if (cur().dpOn) { toast('toast.demooff', 'err'); return; }
  closeModal(); demoWire(); toast('toast.demo');
});

/* ---------- language ---------- */
function relabel() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(e => e.textContent = L(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(e => e.setAttribute('aria-label', L(e.dataset.i18nAria)));
  document.title = L('ui.title');
  ['series', 'parallel'].forEach(bid => {
    const s = BS[bid], R = s.refs;
    R.board.querySelector('#bTitle').textContent = L('board.title');
    R.board.querySelector('#bFoot').textContent = L('board.foot');
    R.SUP.t1.textContent = L('board.mains'); R.SUP.t2.textContent = L('board.rating');
    R.SUP.t3.textContent = L('board.supply'); R.SUP.t4.textContent = L('board.danger');
    R.DP.t1.textContent = L('board.dp'); R.DP.t2.textContent = L('board.dpr');
    R.DP.t3.textContent = L('board.line'); R.DP.t4.textContent = L('board.load');
    R.PB.lab.textContent = L('board.pb'); R.NB.lab.textContent = L('board.nb');
  });
  if ($('#modal').hidden === false) openModal();
  renderStatus(cur().sticky || cur().res.status);
  updateTable();
}
$('#langSel').addEventListener('change', e => { LANG = e.target.value; relabel(); });

/* ---------- start ---------- */
document.querySelectorAll('.wIn').forEach((inp, k) => { inp.value = app.w[k]; inp.min = W_MIN; inp.max = W_MAX; });
setLampLabels();
['series', 'parallel'].forEach(b => { setDP(BS[b].refs.DP, false); renderLeads(BS[b]); refresh(b); });
relabel();
refresh();
